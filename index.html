<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security+ SY0-701 Exam Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9ECF0;--sheet:#FFFFFF;--ink:#16202C;--muted:#5A6878;--line:#CBD3DC;--chrome:#1D3557;--chrome-ink:#FFFFFF;--chrome-2:#2B4A72;
  --accent:#9A5F0C;--accent-soft:#F6EAD6;--ok:#22704C;--ok-soft:#DCEFE4;--bad:#B03030;--bad-soft:#F8E1E1;--focus:#2F6FB3;--sel:#E3ECF8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1620;--sheet:#17212D;--ink:#E3E9F0;--muted:#97A5B6;--line:#2C3B4D;--chrome:#0B1C33;--chrome-ink:#E8EEF6;--chrome-2:#1A3355;
  --accent:#E3A448;--accent-soft:#3A2D18;--ok:#5FC293;--ok-soft:#163226;--bad:#E57878;--bad-soft:#3B1F23;--focus:#74A9E6;--sel:#1E3350;}}
:root[data-theme="dark"]{
  --paper:#0F1620;--sheet:#17212D;--ink:#E3E9F0;--muted:#97A5B6;--line:#2C3B4D;--chrome:#0B1C33;--chrome-ink:#E8EEF6;--chrome-2:#1A3355;
  --accent:#E3A448;--accent-soft:#3A2D18;--ok:#5FC293;--ok-soft:#163226;--bad:#E57878;--bad-soft:#3B1F23;--focus:#74A9E6;--sel:#1E3350;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.btn{border:1px solid var(--chrome);background:var(--chrome);color:var(--chrome-ink);padding:.5rem 1rem;border-radius:3px;cursor:pointer;font-weight:500;font-size:.92rem;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
/* App bar */
.bar{background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;position:sticky;top:0;z-index:5}
.bar .title{font-weight:600;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{flex:1}
.bar .count{font-size:.9rem;white-space:nowrap}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--chrome-2);padding:.25rem .6rem;border-radius:3px;font-size:.95rem;white-space:nowrap}
.timer.low{background:var(--bad);color:#fff}
.bar .btn{background:var(--chrome-2);border-color:var(--chrome-2)}
/* Home */
.wrap{max-width:1040px;margin:0 auto;padding:1.5rem 1rem 3rem}
.hero h1{font-size:1.6rem;margin:.25rem 0 .25rem;letter-spacing:-.01em}
.hero p{margin:.25rem 0;max-width:75ch}
.facts{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.5rem}
.facts span{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:.3rem .6rem;font-size:.88rem}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem}
.card h2{margin:0;font-size:1.1rem}
.card .pbqs{font-size:.84rem;color:var(--muted);margin:0}
.card .stats{display:flex;gap:1rem;font-size:.86rem;flex-wrap:wrap}
.card .stats b{font-family:var(--mono);font-weight:500}
.card .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:auto;padding-top:.4rem}
.tag{font-size:.75rem;font-family:var(--mono);padding:.05rem .4rem;border-radius:3px}
.tag.pass{background:var(--ok-soft);color:var(--ok)}.tag.fail{background:var(--bad-soft);color:var(--bad)}.tag.prog{background:var(--accent-soft);color:var(--accent)}
.notes{margin-top:2rem;font-size:.88rem;color:var(--muted);max-width:80ch}
.notes h3{color:var(--ink);font-size:.95rem;margin:1.2rem 0 .3rem}
.notes p{margin:.3rem 0}
/* Exam */
.exam{display:flex;flex-direction:column;min-height:100%}
.qbar{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;background:var(--sheet);border-bottom:1px solid var(--line);font-size:.9rem;position:sticky;top:calc(2.9rem);z-index:4}
.qbar label{display:flex;gap:.4rem;align-items:center;cursor:pointer;user-select:none}
.qbar input{width:1.05rem;height:1.05rem;accent-color:var(--accent)}
.stage{flex:1;padding:1.25rem 1rem 6rem}
.panel{max-width:1100px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1.4rem 1.6rem}
.kind{font-size:.78rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stem{font-size:1.06rem;margin:.4rem 0 1rem;max-width:80ch}
.pick{font-size:.88rem;color:var(--muted);margin:0 0 .6rem}
.opts{list-style:none;padding:0;margin:0;max-width:80ch}
.opts li{margin:0 0 .45rem}
.opts label{display:grid;grid-template-columns:1.4rem 1.4rem 1fr;gap:.5rem;align-items:start;border:1px solid var(--line);border-radius:3px;padding:.6rem .75rem;cursor:pointer;background:var(--sheet)}
.opts label:hover{border-color:var(--chrome-2)}
.opts input{margin:.2rem 0 0;width:1.05rem;height:1.05rem;accent-color:var(--chrome)}
.opts .let{font-family:var(--mono);color:var(--muted)}
.opts label.on{background:var(--sel);border-color:var(--chrome-2)}
.opts label.right{background:var(--ok-soft);border-color:var(--ok)}
.opts label.wrong{background:var(--bad-soft);border-color:var(--bad)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--chrome);display:flex;gap:.5rem;padding:.6rem 1rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px));z-index:5}
.foot .btn{background:var(--chrome-2);border-color:var(--chrome-2)}
.foot .sp{flex:1}
/* Review grid */
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;margin:.25rem 0 1rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem}
.tabs button{border:1px solid var(--line);background:var(--sheet);padding:.3rem .7rem;border-radius:3px;cursor:pointer;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--chrome);color:var(--chrome-ink);border-color:var(--chrome)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:.4rem}
.cells button{position:relative;border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:.5rem .2rem;cursor:pointer;font-family:var(--mono);font-size:.88rem}
.cells button.ans{background:var(--sel)}
.cells button.un{border-style:dashed;color:var(--bad)}
.cells button .f{position:absolute;top:1px;right:4px;font-size:.75rem;color:var(--accent)}
.cells button .p{display:block;font-size:.65rem;color:var(--muted)}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.modal{background:var(--sheet);border:1px solid var(--line);border-radius:4px;max-width:460px;width:100%;padding:1.3rem 1.4rem}
.modal h2{margin:0 0 .5rem;font-size:1.15rem}
.modal .row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.2rem;flex-wrap:wrap}
/* Results */
.score{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:1.1rem;margin-bottom:1.1rem}
.big{font-family:var(--mono);font-size:3rem;line-height:1;font-weight:500}
.verdict{font-weight:700;font-size:1.2rem;letter-spacing:.04em}
.verdict.pass{color:var(--ok)}.verdict.fail{color:var(--bad)}
.dt{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
.dt th{text-align:left;color:var(--muted);font-weight:600;font-size:.8rem;border-bottom:1px solid var(--line);padding:.35rem .4rem}
.dt td{border-bottom:1px solid var(--line);padding:.45rem .4rem;vertical-align:middle}
.meter{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--chrome-2)}
.meter i.good{background:var(--ok)}.meter i.low{background:var(--bad)}
.objs{columns:2 300px;font-size:.88rem;padding-left:1.1rem}
.objs li{break-inside:avoid;margin:.2rem 0}
h3.sec{font-size:1rem;margin:1.5rem 0 .5rem}
.ritem{border:1px solid var(--line);border-radius:3px;margin:.5rem 0;background:var(--sheet)}
.ritem summary{cursor:pointer;padding:.6rem .8rem;display:grid;grid-template-columns:3rem 1.4rem 1fr auto;gap:.5rem;align-items:start;list-style:none}
.ritem summary::-webkit-details-marker{display:none}
.ritem .body{padding:.2rem 1rem 1rem}
.ritem .n{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.ritem .s{font-size:.92rem}
.ritem .o{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
/* PBQ engines (shared with the lab) */
.scenario{max-width:80ch;margin:0 0 1.1rem}.scenario p{margin:.4rem 0}
.netmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem;margin:0 0 1.25rem}
.zone{border:1px dashed var(--line);border-radius:4px;padding:.6rem .7rem;background:var(--paper)}
.zone b{display:block;font-size:.9rem}
.zone code{font-family:var(--mono);font-size:.84rem}
.zone ul{margin:.3rem 0 0;padding:0;list-style:none;font-size:.85rem}
.zone li{display:flex;justify-content:space-between;gap:.5rem}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:760px;font-size:.9rem}
table.grid th{text-align:left;font-weight:600;font-size:.82rem;color:var(--muted);padding:.4rem;border-bottom:1px solid var(--line)}
table.grid td{padding:.45rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
table.grid td.req{max-width:300px;min-width:220px}
table.grid select{width:100%;min-width:92px;padding:.32rem .3rem;border:1px solid var(--line);border-radius:3px;background:var(--sheet);font-family:var(--mono);font-size:.83rem}
table.grid.match select{font-family:var(--sans);font-size:.88rem;min-width:150px}
select.ok{border-color:var(--ok);background:var(--ok-soft)}
select.bad{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.84rem;margin-top:.35rem;color:var(--muted)}
.fix strong{color:var(--ink);font-weight:600}
.explain{font-size:.88rem;margin:.5rem 0 0;padding:.5rem .7rem;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 3px 3px 0;max-width:85ch}
.log{font-family:var(--mono);font-size:.82rem;border:1px solid var(--line);border-radius:4px;overflow-x:auto;background:var(--paper)}
.log button{display:flex;gap:.6rem;width:100%;min-width:680px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:.42rem .6rem;cursor:pointer;white-space:pre;font-family:inherit;font-size:inherit}
.log button:last-child{border-bottom:0}
.log button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.log button .box{flex:none;width:1rem;color:var(--muted)}
.log button.hit{box-shadow:inset 3px 0 0 var(--ok);background:var(--ok-soft)}
.log button.miss,.log button.fp{box-shadow:inset 3px 0 0 var(--bad);background:var(--bad-soft)}
.field{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:1rem 0}
.field select{padding:.4rem .5rem;border:1px solid var(--line);border-radius:3px;background:var(--sheet);min-width:240px}
.order{list-style:none;margin:0;padding:0;max-width:760px}
.order li{display:grid;grid-template-columns:2rem 1fr auto;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:4px;padding:.5rem .6rem;margin-bottom:.4rem;background:var(--sheet)}
.order .pos{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.order .mv{display:flex;gap:.25rem}
.order .mv button{border:1px solid var(--line);background:var(--paper);border-radius:3px;width:2.1rem;height:2.1rem;cursor:pointer}
.order .mv button:disabled{opacity:.35;cursor:default}
.checks{list-style:none;padding:0;margin:.75rem 0 0;font-size:.88rem;max-width:85ch}
.checks li{padding:.3rem 0}
.note{font-size:.85rem;color:var(--muted);margin:.5rem 0 0}
.mark{font-weight:700;margin-right:.3rem}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.hide{display:none!important}
/* placement */
.tray{border:1px dashed var(--line);border-radius:4px;padding:.6rem;background:var(--paper);margin:0 0 .8rem;min-height:3rem}
.tray>b,.dz>b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;font-weight:600}
.dzs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.5rem}
.dz{border:2px solid var(--line);border-radius:4px;padding:.55rem;min-height:7rem;background:var(--sheet);cursor:pointer}
.dz.over,.tray.over{border-color:var(--focus);background:var(--sel)}
.dz.armed{border-style:dashed;border-color:var(--chrome-2)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--chrome-2);background:var(--sheet);border-radius:3px;padding:.3rem .55rem;font-size:.85rem;cursor:grab}
.chip.picked{background:var(--chrome);color:var(--chrome-ink)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}.chip.bad{border-color:var(--bad);background:var(--bad-soft)}
/* investigate */
.hosts{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 .6rem}
.host{border:1px solid var(--line);border-radius:4px;background:var(--sheet);padding:.5rem .7rem;cursor:pointer;text-align:left;min-width:150px}
.host b{display:block;font-family:var(--mono);font-size:.9rem}.host span{font-size:.78rem;color:var(--muted)}
.host[aria-pressed="true"]{border-color:var(--chrome);box-shadow:inset 0 -3px 0 var(--chrome)}
.host.seen{background:var(--paper)}
.win{border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:0 0 1rem}
.win .tb{display:flex;flex-wrap:wrap;gap:0;background:var(--paper);border-bottom:1px solid var(--line)}
.win .tb button{border:0;border-right:1px solid var(--line);background:none;padding:.4rem .75rem;cursor:pointer;font-size:.85rem}
.win .tb button[aria-pressed="true"]{background:var(--sheet);font-weight:600}
.term{margin:0;padding:.8rem 1rem;background:#0E1621;color:#D6E2EE;font-family:var(--mono);font-size:.8rem;line-height:1.55;overflow-x:auto;white-space:pre;min-height:6rem}
.term .ps{color:#7FD1A0}
.qs{display:grid;gap:.6rem;max-width:760px}
.qs label{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:.6rem;align-items:center;font-weight:600;font-size:.92rem}
.qs select{padding:.4rem .5rem;border:1px solid var(--line);border-radius:3px;background:var(--sheet);font-weight:400;width:100%}
@media (max-width:700px){.qs label{grid-template-columns:1fr}}
.pbqtime{font-family:var(--mono)}
@media (max-width:700px){
  .panel{padding:1rem .9rem}
  .bar .title{font-size:.85rem}
  .qbar{top:2.7rem}
  .foot .btn{padding:.5rem .7rem}
  .ritem summary{grid-template-columns:2.4rem 1.2rem 1fr}
  .ritem .o{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MCQ=[{"o":"1.1","s":"A company requires all employees to complete annual security awareness training. Which control category does this BEST represent?","op":["Managerial","Operational","Technical","Physical"],"a":[1],"n":1,"e":"Training is carried out by people as part of day-to-day operations, so CompTIA classifies it as operational."},{"o":"1.1","s":"A security team configures full-disk encryption on all laptops through a management console. Which control category is this?","op":["Managerial","Physical","Operational","Technical"],"a":[3],"n":1,"e":"Controls enforced by systems and software are technical."},{"o":"1.1","s":"The board approves a risk assessment process that must be repeated every year. Which control category does this describe?","op":["Technical","Managerial","Physical","Operational"],"a":[1],"n":1,"e":"Managerial controls are administrative: policies, risk assessments, and governance decisions."},{"o":"1.1","s":"Which of the following is an example of a physical control?","op":["A host-based firewall","Quarterly access reviews performed by managers","Fencing around a data center","A documented onboarding procedure"],"a":[2],"n":1,"e":"Fencing physically restricts access to a space."},{"o":"1.1","s":"A security guard checks identification at a building's front desk. Which control category does CompTIA most commonly assign to the guard?","op":["Operational","Compensating","Managerial","Technical"],"a":[0],"n":1,"e":"Controls carried out by people rather than systems, such as guards, are operational. Compensating is a control type, not a category."},{"o":"1.1","s":"An organization publishes a password standard that defines minimum length and complexity. Which control category is the document itself?","op":["Physical","Operational","Technical","Managerial"],"a":[3],"n":1,"e":"A documented standard is a governance artifact; the system settings that enforce it would be technical."},{"o":"1.1","s":"Which of the following are technical controls? (Choose two.)","op":["A web application firewall","A clean desk policy","Permissions on a file server","Bollards at the building entrance","A visitor log at reception"],"a":[0,2],"n":2,"e":"WAFs and file permissions are enforced by systems; the others are operational, managerial, or physical."},{"o":"1.1","s":"A company installs motion-activated lights in its parking garage and badge readers on stairwell doors. Both controls belong to which category?","op":["Managerial","Technical","Operational","Physical"],"a":[3],"n":1,"e":"Both protect or restrict physical spaces."},{"o":"1.1","s":"After several laptops were stolen from cars, a company encrypts all drives and also puts stickers on the laptops stating that devices are tracked and encrypted. What type of control are the stickers?","op":["Detective","Deterrent","Directive","Preventive"],"a":[1],"n":1,"e":"Stickers discourage theft but can't stop it; the encryption is the preventive control. Directive controls instruct your own staff, not outsiders."},{"o":"1.1","s":"A SOC reviews firewall logs every morning and opens tickets for anything unusual. Last month a review spotted a compromised account a day after it was used. Which control type is the daily review?","op":["Preventive","Detective","Corrective","Compensating"],"a":[1],"n":1,"e":"The review identifies events after they happen. A ticket may lead to correction, but the review itself detects."},{"o":"1.1","s":"After a malware outbreak, administrators reimage the infected machines, then roll out an application allow list so the same malware can't run again. Which control type is the reimaging?","op":["Preventive","Corrective","Compensating","Detective"],"a":[1],"n":1,"e":"Reimaging restores systems after the incident (corrective); the allow list added afterward is preventive."},{"o":"1.1","s":"New employees sign a document agreeing to report lost badges within one hour. Nothing technical enforces this. Which control type is it?","op":["Deterrent","Preventive","Directive","Managerial"],"a":[2],"n":1,"e":"Directive controls tell people what to do and rely on compliance. \"Managerial\" is a category, not a type."},{"o":"1.1","s":"A data center already has badge readers. After a tailgating incident, management adds a guard who compares every badge photo with the person's face before letting them in. What is the guard's check PRIMARILY?","op":["Detective","Compensating","Deterrent","Preventive"],"a":[3],"n":1,"e":"The check stops unauthorized entry before it happens. A guard also deters, but the face check's main purpose is prevention."},{"o":"1.1","s":"A web application firewall blocks a SQL injection attempt and sends an alert that an analyst reviews later. Which control type is the WAF's blocking action?","op":["Deterrent","Detective","Preventive","Corrective"],"a":[2],"n":1,"e":"Blocking stops the attack before it succeeds. The alert is a detective function of the same device, but the question asks about the block."},{"o":"1.1","s":"An organization wants controls that reduce the impact of an incident AFTER it has occurred. Which should it choose? (Choose two.)","op":["Installing a perimeter firewall","Rebuilding a compromised server from a known-good image","Enabling account lockout","Restoring systems from backups","Posting \"authorized personnel only\" signs"],"a":[1,3],"n":2,"e":"Restoration and rebuilding are corrective; the firewall and lockout prevent, and signs deter."},{"o":"1.1","s":"A manufacturer's legacy controller can't support MFA or patching. The security team puts it behind a dedicated firewall that allows only the engineering workstation and logs every session. An auditor asks how to classify the firewall in this context. Which control type BEST describes it?","op":["Detective","Corrective","Preventive","Compensating"],"a":[3],"n":1,"e":"The firewall does block traffic, but here it exists to stand in for controls the system can't support, so \"compensating\" is the more precise answer. Preventive is true but less specific."},{"o":"1.2","s":"A sender digitally signs a contract so they cannot later claim they never sent it. Which concept does this provide?","op":["Authorization","Availability","Confidentiality","Non-repudiation"],"a":[3],"n":1,"e":"A signature made with the sender's private key proves origin, so the sender cannot deny it."},{"o":"1.2","s":"A user signs in, and the system then determines the user may read but not modify a database table. Which AAA step decides the read-only access?","op":["Authorization","Authentication","Identification","Accounting"],"a":[0],"n":1,"e":"Authentication proves identity; authorization decides what that identity may do."},{"o":"1.2","s":"Which AAA component records how long a user stayed connected to a VPN and how much data was transferred?","op":["Accounting","Authentication","Attestation","Authorization"],"a":[0],"n":1,"e":"Accounting tracks resource usage and activity."},{"o":"1.2","s":"A network requires each laptop to present a device certificate before connecting, in addition to the user's credentials. What does the device certificate BEST represent?","op":["Authorization models","Non-repudiation","Authenticating systems","Accounting"],"a":[2],"n":1,"e":"The certificate proves the identity of the device itself."},{"o":"1.2","s":"An organization encrypts customer records in a database so only authorized applications can read them. Which principle is being protected?","op":["Availability","Integrity","Confidentiality","Accounting"],"a":[2],"n":1,"e":"Encryption prevents unauthorized disclosure."},{"o":"1.2","s":"Which of the following directly support the availability of a critical service? (Choose two.)","op":["An uninterruptible power supply","Digitally signing emails","Hashing configuration files","Clustering the servers","Encrypting backups"],"a":[0,3],"n":2,"e":"Clustering and UPS keep the service running; the others address integrity or confidentiality."},{"o":"1.2","s":"A file server uses hashing to confirm that stored documents have not been altered. Which security principle does this support?","op":["Availability","Integrity","Non-repudiation","Confidentiality"],"a":[1],"n":1,"e":"Hashes detect modification, which protects integrity."},{"o":"1.2","s":"A company adds redundant power supplies and a load balancer to its web servers. Which part of the CIA triad does this primarily address?","op":["Integrity","Confidentiality","Non-repudiation","Availability"],"a":[3],"n":1,"e":"Redundancy keeps systems accessible."},{"o":"1.2","s":"A company limits each user to only the segments and applications their role needs, shrinking what an attacker could reach with a stolen account. Which concept is this?","op":["Policy Administrator","Adaptive identity","Subject/system","Threat scope reduction"],"a":[3],"n":1,"e":"Limiting reachable resources reduces the scope of a breach."},{"o":"1.2","s":"An organization compares its current controls against a framework it wants to adopt and documents what is missing. What is this process?","op":["Gap analysis","Penetration testing","Root cause analysis","Risk transference"],"a":[0],"n":1,"e":"A gap analysis measures the difference between current and desired state."},{"o":"1.2","s":"Which statement BEST describes Zero Trust?","op":["Trust is based on which network segment a device uses","Users authenticated once are trusted for the whole day","Devices connected inside the corporate network are trusted automatically after login","No user or device is trusted by default, regardless of network location"],"a":[3],"n":1,"e":"Zero Trust removes implicit trust based on location and verifies continuously."},{"o":"1.2","s":"Which Zero Trust component signals the Policy Enforcement Point to establish or shut down a session based on the policy decision?","op":["Subject","Threat intelligence feed","Policy Engine","Policy Administrator"],"a":[3],"n":1,"e":"The Policy Administrator carries out the Engine's decision."},{"o":"1.2","s":"A team writes rules that weigh user role, device posture, and data sensitivity to decide each access request. Which Zero Trust concept is this?","op":["Threat scope reduction","Policy-driven access control","Implicit trust zones","Gap analysis"],"a":[1],"n":1,"e":"Access decisions come from defined policies that evaluate multiple factors."},{"o":"1.2","s":"In a Zero Trust architecture, which component decides whether to grant or deny a subject's access request?","op":["Implicit trust zone","Policy Engine","Policy Administrator","Policy Enforcement Point"],"a":[1],"n":1,"e":"The Policy Engine decides, the Policy Administrator relays, and the Policy Enforcement Point enforces."},{"o":"1.2","s":"Which Zero Trust component sits in the data plane and allows or blocks the actual connection to a resource?","op":["Policy Engine","Adaptive identity","Policy Administrator","Policy Enforcement Point"],"a":[3],"n":1,"e":"The PEP is the gatekeeper in the data plane."},{"o":"1.2","s":"A Zero Trust system raises authentication requirements when a user signs in from a new country on an unmanaged device. Which concept is this?","op":["Threat scope reduction","Implicit trust zones","Adaptive identity","Policy Enforcement Point"],"a":[2],"n":1,"e":"Adaptive identity uses context and risk to adjust authentication."},{"o":"1.2","s":"A company plants a fake API key in a code repository; if the key is ever used, security knows the repository was compromised. What is this?","op":["Honeyfile","Honeytoken","Canary deployment","Honeypot"],"a":[1],"n":1,"e":"A honeytoken is fake data that signals compromise when used."},{"o":"1.2","s":"Which sensor type detects intruders by sensing body heat?","op":["Pressure","Microwave","Infrared","Ultrasonic"],"a":[2],"n":1,"e":"Infrared sensors detect heat signatures."},{"o":"1.2","s":"A sensor detects movement by emitting high-frequency sound waves and measuring their reflections. Which sensor is this?","op":["Infrared","Pressure","Ultrasonic","Microwave"],"a":[2],"n":1,"e":"Ultrasonic sensors use sound beyond human hearing; microwave sensors use radio waves."},{"o":"1.2","s":"A team deploys a deliberately vulnerable server with no business function and records every connection to it. What is the PRIMARY goal?","op":["Providing failover for production servers","Observing attacker techniques and tools","Load testing the perimeter firewall","Filtering malicious email attachments"],"a":[1],"n":1,"e":"A honeypot has no legitimate users, so anything that touches it is an attacker worth studying."},{"o":"1.2","s":"Which physical control is designed to stop vehicles from being driven into a building entrance?","op":["Fencing","Access control vestibule","Bollards","Lighting"],"a":[2],"n":1,"e":"Bollards are sturdy posts that block vehicles."},{"o":"1.2","s":"An access control vestibule is MOST effective at preventing which of the following?","op":["Tailgating","Shoulder surfing","Vishing","Dumpster diving"],"a":[0],"n":1,"e":"Interlocking doors let only one person through at a time."},{"o":"1.2","s":"A file named \"Passwords-2026.xlsx\" is placed on a share that no legitimate user should open; any access triggers an alert. What is this?","op":["Honeyfile","Honeytoken","Honeypot","Honeynet"],"a":[0],"n":1,"e":"A honeyfile is a decoy file that alerts when accessed."},{"o":"1.2","s":"Researchers deploy several intentionally vulnerable servers, routers, and workstations on an isolated segment to observe attackers. What have they built?","op":["Honeytoken","Honeyfile","Screened subnet","Honeynet"],"a":[3],"n":1,"e":"A honeynet is a network of honeypots."},{"o":"1.3","s":"After an OS update on its server, an old payroll application refuses to start because it only supports the previous OS version. Which consideration was missed during planning?","op":["Version control","Stakeholder communication","Maintenance window timing","Legacy application compatibility"],"a":[3],"n":1,"e":"Legacy applications may not support newer platforms; impact analysis should have caught it."},{"o":"1.3","s":"Who should normally approve a significant change to a production system?","op":["The vendor that supplied the affected software","The engineer who wrote and will implement it","The change advisory board or designated approvers","Any employee whose work the change affects"],"a":[2],"n":1,"e":"Separating the requester from the approver keeps changes accountable."},{"o":"1.3","s":"A change was approved and implemented successfully. Which activities should follow? (Choose two.)","op":["Update diagrams and documentation","Write the backout plan","Request approval from the board","Run the impact analysis","Verify the system works as expected"],"a":[0,4],"n":2,"e":"Impact analysis, approval, and the backout plan all come before implementation."},{"o":"1.3","s":"A VPN flaw is being actively exploited and a vendor patch is ready. The change board only meets weekly. What should the team do?","op":["Skip testing and documentation for all urgent changes from now on","Use the emergency change process, then document and review the change afterward","Wait for the next scheduled board meeting so the change gets a full review and vote","Patch quietly without a ticket to save time"],"a":[1],"n":1,"e":"Emergency processes allow fast approval while keeping accountability; skipping the process removes oversight."},{"o":"1.3","s":"A database upgrade passed staging tests, but in production it fails halfway and the application is down. What should the team do FIRST?","op":["Keep troubleshooting the failed upgrade directly in production until it works","Extend the maintenance window indefinitely","Update the documentation to describe the failure","Execute the backout plan to restore the previous version"],"a":[3],"n":1,"e":"The backout plan exists for exactly this; restoring service comes before troubleshooting."},{"o":"1.3","s":"An engineer will replace the certificate on the single sign-on server, which handles logins for email, HR, payroll, and VPN. Which part of the change request deserves the MOST attention?","op":["Who will update diagrams afterward","Whether the engineer has used this CA before","The certificate vendor's pricing","Mapping the systems that depend on SSO"],"a":[3],"n":1,"e":"Many services rely on SSO, so dependencies drive the impact of the change."},{"o":"1.3","s":"Two administrators made unrecorded firewall changes the same night, and now no one can tell which change broke the payroll connection. Which practice would have prevented this confusion?","op":["Installing a second firewall in parallel","A longer overnight maintenance window for the whole firewall team to share","A more detailed acceptable use policy","Version control with change records for the configuration"],"a":[3],"n":1,"e":"Version control and change records show exactly what changed, when, and by whom."},{"o":"1.3","s":"A change will restart the web cluster at 2:00 a.m. The engineer realizes it will briefly drop every active customer session. Where should this have been captured?","op":["In the incident response playbook for outages","Nowhere, since 2:00 a.m. traffic is very low","In the acceptable use policy's maintenance section","In the change request's downtime and restart impact"],"a":[3],"n":1,"e":"Restarts and the downtime they cause are technical implications the request must document."},{"o":"1.4","s":"When an administrator generates a CSR for a web server, what does the request contain?","op":["The CA's private key and the server's hostname","The server's public key and identifying details","The root CA certificate and the server's hostname","The server's private key and identifying details"],"a":[1],"n":1,"e":"The private key never leaves the server; the CSR carries the public key and subject details."},{"o":"1.4","s":"An employee with an encrypted laptop leaves the company, and her files must be recovered. Recovery works because a copy of every key was held by a trusted third party. Which concept made this possible?","op":["A certificate revocation list","Certificate pinning","Key escrow","Key stretching"],"a":[2],"n":1,"e":"Escrow stores keys with a trusted party for recovery."},{"o":"1.4","s":"Users get certificate warnings on the intranet portal, but only on new laptops built from a fresh image. The certificate is valid and was issued by the company's internal CA. What is the MOST likely cause?","op":["The certificate was revoked through OCSP","The new image lacks the internal root CA certificate","The portal uses a wildcard certificate that new laptops reject","The certificate's key length is too long"],"a":[1],"n":1,"e":"Devices trust a chain only if they trust its root, and the fresh image is missing the internal root."},{"o":"1.4","s":"An attacker copied a web server's private key. The certificate doesn't expire for 11 months. What should happen FIRST?","op":["Revoke the certificate and reissue it with a new key pair","Change the server's administrator password","Wait for the certificate to expire naturally","Renew the certificate early but keep using the same key pair"],"a":[0],"n":1,"e":"A compromised key means revocation; reusing the key keeps the compromise alive."},{"o":"1.4","s":"A busy website wants browsers to confirm its certificate hasn't been revoked, without each browser contacting the CA and slowing page loads. What should the site enable?","op":["A larger CRL","OCSP stapling","Key escrow","A wildcard certificate"],"a":[1],"n":1,"e":"With stapling, the server attaches a recent CA-signed status response, so clients don't query the CA themselves."},{"o":"1.4","s":"Auditors recommend keeping a company's root CA offline. How do hundreds of servers still get certificates day to day?","op":["An intermediate CA signed by the root issues them","Certificates are copied from a wildcard backup","Servers switch to self-signed certificates","The root is brought online for every request"],"a":[0],"n":1,"e":"An offline root signs an intermediate that handles issuance, so the root stays protected."},{"o":"1.4","s":"A developer must send a confidential file to a partner and prove it came from her. Which keys does she use?","op":["Sign and encrypt with one shared key the partner also holds","Sign with the partner's public key; encrypt with her private key","Sign with her private key; encrypt with the partner's public key","Sign with her public key; encrypt with the partner's private key"],"a":[2],"n":1,"e":"Signing uses the sender's private key; confidentiality uses the recipient's public key."},{"o":"1.4","s":"A company wants one certificate covering example.com, example.net, and shop.example.org. Which option fits BEST?","op":["One certificate with all three as Subject Alternative Names","A wildcard certificate issued for *.example.com","A code-signing certificate issued to the company","Three separate self-signed certificates, one per site"],"a":[0],"n":1,"e":"A wildcard covers subdomains of one domain only; SAN entries can list different domains."},{"o":"1.4","s":"A company encrypts individual customer rows in a database rather than the whole disk or database. Which encryption level is this?","op":["Full-disk","Partition","Volume","Record"],"a":[3],"n":1,"e":"Record-level encryption protects individual entries."},{"o":"1.4","s":"Which type of encryption uses the same key to encrypt and decrypt?","op":["Symmetric","Asymmetric","Digital signature","Hashing"],"a":[0],"n":1,"e":"Symmetric encryption uses one shared key; asymmetric uses a key pair."},{"o":"1.4","s":"Two parties must agree on a shared secret over an untrusted network without ever sending the key itself. Which technique should they use?","op":["Key escrow with a third party","Diffie-Hellman key exchange","RSA digital signatures","SHA-256 message hashing"],"a":[1],"n":1,"e":"Diffie-Hellman derives a shared secret over an insecure channel; signatures prove origin but don't create a shared key."},{"o":"1.4","s":"A password database stores a random value with each hash so identical passwords produce different hashes. What is this value?","op":["Initialization vector","Digital signature","Salt","Escrowed key"],"a":[2],"n":1,"e":"Salts defeat precomputed rainbow tables."},{"o":"1.4","s":"Which chip on a laptop's motherboard stores encryption keys and records secure boot measurements?","op":["Secure enclave","Trusted Platform Module","Hardware security module","Key management system"],"a":[1],"n":1,"e":"A TPM is built into individual devices; HSMs serve the enterprise."},{"o":"1.4","s":"A bank needs a dedicated, tamper-resistant appliance to generate and protect keys for thousands of transactions per second. What should it deploy?","op":["Trusted Platform Module","Self-encrypting drive","Password vault","Hardware security module"],"a":[3],"n":1,"e":"HSMs provide high-performance, enterprise-scale key protection."},{"o":"1.4","s":"An attacker hides a malicious script inside the pixel data of an image. Which technique is this?","op":["Steganography","Data masking","Key stretching","Tokenization"],"a":[0],"n":1,"e":"Steganography conceals data inside other data."},{"o":"1.4","s":"Which technology uses a distributed ledger in which each block contains the hash of the previous block?","op":["Key management system","Blockchain","Certificate revocation list","Secure enclave"],"a":[1],"n":1,"e":"Chained hashes make blockchain records tamper-evident."},{"o":"2.1","s":"Over three years, an intruder quietly kept access to a satellite maker's design servers, used custom malware never seen before, and exfiltrated small amounts of data at a time. No ransom was demanded. Which threat actor is MOST likely?","op":["Hacktivist","Organized crime","Nation-state","Insider threat"],"a":[2],"n":1,"e":"Long dwell time, custom tooling, and no financial demand point to well-funded espionage. Organized crime usually monetizes quickly."},{"o":"2.1","s":"A school website is knocked offline with a DDoS tool downloaded from a forum. The attacker brags online but names no cause and makes no demands. Which threat actor BEST fits?","op":["Insider threat","Organized crime","Hacktivist","Unskilled attacker"],"a":[3],"n":1,"e":"Off-the-shelf tools with no cause or profit motive suggest an unskilled attacker; a hacktivist would tie the attack to a cause."},{"o":"2.1","s":"After a company announces layoffs, its website is defaced with a message attacking executive pay, signed by an online collective that has hit other firms for similar reasons. Which threat actor is MOST likely?","op":["Insider threat","Unskilled attacker","Organized crime","Hacktivist"],"a":[3],"n":1,"e":"A public, cause-driven message from a known collective points to hacktivists. The layoffs make an insider tempting, but the signature and the pattern of past attacks point to the group."},{"o":"2.1","s":"A marketing team pays for an AI transcription service with a corporate card and uploads recordings of customer calls without telling IT. Which category does this represent?","op":["Supply chain risk","Shadow IT","Unskilled attacker","Insider threat"],"a":[1],"n":1,"e":"Unapproved technology used for legitimate work is shadow IT; an insider threat implies intentional misuse of access."},{"o":"2.1","s":"A group runs ransomware-as-a-service, recruiting affiliates and splitting ransom payments with them. Which threat actor is this?","op":["Organized crime","Nation-state","Hacktivist","Unskilled attacker"],"a":[0],"n":1,"e":"A structured, profit-sharing criminal business is organized crime, even if some affiliates are low-skilled."},{"o":"2.1","s":"A DBA with valid credentials copies customer records before resigning to join a competitor. Which statement about this actor is MOST accurate?","op":["An unskilled attacker, because no exploit was needed","An external actor using stolen credentials","An internal actor misusing authorized access","Shadow IT, because no approved tools were used"],"a":[2],"n":1,"e":"Insiders already hold legitimate access, which is what makes them hard to detect."},{"o":"2.1","s":"Which attribute BEST explains why nation-state actors are so hard to defend against?","op":["Funding to develop custom zero-day exploits","Heavy reliance on publicly available tools","A focus on quick financial payouts","A preference for highly visible attacks"],"a":[0],"n":1,"e":"Resources let them build custom exploits and sustain long campaigns."},{"o":"2.1","s":"A team is listing threat actors that originate inside the organization. Which should it include? (Choose two.)","op":["Shadow IT","Hacktivist","Insider threat","Organized crime","Nation-state"],"a":[0,2],"n":2,"e":"Insiders and shadow IT are internal. The others are external, even when they recruit insiders."},{"o":"2.1","s":"A foreign agency quietly reads a defense contractor's email for months and never disrupts operations. Which motivation is MOST likely?","op":["Revenge","Service disruption","Espionage","Financial gain"],"a":[2],"n":1,"e":"Long-term covert collection is espionage."},{"o":"2.1","s":"An engineer fired for misconduct uses an account HR forgot to disable to delete the team's code repository. Which motivation is MOST likely?","op":["Revenge","Data exfiltration","Espionage","Financial gain"],"a":[0],"n":1,"e":"Destruction right after termination, with nothing taken, suggests revenge."},{"o":"2.1","s":"A researcher finds a flaw in a medical device, gives the maker 90 days to fix it, and publishes details only after a patch ships. Which motivation BEST fits?","op":["Disruption/chaos","Financial gain","Ethical","Philosophical/political beliefs"],"a":[2],"n":1,"e":"Coordinated disclosure aims to get the flaw fixed safely, which is an ethical motive."},{"o":"2.1","s":"On election night, attackers flood a government results website so no one can reach it, and they make no demands. Which motivation BEST describes the goal?","op":["Data exfiltration","Service disruption","Blackmail","Espionage"],"a":[1],"n":1,"e":"Making a service unavailable is service disruption."},{"o":"2.1","s":"During a military conflict, wiper malware spreads across a country's banks and destroys data, with no ransom note. Which motivation BEST fits?","op":["Blackmail","War","Financial gain","Revenge"],"a":[1],"n":1,"e":"Destructive attacks during armed conflict are motivated by war."},{"o":"2.1","s":"An attacker copies 2 million card numbers from a retailer and sells them on a dark web market. Which motivation BEST describes this?","op":["Espionage","Financial gain","Data exfiltration","Disruption/chaos"],"a":[1],"n":1,"e":"Selling stolen data is about profit; exfiltration is how they got it."},{"o":"2.1","s":"A group leaks an oil company's internal documents to protest a pipeline project and asks for nothing. Which motivation BEST fits?","op":["Espionage","Blackmail","Financial gain from selling the documents","Philosophical/political beliefs"],"a":[3],"n":1,"e":"There's no demand, so it isn't blackmail; a cause drives it."},{"o":"2.1","s":"Attackers steal a law firm's client files and threaten to publish them unless paid, but encrypt nothing. Which motivation BEST describes this?","op":["Blackmail","Service disruption","Data exfiltration","Espionage"],"a":[0],"n":1,"e":"Threatening exposure for payment is blackmail. Exfiltration is the method used, not the motivation."},{"o":"2.2","s":"New IP cameras still accept the manufacturer's documented admin password. Which vector is MOST exposed?","op":["Unsupported systems","Open service ports","Vulnerable firmware","Default credentials"],"a":[3],"n":1,"e":"Publicly documented credentials let anyone log in."},{"o":"2.2","s":"Lab analyzers run an OS the vendor stopped patching two years ago. Which vector does this represent?","op":["Zero-day vulnerabilities","Misconfigured security settings","Unsupported systems and applications","Vulnerable client-based software"],"a":[2],"n":1,"e":"Known flaws stay open permanently; a zero-day is a flaw no one knew about yet."},{"o":"2.2","s":"Which situation BEST illustrates a client-based software risk rather than an agentless one?","op":["A flaw in a remote scanner with no local install","A flaw in a cloud provider's hypervisor","A flaw in a web portal that staff reach through their browsers","A flaw in a desktop VPN client installed on every laptop"],"a":[3],"n":1,"e":"Software installed on each endpoint is client-based."},{"o":"2.2","s":"Employees receive WhatsApp messages from \"HR\" with a link to update bank details. Which message-based vector is this?","op":["Voice call","SMS","Instant messaging","Email"],"a":[2],"n":1,"e":"WhatsApp is an instant messaging platform, not SMS."},{"o":"2.2","s":"A malicious PDF downloaded from a vendor portal exploits a flaw in the reader when opened. Which vector BEST describes the delivery?","op":["Image-based","File-based","Removable device","Watering hole"],"a":[1],"n":1,"e":"The payload lives in a document file; nothing suggests the portal itself was compromised."},{"o":"2.2","s":"A fake QR code sticker on a restaurant table leads to a payment page that steals card details. Which vector BEST fits?","op":["Image-based","SMS","File-based","Watering hole"],"a":[0],"n":1,"e":"QR codes are image-based lures; a watering hole compromises a legitimate site."},{"o":"2.2","s":"A penetration tester leaves USB drives labeled \"Executive Bonuses 2026\" in a lobby, and three employees plug them in. Which attack vector did the test exploit?","op":["Supply chain","File-based","Removable device","Unsecure wired network"],"a":[2],"n":1,"e":"The delivery mechanism was removable media; the file on it is secondary."},{"o":"2.2","s":"A DMZ web server also listens on FTP, Telnet, and SMB, though only HTTPS is needed. What is the PRIMARY problem?","op":["Open service ports widening the attack surface","Vulnerable client-based software","Default credentials left on the web server's admin page","An unsupported operating system"],"a":[0],"n":1,"e":"Every unneeded listener is an entry point."},{"o":"2.2","s":"A caller claiming to be a regional VP demands an urgent password reset. He knows the CEO's name, the VP's employee ID, and the help desk ticket format, but the technician can't reach the VP through the directory. What should the technician do?","op":["Reset it and notify the VP's manager by email","Reset it, then enable MFA on the account immediately","Refuse the reset until identity is verified the standard way","Reset it, since the caller supplied a valid employee ID"],"a":[2],"n":1,"e":"Internal details can be researched by pretexters; knowing them doesn't prove identity."},{"o":"2.2","s":"Users get texts that appear to come from the payroll provider, linking to payro11-provider.com, a page that copies the provider's login. Which term BEST describes the overall attack?","op":["Pharming","Smishing","Brand impersonation","Typosquatting"],"a":[1],"n":1,"e":"It's delivered by SMS, so it's smishing; the look-alike domain and fake page are techniques inside it."},{"o":"2.2","s":"A rival fabricates a story about a CEO's arrest, and employees who believe it share it widely. Which pair correctly describes the rival's and the employees' actions?","op":["Misinformation; disinformation","Impersonation; misinformation","Disinformation; disinformation","Disinformation; misinformation"],"a":[3],"n":1,"e":"The creator knows it's false; people who believe it and share it spread misinformation."},{"o":"2.2","s":"Accounts payable receives an invoice-change request from a domain one character different from the vendor's. Which control would MOST directly help staff catch this?","op":["Awareness training on password reuse","S/MIME encryption of outbound email","DMARC enforcement on the company's own domain","Gateway tagging of look-alike and external domains"],"a":[3],"n":1,"e":"The company's DMARC protects its own domain, not look-alikes of a vendor's; tagging look-alike senders helps directly."},{"o":"2.2","s":"Which are the STRONGEST signs of a business email compromise attempt? (Choose two.)","op":["The company logo in the signature","A correct internal project name in the message","Instructions to skip the normal call-back verification","A message sent outside business hours","A payment-change request from a real executive's mailbox"],"a":[2,4],"n":2,"e":"BEC relies on genuine accounts and pressure to bypass checks; project names, timing, and logos appear in legitimate mail too."},{"o":"2.2","s":"A clerk gets a call from \"the bank's fraud team.\" The caller knows the account number and recent transaction amounts and asks for a one-time code to \"block a fraudulent transfer.\" What should the clerk do?","op":["Provide the code once the caller repeats the account number","Ask the caller to put the request in an email first","Verify the caller by asking for the branch's street address","Hang up and call the bank on a number from an official source"],"a":[3],"n":1,"e":"Attackers can research account details, branch addresses, and spoof email. Only an independent callback verifies."},{"o":"2.2","s":"Engineers at several aerospace firms are infected after visiting a niche industry forum they all use. No suspicious emails were found. Which attack is MOST likely?","op":["Watering hole","Spear phishing","Business email compromise","Typosquatting"],"a":[0],"n":1,"e":"Compromising a site the targets already visit is a watering hole; spear phishing needs a message."},{"o":"2.2","s":"An employee gets an email from \"IT Support\" warning that her mailbox will be disabled in two hours unless she re-validates her account. It greets her by name, carries the company logo, and the link text reads portal.company.com. The sender is it-support@company-helpdesk.net. Which detail is the STRONGEST indication the message is malicious?","op":["The sender's domain is one the company doesn't own","The visible link text may hide a different destination","The message asks her to re-enter her credentials","The two-hour deadline pressures her to act quickly"],"a":[0],"n":1,"e":"All four are red flags, but only the sender domain is a verified fact proving it didn't come from IT. Deadlines and login prompts appear in real IT notices, and the link destination is never revealed."},{"o":"2.2","s":"Switches arrive from a reseller with firmware whose hash differs from the manufacturer's published value. What is the MOST likely concern?","op":["A zero-day in the firmware","A misconfiguration by the installer","Tampering in the supply chain","Default credentials on the switches"],"a":[2],"n":1,"e":"A hash mismatch on delivery points to tampering somewhere between the factory and you."},{"o":"2.2","s":"A company wants assurance that a new SaaS vendor's own suppliers won't become a path into its data. What should it request?","op":["Proof the vendor's staff completed awareness training","A non-disclosure agreement covering everything shared under the contract","The vendor's SLA uptime commitments","The vendor's subcontractor list and third-party risk practices"],"a":[3],"n":1,"e":"Supply chain risk extends to the vendor's suppliers; the others don't address it."},{"o":"2.2","s":"A vendor's build server is compromised, and a signed but malicious update reaches every customer. Why didn't code-signing checks stop it?","op":["The update used a self-signed certificate","Customers had disabled signature verification","Code signing only verifies the publisher's email address","The code was altered before signing, so the signature was valid"],"a":[3],"n":1,"e":"Signing proves who published the code and that it wasn't changed afterward, not that the build was clean."},{"o":"2.2","s":"A contractor's laptop, compromised at home, connects through a site-to-site VPN the contractor's firm maintains with the company. Which vector does this represent?","op":["Unsecure wireless network at the contractor's home","Removable device","Supply chain through a third-party connection","Watering hole"],"a":[2],"n":1,"e":"A trusted third-party connection carried the compromise in."},{"o":"2.2","s":"Attackers breach a managed service provider and use its remote monitoring tool to push ransomware to 40 client companies. How were the clients compromised?","op":["Through a watering hole on the MSP's website","Through a supply chain relationship with the MSP","Through credential replay against each client","Through a compromised vendor software update"],"a":[1],"n":1,"e":"The trusted MSP connection was the path; no software update was involved."},{"o":"2.2","s":"An executive works from a hotel lobby on open Wi-Fi without the VPN. Which risk is GREATEST?","op":["Malware delivered by removable media","Supply chain tampering with the laptop","Bluetooth pairing attacks from nearby guests","Interception of traffic on the unsecure network"],"a":[3],"n":1,"e":"Open Wi-Fi traffic can be captured or redirected."},{"o":"2.2","s":"A visitor plugs into a conference room wall jack and gets an address on the corporate VLAN. Which control would have MOST directly prevented this?","op":["A host firewall on corporate laptops","802.1X port-based authentication","MAC address filtering on the switch","Disabling DHCP on the VLAN"],"a":[1],"n":1,"e":"MAC filtering is easily spoofed and a static IP bypasses DHCP; 802.1X requires authentication first."},{"o":"2.2","s":"In a train station, a phone accepts an unsolicited Bluetooth connection and its contacts are copied. Which control BEST prevents this?","op":["Enabling WPA3 on the phone's Wi-Fi","Keeping Bluetooth off or non-discoverable","Using a longer screen-lock PIN","Running a mobile VPN client"],"a":[1],"n":1,"e":"Bluetooth attacks need the radio to be discoverable or pairable."},{"o":"2.3","s":"Two simultaneous gift-card redemptions both succeed because each checks the balance before either deducts it. Which vulnerability is this?","op":["Race condition","Cross-site request forgery","Replay attack","Integer overflow"],"a":[0],"n":1,"e":"Concurrent check-then-act operations create a race condition."},{"o":"2.3","s":"An exploit works on one server but fails on an identical one, because memory addresses change at every reboot. Which protection does the second server use?","op":["Code signing","Data execution prevention (DEP) on all memory","Address space layout randomization","Sandboxing"],"a":[2],"n":1,"e":"ASLR randomizes addresses; DEP blocks execution in data areas but doesn't move them."},{"o":"2.3","s":"A company wants assurance that updates installed on laptops are authentic and unmodified. Which check is MOST effective?","op":["Downloading only over HTTPS","Verifying the vendor's code-signing signature","Scanning the update with antivirus","Comparing file size with the prior version"],"a":[1],"n":1,"e":"HTTPS protects only the download; a valid signature verifies the publisher and integrity."},{"o":"2.3","s":"A setuid program checks that a user may write to /tmp/report, then opens it a moment later. An attacker swaps the file for a link to /etc/passwd between the two steps. Which vulnerability is this?","op":["Time-of-check to time-of-use race condition","Privilege escalation through misconfiguration","Directory traversal","Buffer overflow"],"a":[0],"n":1,"e":"The flaw is the gap between check and use. Privilege escalation is the result, not the vulnerability."},{"o":"2.3","s":"A service crashes when sent a 5,000-character username, and the crash dump shows the instruction pointer overwritten with the attacker's data. Which vulnerability is this?","op":["Race condition","Integer overflow","Memory injection","Buffer overflow"],"a":[3],"n":1,"e":"Overwriting adjacent memory, including the instruction pointer, is a buffer overflow."},{"o":"2.3","s":"EDR sees a legitimate Windows process making odd connections. Memory analysis finds code running inside it that never existed on disk. Which technique is this?","op":["Malicious update","Memory injection","Rootkit installation","Buffer overflow"],"a":[1],"n":1,"e":"Code placed into another process's memory is memory injection; a rootkit hides at the kernel level."},{"o":"2.3","s":"A popular open-source library's maintainer account is hijacked, and a backdoored version is published to the package registry. Which vulnerability BEST describes this?","op":["Race condition","Zero-day vulnerability","Malicious update","Misconfiguration"],"a":[2],"n":1,"e":"A trusted update channel delivered malicious code."},{"o":"2.3","s":"Which control MOST directly prevents buffer overflow flaws in new code?","op":["A web application firewall","Address space layout randomization","Data execution prevention","Bounds checking when handling input"],"a":[3],"n":1,"e":"ASLR and DEP make exploitation harder but don't remove the overflow; bounds checking prevents it."},{"o":"2.3","s":"Developers must fix a SQL injection flaw in the code itself. Which fix is MOST effective?","op":["A WAF rule for the endpoint","Parameterized queries","Input length limits","Escaping single quotes in input"],"a":[1],"n":1,"e":"Escaping is incomplete and a WAF is compensating; parameterized queries separate data from code."},{"o":"2.3","s":"A standard user exploits a kernel flaw to gain SYSTEM privileges. Which vulnerability category does the kernel flaw belong to?","op":["Application-based","Hardware-based","Operating system-based","Firmware-based"],"a":[2],"n":1,"e":"The kernel is part of the OS."},{"o":"2.3","s":"A login form returns every user's record when the username field contains ' OR '1'='1. Which vulnerability is this?","op":["Command injection","Cross-site scripting","LDAP injection","SQL injection"],"a":[3],"n":1,"e":"Quote-and-OR syntax manipulates a SQL query."},{"o":"2.3","s":"A forum post contains a script that runs in every visitor's browser and steals their session cookies. Which vulnerability is this?","op":["Cross-site request forgery","Stored cross-site scripting","Reflected cross-site scripting","Session replay"],"a":[1],"n":1,"e":"The script persists on the site; reflected XSS needs a crafted link per victim."},{"o":"2.3","s":"An attacker in a guest VM exploits a virtual network driver flaw to run code on the host hypervisor. Which vulnerability is this?","op":["Privilege escalation in the guest","VM escape","Resource reuse","Container breakout"],"a":[1],"n":1,"e":"Breaking out of the VM into the hypervisor is VM escape."},{"o":"2.3","s":"A cloud tenant reads fragments of another tenant's data from newly allocated storage that wasn't wiped. Which vulnerability is this?","op":["Misconfigured access policy","VM escape","Resource reuse","Side-channel attack"],"a":[2],"n":1,"e":"Unsanitized reused resources leak previous data."},{"o":"2.3","s":"Switches have reached end-of-life. They still work and sit behind a firewall. What is the MOST significant long-term risk?","op":["Throughput will degrade over time","Logs will stop reaching the SIEM","Configurations will reset to defaults","New flaws will never be patched"],"a":[3],"n":1,"e":"End-of-life means no more security fixes."},{"o":"2.3","s":"Malware survives a full disk wipe and OS reinstall on a server. Where is it MOST likely hiding?","op":["In the boot partition","In a user profile","In the swap file","In the firmware"],"a":[3],"n":1,"e":"A wipe clears partitions, profiles, and swap; firmware persists."},{"o":"2.3","s":"MDM reports two jailbroken corporate phones. Which risks does this create? (Choose two.)","op":["The carrier suspends cellular service","OS security controls may be bypassed","Device encryption is automatically disabled","The phones stop receiving app updates","Unvetted apps can be installed"],"a":[1,4],"n":2,"e":"Jailbreaking removes OS protections and allows unvetted apps; the others don't follow automatically."},{"o":"2.3","s":"A storage bucket of invoices was set to public read during testing and never changed back. Which vulnerability is this?","op":["Resource reuse","Zero-day","Misconfiguration","Insecure API"],"a":[2],"n":1,"e":"A setting error exposed the data."},{"o":"2.3","s":"An employee installs an app on an Android work phone from an APK file a friend sent. Which risk does this introduce?","op":["Jailbreaking the OS","Carrier unlocking","Rooting the device's operating system","Sideloading unvetted software"],"a":[3],"n":1,"e":"Installing outside the official store is sideloading; rooting modifies the OS itself."},{"o":"2.3","s":"An iPhone user installs a tool that removes Apple's restrictions so apps can reach system files. What is this called, and what is the main risk?","op":["Rooting; the carrier stops pushing operating system updates","Sideloading; apps skip store review","Unlocking; the phone works on any network","Jailbreaking; OS security controls can be bypassed"],"a":[3],"n":1,"e":"Jailbreaking is the iOS term; rooting is Android."},{"o":"2.3","s":"A flaw is being exploited in the wild, and the vendor learned of it only this morning. No patch exists. What is this?","op":["Zero-day vulnerability","Supply chain compromise","Misconfiguration","Unpatched known vulnerability"],"a":[0],"n":1,"e":"No patch and newly discovered makes it a zero-day."},{"o":"2.3","s":"A server negotiates TLS 1.0 with any client that requests it, though it supports TLS 1.3. Which vulnerability category is this?","op":["Cryptographic","Hardware","Application-based","Firmware"],"a":[0],"n":1,"e":"Accepting a weak protocol version is a cryptographic weakness."},{"o":"2.3","s":"In cloud environments, which is the MOST common cause of data exposure?","op":["Misconfigured permissions and access policies","Hypervisor escape attacks","Provider staff reading customer data without authorization","Physical theft of provider hardware"],"a":[0],"n":1,"e":"Most cloud breaches stem from customer misconfiguration."},{"o":"2.3","s":"A zero-day affects a public web app and no patch exists. What is the BEST immediate step?","op":["Rebuilding the server from the same image","Taking the app offline permanently","Compensating controls such as WAF rules and closer monitoring","Rolling back to the previous app version until the vendor responds"],"a":[2],"n":1,"e":"Older versions are likely also vulnerable and rebuilding doesn't fix the flaw; compensating controls reduce exposure."},{"o":"2.4","s":"Malware spreads server to server overnight through an unpatched SMB flaw, with no user interaction. What is it?","op":["Trojan","Logic bomb","Worm","Virus"],"a":[2],"n":1,"e":"Self-propagation without user action defines a worm."},{"o":"2.4","s":"A free PDF converter works as advertised but also opens a hidden channel that lets attackers control the PC. Which malware type BEST describes it?","op":["Worm","Rootkit","Trojan","Spyware"],"a":[2],"n":1,"e":"Malware disguised as useful software is a Trojan (a remote access Trojan here)."},{"o":"2.4","s":"A departing developer adds code that deletes the billing database if his account is ever disabled. Which malware type is this?","op":["Backdoor","Ransomware","Trojan","Logic bomb"],"a":[3],"n":1,"e":"A payload triggered by a condition is a logic bomb."},{"o":"2.4","s":"Antivirus reports a clean system, but an offline scan from boot media finds hidden kernel drivers concealing processes. What is the malware?","op":["Logic bomb","Spyware","Virus","Rootkit"],"a":[3],"n":1,"e":"Hiding at the kernel level, which defeats in-OS tools, is a rootkit."},{"o":"2.4","s":"A new laptop arrives with preinstalled trial suites and utilities that consume resources and are rarely used. Which term BEST describes them?","op":["Bloatware","Trojan","Rootkit","Spyware"],"a":[0],"n":1,"e":"Unwanted preinstalled software is bloatware."},{"o":"2.4","s":"Files on a share are encrypted and a note demands Bitcoin; the attackers had also copied the data out first and threaten to leak it. Which malware is involved?","op":["Logic bomb","Ransomware","Worm","Spyware"],"a":[1],"n":1,"e":"Encryption plus a demand is ransomware; the leak threat is double extortion."},{"o":"2.4","s":"Malware attaches to a legitimate executable and spreads only when users run infected copies shared by email. What is it?","op":["Logic bomb","Trojan","Worm","Virus"],"a":[3],"n":1,"e":"Needing a host and user execution makes it a virus."},{"o":"2.4","s":"A program records every keystroke on a laptop and sends captured passwords to a remote server. Which malware type is this?","op":["Rootkit","Logic bomb","Keylogger","Ransomware"],"a":[2],"n":1,"e":"Capturing keystrokes is a keylogger."},{"o":"2.4","s":"The website is offline. Firewall logs show huge NTP responses from thousands of public servers to the web server, which never sent NTP requests. What is happening?","op":["Reflected amplification DDoS","NTP spoofing to skew the server's clock","A SYN flood from a botnet","DNS cache poisoning"],"a":[0],"n":1,"e":"Responses to requests the server never sent mean someone spoofed its address."},{"o":"2.4","s":"Users typing the correct bank URL reach a fake site. Hosts files are clean, and only users of the internal resolver are affected. What is MOST likely?","op":["ARP poisoning on the user VLAN redirecting web traffic","DNS cache poisoning on the internal resolver","Typosquatting of the bank's domain","A malicious browser extension"],"a":[1],"n":1,"e":"Correct URLs rule out typosquatting, and the pattern follows the resolver, not one segment or one browser."},{"o":"2.4","s":"Every workstation on a VLAN shows the gateway's IP mapped to a contractor laptop's MAC address. Which attack is MOST likely?","op":["DHCP spoofing with a rogue server","MAC flooding to overload the switch","ARP poisoning for an on-path attack","VLAN hopping by double tagging"],"a":[2],"n":1,"e":"Changed IP-to-MAC mappings are ARP poisoning; MAC flooding fills switch tables instead."},{"o":"2.4","s":"An attacker captured NTLM hashes from network traffic and used them to sign in to file servers without cracking them. Which control BEST reduces this risk?","op":["Disabling NTLM in favor of Kerberos where possible","Locking accounts after three failures","Enforcing a 16-character minimum password for every account","Encrypting file shares at rest"],"a":[0],"n":1,"e":"Pass-the-hash replays the hash itself, so length and lockout don't help."},{"o":"2.4","s":"Wireless users drop every few minutes, and a wireless IDS logs floods of management frames telling clients to disconnect. What is happening?","op":["RF jamming on the channel","A deauthentication attack","Microwave oven interference","An evil twin access point"],"a":[1],"n":1,"e":"Forged management frames are deauthentication; jamming is raw radio noise."},{"o":"2.4","s":"Which feature MOST directly prevents forged Wi-Fi deauthentication frames?","op":["Hiding the SSID","A long WPA2 passphrase","MAC address filtering","Protected Management Frames"],"a":[3],"n":1,"e":"PMF authenticates management frames; the others don't touch them."},{"o":"2.4","s":"A server is overwhelmed by thousands of half-open TCP connections from spoofed addresses. Which mitigation fits BEST?","op":["SYN cookies or upstream DDoS scrubbing","Adding RAM to the server","Enabling TLS on the web service","Blocking the source IPs at the firewall"],"a":[0],"n":1,"e":"Spoofed sources make IP blocking useless."},{"o":"2.4","s":"At a conference, an employee joins \"Conference_WiFi,\" which matches the real network's name but has a stronger signal, and his webmail session is hijacked. What happened, and what would have protected him?","op":["Bluejacking; turning off Bluetooth","Evil twin; using the company VPN","Jamming; switching to the 5 GHz band","Deauthentication; enabling WPA3 on his laptop"],"a":[1],"n":1,"e":"A rogue AP copied the SSID; a VPN keeps traffic encrypted even through it."},{"o":"2.4","s":"Logged in as a standard user, an attacker overwrites a writable service binary that runs as SYSTEM, then restarts the service. What is this?","op":["Privilege escalation","Credential replay","Lateral movement","Persistence through a scheduled task"],"a":[0],"n":1,"e":"He gained higher privileges on the same machine."},{"o":"2.4","s":"A diagnostic page accepts \"8.8.8.8 && cat /etc/passwd\" and returns the file's contents. Which attack is this?","op":["Command injection","Directory traversal","Server-side request forgery","SQL injection"],"a":[0],"n":1,"e":"The && chains a shell command onto the input."},{"o":"2.4","s":"An attacker captures a valid authentication message and resends it unchanged later to log in. Which attack is this?","op":["Replay","Forgery","Session fixation","Brute force"],"a":[0],"n":1,"e":"Resending captured, unmodified data is replay."},{"o":"2.4","s":"Which control MOST effectively prevents cross-site request forgery?","op":["Output encoding of user-supplied data","Anti-CSRF tokens tied to the user's session","HTTPS on every page","Input validation on every form field"],"a":[1],"n":1,"e":"Validation and encoding stop injection and XSS; only an unpredictable token proves the request came from the real site."},{"o":"2.4","s":"Which control MOST effectively prevents directory traversal?","op":["MFA on file downloads","Parameterized database queries for every file lookup in the application","Canonicalizing paths and restricting access to one directory","Encoding output before display"],"a":[2],"n":1,"e":"Parameterized queries stop SQLi and encoding stops XSS; path validation stops traversal."},{"o":"2.4","s":"A phishing link points to the real company site, and a URL parameter contains a script that executes immediately in the victim's browser when clicked. Which attack is this?","op":["Stored cross-site scripting","Reflected cross-site scripting","Session hijacking","Cross-site request forgery"],"a":[1],"n":1,"e":"A script delivered in the link and returned at once is reflected XSS."},{"o":"2.4","s":"A web log shows GET /download?file=..%2F..%2F..%2Fetc%2Fshadow returning 200. Which attack succeeded?","op":["Directory traversal","SQL injection","Server-side request forgery","Command injection"],"a":[0],"n":1,"e":"%2F decodes to /, so ../ sequences escaped the web root."},{"o":"2.4","s":"A logged-in banking customer visits a forum, and a hidden image tag silently submits a funds transfer to the bank using her session cookie. Which attack is this?","op":["Session hijacking","Clickjacking","Cross-site request forgery","Stored cross-site scripting"],"a":[2],"n":1,"e":"The forged request rides her existing session; XSS would run script inside the bank's page."},{"o":"2.4","s":"Logs show \"Spring2026!\" tried once against 900 accounts, then \"Summer2026!\" an hour later, with no lockouts. Which attack is this?","op":["Dictionary attack","Password spraying","Brute force","Credential stuffing"],"a":[1],"n":1,"e":"A few common passwords across many accounts is spraying; credential stuffing uses stolen username and password pairs."},{"o":"2.4","s":"One administrator account receives 40,000 password attempts from one IP in an hour. Which attack is this?","op":["Credential stuffing","Brute force","Pass-the-hash","Password spraying"],"a":[1],"n":1,"e":"Many guesses against a single account is brute force."},{"o":"2.4","s":"A man with a reader in his bag stands close to an employee in an elevator, and later enters a secure floor with a copy of her badge. Which attack is this?","op":["Tailgating","Shoulder surfing","Piggybacking","RFID cloning"],"a":[3],"n":1,"e":"He copied her credential; tailgating and piggybacking mean following someone in."},{"o":"2.4","s":"Users reuse passwords, and attackers are making slow guesses across thousands of accounts. Which control is MOST effective?","op":["Password expiration every 60 days","Password complexity rules","Multifactor authentication","Account lockout after five attempts"],"a":[2],"n":1,"e":"Spraying stays under lockout thresholds; MFA stops guessed passwords from working."},{"o":"2.4","s":"An attacker cuts utility power to a building and disables the backup generator, forcing the data center offline. Which attack category is this?","op":["Environmental","Network denial of service","Insider sabotage","Supply chain"],"a":[0],"n":1,"e":"Attacks on power and cooling are environmental."},{"o":"2.4","s":"An on-path attacker strips strong cipher suites from a TLS handshake so both sides agree on an obsolete protocol. Which attack is this?","op":["Collision","Downgrade","Replay","Birthday"],"a":[1],"n":1,"e":"Forcing weaker protocols is a downgrade attack."},{"o":"2.4","s":"Researchers create two different contracts with the same MD5 hash, so a signature on one appears valid on the other. What makes this possible?","op":["Key stretching","A downgrade attack","A hash collision","A rainbow table"],"a":[2],"n":1,"e":"Two inputs with the same hash form a collision."},{"o":"2.4","s":"Why can an attacker find two messages with the same 64-bit hash far faster than trying all possible hash values?","op":["Salting of the hash","Key stretching","The birthday paradox","Rainbow tables"],"a":[2],"n":1,"e":"Collisions appear after about 2^32 tries, not 2^64. Rainbow tables reverse hashes rather than find collisions."},{"o":"2.4","s":"Several servers run at 100% CPU when traffic is low and connect outbound to unfamiliar hosts on port 3333. What is MOST likely?","op":["Data exfiltration over a covert channel","A runaway indexing job","A slow-rate DDoS against the servers","Cryptomining malware"],"a":[3],"n":1,"e":"High CPU plus mining-pool connections indicates cryptojacking; exfiltration would show data volume, not CPU."},{"o":"2.4","s":"A threat feed lists your VPN gateway among systems compromised in a recent campaign, but the SIEM shows no alerts. What should the team do FIRST?","op":["Block the feed provider as unreliable","Patch the gateway to the latest firmware and close the ticket","Investigate the gateway for indicators of compromise","Replace the gateway with a new appliance"],"a":[2],"n":1,"e":"Patching doesn't remove an existing compromise, so investigate first."},{"o":"2.4","s":"Users suddenly can't open files on a share, and every file now ends in a random extension. Which indicator is this?","op":["Resource inaccessibility","Blocked content","Out-of-cycle logging","Published/documented"],"a":[0],"n":1,"e":"Data becoming unusable is resource inaccessibility, a classic ransomware sign."},{"o":"2.4","s":"A proxy shows one workstation querying hundreds of random-looking, newly registered domains each hour, all blocked. What is MOST likely?","op":["A misconfigured DNS search suffix","A browser prefetching links from the news sites the user reads","Malware using generated domains to find its C2 server","A user researching suspicious domains"],"a":[2],"n":1,"e":"Bursts of random fresh domains look like malware hunting for its command server."},{"o":"2.4","s":"A user's account has an active desktop session in Lagos and a VPN session from Frankfurt at the same moment. She is in Lagos and never used the VPN. Which indicator does this MOST directly show?","op":["Concurrent session usage","Account lockout","Impossible travel","Resource consumption"],"a":[0],"n":1,"e":"Two simultaneous sessions are concurrent usage; impossible travel compares logins over time."},{"o":"2.4","s":"A domain controller's security log has a gap from 01:00 to 03:00 and Event ID 1102 at 03:01. What does this MOST likely indicate?","op":["Someone cleared the audit log to hide activity","The log hit its size limit and rolled over","The SIEM agent stopped forwarding events","The server rebooted for patching"],"a":[0],"n":1,"e":"Event 1102 records the audit log being cleared; rollover and reboots don't generate it."},{"o":"2.4","s":"The CFO's account locked out four times this morning while she sat in a meeting with no devices. Her phone's mail app was updated with her new password last week. What is MOST likely?","op":["Her password expired during the meeting","Someone is trying to guess her password","A device keeps retrying an old cached password","HR disabled her account by mistake"],"a":[1],"n":1,"e":"The stale-device explanation is ruled out by the stem, leaving someone else guessing."},{"o":"2.4","s":"At 2:00 a.m. Sunday, a database server never used on weekends starts exporting large tables. The scheduler shows no jobs and no change ticket exists. Which indicator BEST describes this?","op":["Out-of-cycle activity","Missing logs","Concurrent session usage","Resource consumption"],"a":[0],"n":1,"e":"Unexpected timing with nothing scheduled is out-of-cycle."},{"o":"2.5","s":"An old server still answers on the network, though its application was retired a year ago. What is the BEST action?","op":["Disable its network port but leave it racked","Restrict it with firewall rules until next year's hardware refresh budget","Decommission it, sanitizing disks and removing it from DNS","Patch it and keep it as a cold spare"],"a":[2],"n":1,"e":"Full decommissioning removes the system and its data."},{"o":"2.5","s":"A critical patch breaks a key business application in testing. Which approach BEST balances security and operations?","op":["Compensating controls now; patch once the app is fixed","Formally accept the risk permanently","Defer the patch to the next quarterly cycle","Patch production and roll back if users complain"],"a":[0],"n":1,"e":"Compensating controls reduce risk while the conflict is resolved."},{"o":"2.5","s":"Which mitigation BEST limits the damage if one IoT camera on the network is compromised?","op":["Monthly firmware updates for the cameras","Disabling UPnP on every camera","A strong, unique administrator password configured on every camera","A segmented VLAN allowing only the cameras' required traffic"],"a":[3],"n":1,"e":"Passwords and patches lower the chance of compromise; segmentation limits the damage once it happens."},{"o":"2.5","s":"An MRI workstation runs an unsupported OS that can't be upgraded for two years. Which mitigation is MOST appropriate?","op":["Install antivirus and leave it on the clinical network with monitoring","Disconnect it and move images by USB drive","Apply patches from a newer OS ve
