rsion","Isolate it on a segment that only the imaging server can reach"],"a":[3],"n":1,"e":"Segmentation keeps required connectivity while limiting exposure; USB transfers add a new risk."},{"o":"2.5","s":"Ransomware spread using one admin account that had local admin rights on every workstation. Which change would MOST reduce future spread?","op":["Full-disk encryption on workstations","Mandatory monthly password changes for every user account","Hourly backups of file shares","Unique local admin passwords and least privilege"],"a":[3],"n":1,"e":"Limiting where each credential works stops lateral movement; backups only help recovery."},{"o":"2.5","s":"A hotel kiosk must run only the booking app. Which mitigation BEST enforces this?","op":["A host-based firewall","An application allow list","Next-generation antivirus","A host-based IPS"],"a":[1],"n":1,"e":"Only an allow list blocks everything not approved, including malware other tools miss."},{"o":"2.5","s":"Servers drift from hardened baselines within weeks because admins make manual fixes. What is the BEST long-term mitigation?","op":["Automated configuration enforcement that reverts drift","Quarterly rebuilds from the baseline","Monthly manual audits of every server against the hardened baseline","Admin logins restricted to business hours"],"a":[0],"n":1,"e":"Continuous enforcement beats periodic checks."},{"o":"2.5","s":"EDR shows a laptop beaconing to a known command-and-control domain. What should the SOC do FIRST?","op":["Reset the user's password","Isolate the laptop through the EDR console","Reimage the laptop","Block the domain at the DNS resolver"],"a":[1],"n":1,"e":"Blocking one domain may not stop malware with backup channels; isolating the host contains it fully."},{"o":"2.5","s":"A company wants endpoints that detect suspicious behavior, record activity for investigation, and isolate themselves on command. What should it install?","op":["Signature-based antivirus","Host-based firewalls","File integrity monitoring","EDR agents"],"a":[3],"n":1,"e":"EDR combines detection, recording, and response."},{"o":"2.5","s":"An administrator is hardening a new Linux web server. Which actions reduce its attack surface MOST? (Choose two.)","op":["Renaming the admin account","Disabling unused services","Removing unneeded packages","Moving SSH to port 2222","Hiding the server's version banner"],"a":[1,2],"n":2,"e":"Changing ports, banners, and names is obscurity; removing services and packages shrinks the attack surface."},{"o":"2.5","s":"Laptops on public networks must block unsolicited inbound connections even when the VPN is off. Which control fits BEST?","op":["A network-based IPS","A host-based IDS","A host-based firewall","Full-disk encryption"],"a":[2],"n":1,"e":"A network IPS doesn't travel with the laptop, and a HIDS only detects."},{"o":"2.5","s":"A team wants software on each server that blocks exploit attempts against local services in real time. What should it deploy?","op":["A host-based intrusion detection system","A host-based intrusion prevention system","A network IDS on a tap","File integrity monitoring"],"a":[1],"n":1,"e":"Real-time blocking on the host requires prevention, not detection."},{"o":"2.5","s":"A hardening checklist says \"disable SMBv1, Telnet, and LLMNR.\" Which technique does this represent?","op":["Disabling unnecessary protocols and ports","Removing unnecessary software","Encrypting data in transit","Configuration enforcement through automated tools"],"a":[0],"n":1,"e":"Turning off legacy, unneeded protocols."},{"o":"2.5","s":"Before deploying 200 new routers, which hardening step is MOST important?","op":["Changing the default admin credentials","Assigning descriptive hostnames","Setting a warning login banner","Enabling SNMPv2c monitoring"],"a":[0],"n":1,"e":"Default credentials are public; SNMPv2c is itself insecure."},{"o":"2.5","s":"A production web server image includes compilers and a desktop environment that are never used. What should be done?","op":["Monitor their use with a HIPS","Encrypt the directories they live in","Remove them to shrink the attack surface","Keep them but restrict access with permissions"],"a":[2],"n":1,"e":"Removal beats restricting or monitoring."},{"o":"2.5","s":"Which control BEST protects data on a laptop stolen while powered off?","op":["Full-disk encryption","A BIOS boot password","A strong login password","Remote wipe through MDM"],"a":[0],"n":1,"e":"A thief can pull the drive to bypass login and BIOS passwords, and remote wipe needs the device online."},{"o":"2.5","s":"Investigators find an attacker moved from a workstation to the database server over SMB. Which mitigation would BEST stop this lateral movement?","op":["Deploying antivirus on the database server","Complex passwords for database admins","Enabling SMB signing and SMB encryption on every server in the environment","Segmentation blocking workstation-to-server SMB except where needed"],"a":[3],"n":1,"e":"SMB signing prevents relay attacks but not the connection itself; segmentation blocks the path."},{"o":"2.5","s":"Attackers sign in to cloud email with passwords leaked from an unrelated site, because users reuse passwords. Which control would MOST effectively stop these logins?","op":["Multifactor authentication","Blocking logins from foreign countries","Password resets every 30 days","Account lockout after five failures"],"a":[0],"n":1,"e":"Stuffing uses correct passwords, and attackers route through local proxies; MFA stops it."},{"o":"2.5","s":"A web app faces constant injection attempts, and developers need three weeks for a fix. Which control gives the BEST immediate protection?","op":["A WAF with injection rules in blocking mode","An IDS monitoring web server traffic","TLS 1.3 on the web server","Rate limiting on the login page"],"a":[0],"n":1,"e":"An IDS only detects; a blocking WAF stops the requests."},{"o":"2.5","s":"A laptop was infected by a macro in a spreadsheet downloaded from the internet. Which control would MOST likely have prevented execution?","op":["Blocking macros in files marked as from the internet","A web filter blocking every file-sharing and download site","Disabling USB storage","Signature-based antivirus updates"],"a":[0],"n":1,"e":"New malicious macros often slip past signatures; blocking internet-sourced macros stops the vector."},{"o":"2.5","s":"Five engineers share one admin account, and no one can tell who made a damaging change. Which mitigation BEST addresses this?","op":["Rotating the shared password weekly","Adding MFA to the shared account","Named admin accounts with audit logging","Limiting the shared account to business hours"],"a":[2],"n":1,"e":"MFA or rotation on a shared account still leaves no accountability."},{"o":"2.5","s":"A public server was compromised through an admin tool installed by default but never used. Which practice would have prevented this?","op":["Protecting the tool with a strong password","Placing the server behind a load balancer","Removing unneeded software and default components","Patching the admin tool every month"],"a":[2],"n":1,"e":"Software that isn't there can't be exploited."},{"o":"2.5","s":"Logs show sales staff browsing the finance payroll share. Which fix is BEST?","op":["Encrypt the payroll files at rest","Hide the share with a $ suffix","Enable access auditing and alerts on the payroll share","Restrict share permissions to the finance group"],"a":[3],"n":1,"e":"Hiding is obscurity, auditing only detects, and encryption doesn't stop authorized OS users."},{"o":"2.5","s":"A VPN appliance has a critical flaw being exploited in the wild, and a tested patch is ready. What should the company do?","op":["Patch through the emergency change process now","Disable the VPN until the quarterly patch cycle","Patch in the next scheduled maintenance window","Add IPS signatures and wait for the next cycle"],"a":[0],"n":1,"e":"Active exploitation plus a tested patch means patch now."},{"o":"3.1","s":"A company moved its CRM to a SaaS provider. A former employee's account was later used to export customer data because the company never removed his access. Who is responsible for this failure?","op":["The employee's new employer","The customer, which manages user access","The ISP that carried the traffic","The SaaS provider, which hosts the data"],"a":[1],"n":1,"e":"In SaaS the provider runs the app, but the customer manages users."},{"o":"3.1","s":"An IaaS virtual machine was compromised through an unpatched web package the customer installed. Who was responsible for patching it?","op":["Both, since duties are always split equally","The hypervisor vendor","The cloud provider","The customer"],"a":[3],"n":1,"e":"In IaaS the customer owns the OS and applications."},{"o":"3.1","s":"A company uses a managed PaaS database, and a newly discovered flaw affects the database engine itself. Who must patch the engine?","op":["The cloud provider","The customer's auditors","The application developers","The customer"],"a":[0],"n":1,"e":"In PaaS the provider manages the platform and engine; the customer manages data and access."},{"o":"3.1","s":"During contract review, a security manager wants to confirm which party handles key management, logging, and incident notification. What should she review?","op":["The shared responsibility matrix in the agreement","The company's own acceptable use policy","The provider's public job postings for its SOC","The provider's marketing brochure and website"],"a":[0],"n":1,"e":"The responsibility matrix defines who does what."},{"o":"3.1","s":"A company runs workloads in two public clouds and its own data center, and admins use different accounts and policies in each. What is the GREATEST risk?","op":["Network traffic between clouds becoming too fast","Too much log data being centralized in one place for analysts to review","Cloud storage bills dropping below the budget","Inconsistent controls and identities across environments"],"a":[3],"n":1,"e":"Inconsistent controls create security gaps."},{"o":"3.1","s":"Which responsibility remains with the customer in EVERY cloud service model?","op":["Physical data center security","Patching the hypervisor","Maintaining the provider's network switches and routers in each region","Protecting its data and managing who can access it"],"a":[3],"n":1,"e":"Data and access always stay with the customer."},{"o":"3.1","s":"A third-party monitoring vendor needs API access to a company's cloud account. What is the BEST way to grant it?","op":["Full administrative access, removed when the contract ends","An administrator account shared with the internal team","A dedicated role with only the permissions the vendor needs","The company's root account credentials, rotated monthly"],"a":[2],"n":1,"e":"Third parties get least-privilege access."},{"o":"3.1","s":"A company migrates from on-premises servers to IaaS. Which tasks does it STILL own? (Choose two.)","op":["Replacing failed physical disks","Securing the hypervisor","Patching guest operating systems","Configuring security groups and firewall rules","Data center power and cooling"],"a":[2,3],"n":2,"e":"The customer keeps the OS and network configuration; the provider handles hardware, hypervisor, and facility."},{"o":"3.1","s":"What is a key security benefit of infrastructure as code?","op":["Eliminating the need for access control on servers","Repeatable deployments reviewed in version control","Preventing anyone from ever changing a server","Making encryption of data at rest unnecessary"],"a":[1],"n":1,"e":"Code-based infrastructure enforces consistency and leaves an auditable history."},{"o":"3.1","s":"A developer deploys a function that runs only when an image is uploaded, without managing any servers. What architecture is this?","op":["Serverless","IaaS","Microservices","Containerization"],"a":[0],"n":1,"e":"Serverless runs code on demand without server management."},{"o":"3.1","s":"An application is split into small independent services that communicate through APIs. What architecture is this?","op":["Air-gapped","Serverless","Monolithic","Microservices"],"a":[3],"n":1,"e":"Microservices break applications into independent components."},{"o":"3.1","s":"How do containers differ from virtual machines?","op":["Containers share the host operating system kernel","Containers cannot run in the cloud","Containers isolate more strongly than VMs","Each container runs its own complete guest operating system"],"a":[0],"n":1,"e":"Containers share the kernel, making them lighter but less isolated."},{"o":"3.1","s":"Which security concern grows with a microservices architecture?","op":["A single, huge shared codebase","More APIs that each must be secured","Inability to scale individual parts","Removal of all network communication"],"a":[1],"n":1,"e":"More services and APIs mean more attack surface."},{"o":"3.1","s":"What is a security benefit of virtualization?","op":["Removing the need to patch guest systems","Making regular server backups unnecessary","Guaranteeing the hypervisor has no vulnerabilities","Isolating workloads that share the same hardware"],"a":[3],"n":1,"e":"VMs isolate workloads, though the hypervisor itself must still be secured."},{"o":"3.1","s":"In a serverless model, which responsibility shifts MOST to the cloud provider?","op":["Setting access permissions on the function","Protecting the data the function processes","Patching the underlying servers and runtime","Writing secure code for each function"],"a":[2],"n":1,"e":"The provider handles infrastructure; the customer keeps code, access, and data."},{"o":"3.1","s":"A team defines servers, networks, and firewall rules in configuration files that deploy automatically. What is this?","op":["Microservices","Virtual desktop infrastructure","Infrastructure as code","Serverless computing"],"a":[2],"n":1,"e":"IaC manages infrastructure through code."},{"o":"3.1","s":"Which concept separates the control plane from the data plane so a network can be configured centrally through software?","op":["Software-defined networking","Air gapping","Network address translation","Port security"],"a":[0],"n":1,"e":"SDN centralizes network control."},{"o":"3.1","s":"What is a key advantage of on-premises infrastructure compared with public cloud?","op":["Lower upfront cost than a subscription","No internal staff needed to maintain systems","Unlimited automatic scaling during spikes","Full control over hardware and physical security"],"a":[3],"n":1,"e":"On-premises gives full control along with full responsibility."},{"o":"3.1","s":"Which is a security drawback of a centralized architecture?","op":["Policies are harder to apply consistently","There are more systems to patch","It removes visibility","It can create a single point of failure"],"a":[3],"n":1,"e":"Centralization concentrates risk."},{"o":"3.1","s":"A decentralized architecture spreads processing across many locations. Which challenge does this commonly create?","op":["Being unable to scale with demand","Losing all redundancy between sites","Keeping policies and visibility consistent","Creating a single point of failure"],"a":[2],"n":1,"e":"Distributed systems are harder to manage uniformly; a single point of failure is a centralization problem."},{"o":"3.1","s":"Even an air-gapped network can be compromised through which vector?","op":["Removable media carried in by staff","Internet DDoS","Internet phishing emails sent directly to it","Public DNS poisoning"],"a":[0],"n":1,"e":"USB drives can bridge the gap."},{"o":"3.1","s":"An attacker compromises an SDN controller. What is the MOST significant impact?","op":["Loss of a single switch port only","Removal of the wireless encryption keys from every access point","Central reconfiguration of the entire network","Physical damage to network cabling"],"a":[2],"n":1,"e":"The controller manages every device, so it can change the whole network."},{"o":"3.1","s":"Which architecture provides the STRONGEST isolation for a network that processes classified data?","op":["Software-defined networking","Screened subnet","Air-gapped network","VLAN segmentation"],"a":[2],"n":1,"e":"An air gap is physical isolation."},{"o":"3.1","s":"A company separates guest Wi-Fi from its corporate network with VLANs on the same switches. What type of separation is this?","op":["Physical isolation","Separate dedicated network","Logical segmentation","Air gap"],"a":[2],"n":1,"e":"VLANs separate traffic logically over shared hardware."},{"o":"3.1","s":"An ICS cannot be patched because its vendor no longer supports it and downtime is unacceptable. Which consideration BEST describes this?","op":["Inability to patch","Risk transference","Ease of deployment","Scalability"],"a":[0],"n":1,"e":"Some systems simply cannot be patched."},{"o":"3.1","s":"A company buys cyber insurance to cover losses from a breach. Which architectural consideration does this reflect?","op":["Compute","Risk transference","Resilience","Responsiveness"],"a":[1],"n":1,"e":"Insurance transfers financial risk."},{"o":"3.1","s":"A battery-powered remote sensor with a tiny processor cannot run strong encryption. Which considerations limit its security?","op":["Responsiveness and availability","Scalability and cost","Ease of recovery and deployment","Power and compute"],"a":[3],"n":1,"e":"Limited power and processing restrict the controls it can run."},{"o":"3.1","s":"Which is the BEST way to secure IoT devices that cannot be patched?","op":["Give them administrator credentials","Disable logging","Expose them to the internet for vendor support","Place them on an isolated network segment"],"a":[3],"n":1,"e":"Segmentation limits exposure."},{"o":"3.1","s":"An architect chooses a design that can quickly add capacity during seasonal traffic spikes. Which consideration is prioritized?","op":["Scalability","Ease of recovery","Power","Patch availability"],"a":[0],"n":1,"e":"Scalability handles growth in demand."},{"o":"3.1","s":"A water utility uses systems to monitor and control pumps across many remote sites. What type of system is this?","op":["Microservices","SCADA","VDI","RTOS"],"a":[1],"n":1,"e":"SCADA supervises distributed industrial processes."},{"o":"3.1","s":"A medical device must respond to sensor input within strict, guaranteed time limits. Which OS does it MOST likely use?","op":["Real-time operating system","Container OS","Desktop operating system","Serverless runtime"],"a":[0],"n":1,"e":"An RTOS guarantees deterministic timing."},{"o":"3.1","s":"What is a common security challenge with embedded and IoT devices?","op":["They ship with unique strong passwords","They always run resource-heavy antivirus","They cannot connect to any networks","Limited patching and few built-in controls"],"a":[3],"n":1,"e":"Constrained devices are hard to update and have little built-in security."},{"o":"3.2","s":"A company puts its public web servers in a zone between the internet and its internal network. What is this zone called?","op":["Intranet","Air-gapped zone","Screened subnet","Management VLAN"],"a":[2],"n":1,"e":"A screened subnet hosts public-facing services."},{"o":"3.2","s":"Removing unused services, closing ports, and reducing internet-facing systems all shrink which of the following?","op":["Responsiveness","Availability","Attack surface","Recovery time"],"a":[2],"n":1,"e":"Fewer exposed points mean a smaller attack surface."},{"o":"3.2","s":"Where should a web application firewall be placed to protect a public web server?","op":["Between the core switch and the printers","On each employee workstation as an agent","Behind the database server on the LAN","In front of the web server, in the traffic path"],"a":[3],"n":1,"e":"The WAF must see inbound web requests before they reach the server."},{"o":"3.2","s":"Grouping systems into untrusted, screened, and trusted zones mainly helps an organization to:","op":["Avoid the need for network monitoring","Apply controls that match each zone's trust","Eliminate the need for firewalls entirely","Remove every internal threat automatically"],"a":[1],"n":1,"e":"Security zones group assets by trust so controls can match."},{"o":"3.2","s":"A firewall fails and stops passing all traffic, keeping the network secure but unavailable. Which failure mode is this?","op":["Fail-open","Fail-closed","Fail-safe override","Failover"],"a":[1],"n":1,"e":"Fail-closed blocks traffic when the device fails."},{"o":"3.2","s":"An IPS is set so that if it crashes, traffic keeps flowing uninspected to keep the business running. Which failure mode is this?","op":["Fail-closed","Fail-open","Inline","Active-passive"],"a":[1],"n":1,"e":"Fail-open favors availability over security."},{"o":"3.2","s":"An IDS receives a copy of traffic from a switch's SPAN port. How is it deployed?","op":["Active, inline with traffic","As a reverse proxy server","As a jump server host","Passive, using a monitor port"],"a":[3],"n":1,"e":"A copy of the traffic means passive monitoring; it can alert but not block."},{"o":"3.2","s":"Which deployment lets a security device block malicious traffic in real time?","op":["Tap/monitor","Out-of-band","Passive","Inline"],"a":[3],"n":1,"e":"Only devices in the traffic path can drop packets."},{"o":"3.2","s":"An organization must hide its internal web servers' addresses from internet users and inspect requests before they reach the servers. What should it use?","op":["A VPN concentrator","A forward proxy","A reverse proxy","A network tap"],"a":[2],"n":1,"e":"A reverse proxy fronts the servers."},{"o":"3.2","s":"A load balancer runs active-active across two nodes. What happens if one node fails?","op":["The remaining node carries all traffic","Both nodes fail over to a cold site","An admin must manually activate a passive node","Traffic stops until the node is replaced"],"a":[0],"n":1,"e":"In active-active both share the load, so the survivor absorbs it."},{"o":"3.2","s":"Network sensors feed a SIEM, but analysts can't see traffic between servers inside the same data center. What is the MOST likely gap?","op":["The perimeter firewall is configured to fail closed during traffic peaks","Sensors see traffic entering and leaving, not server-to-server traffic","The servers use IPv6 addresses that the sensors cannot interpret at all","The SIEM's license expired and it is dropping some of its data feeds"],"a":[1],"n":1,"e":"Sensor placement determines visibility; internal server-to-server traffic needs internal monitoring."},{"o":"3.2","s":"A vendor must maintain servers in a company's secure zone. Security wants every vendor session recorded through one controlled entry point. What should be deployed?","op":["A load balancer in front of the servers","A honeypot inside the secure zone","A forward proxy for vendor browsing","A jump server with session recording"],"a":[3],"n":1,"e":"A jump server is the single monitored path into a secure zone."},{"o":"3.2","s":"After a signature update, an inline IPS starts blocking a legitimate payroll application, and payroll is due today. What is the BEST immediate response?","op":["Remove the IPS from the network permanently to avoid future outages","Disable every IPS signature until the vendor releases an update","Set the IPS to fail-open for all traffic until the next quarter","Add a narrow exception for payroll traffic and review the signature"],"a":[3],"n":1,"e":"Tune narrowly rather than removing protection broadly."},{"o":"3.2","s":"A company wants to block employees from known malicious websites and log all browsing, without installing software on office laptops. What should it deploy?","op":["A load balancer","A jump server","A reverse proxy","A forward proxy"],"a":[3],"n":1,"e":"A forward proxy mediates outbound web traffic."},{"o":"3.2","s":"A public website must stay up if one of its three web servers fails, and TLS processing should be offloaded from the servers. Which appliance BEST meets both needs?","op":["A jump server with MFA","An IDS on a SPAN port","A load balancer with TLS offloading","A forward proxy with caching"],"a":[2],"n":1,"e":"Load balancers distribute traffic and can terminate TLS."},{"o":"3.2","s":"Security wants visibility into attacks on the server network but can't risk any device mistakenly blocking production traffic. What should be deployed?","op":["An IDS connected through a tap or SPAN port","A web application firewall in front of each server","A fail-closed firewall between the server racks","An inline IPS configured in blocking mode"],"a":[0],"n":1,"e":"A passive IDS sees traffic but cannot block it."},{"o":"3.2","s":"A firewall blocks a specific social media app even though it uses port 443. At which layer must it operate?","op":["Layer 2","Layer 3","Layer 4","Layer 7"],"a":[3],"n":1,"e":"Identifying applications requires Layer 7 inspection."},{"o":"3.2","s":"Which EAP method requires certificates on both the client and the server?","op":["PEAP","EAP-TLS","LEAP","EAP-FAST"],"a":[1],"n":1,"e":"EAP-TLS uses mutual certificate authentication."},{"o":"3.2","s":"Which standard provides port-based network access control, requiring authentication before a device gets network access?","op":["802.1X","SNMPv3","802.11ac","WPA2-PSK"],"a":[0],"n":1,"e":"802.1X is port-based access control."},{"o":"3.2","s":"In an 802.1X deployment, which framework carries the authentication messages?","op":["Kerberos","SAML","LDAP","EAP"],"a":[3],"n":1,"e":"EAP is the authentication framework used by 802.1X."},{"o":"3.2","s":"Which firewall type inspects HTTP traffic for attacks such as SQL injection and cross-site scripting?","op":["Stateless packet filter","Proxy ARP","Web application firewall","Layer 4 firewall"],"a":[2],"n":1,"e":"WAFs understand web application traffic."},{"o":"3.2","s":"A small business wants one appliance combining firewall, antivirus, content filtering, and VPN. What should it buy?","op":["Jump server with MFA","Unified threat management (UTM)","Web application firewall (WAF)","Layer 4 stateful firewall"],"a":[1],"n":1,"e":"UTM bundles several security functions into one device."},{"o":"3.2","s":"What does a next-generation firewall add beyond a traditional port-based firewall?","op":["Issuing certificates to internal clients","Filtering based only on IP addresses","Physical isolation of network segments using separate cabling and switches","Application awareness and deep packet inspection"],"a":[3],"n":1,"e":"NGFWs identify applications regardless of the port they use."},{"o":"3.2","s":"A firewall allows or blocks traffic only by IP address and port number. At which layer does it operate?","op":["Layer 1","Layer 2","Layer 4","Layer 7"],"a":[2],"n":1,"e":"Port numbers are transport-layer information."},{"o":"3.2","s":"Which IPsec component negotiates security associations and exchanges keys between peers?","op":["Transport mode","Authentication Header","Encapsulating Security Payload","Internet Key Exchange"],"a":[3],"n":1,"e":"IKE handles key exchange and setup."},{"o":"3.2","s":"Remote employees need encrypted access to internal applications from home. What is the MOST appropriate solution?","op":["VPN","SNMP","Air gap","Screened subnet"],"a":[0],"n":1,"e":"A VPN creates an encrypted tunnel."},{"o":"3.2","s":"Which IPsec protocol provides both encryption and authentication of the payload?","op":["Authentication Header","Internet Key Exchange","Encapsulating Security Payload","Generic Routing Encapsulation"],"a":[2],"n":1,"e":"ESP encrypts and authenticates; AH only authenticates, and IKE negotiates keys."},{"o":"3.2","s":"Which IPsec mode encrypts the entire original packet, including headers, and is typically used between gateways?","op":["Tunnel mode","Transport mode","Promiscuous mode","Aggressive mode"],"a":[0],"n":1,"e":"Tunnel mode wraps the whole original packet."},{"o":"3.2","s":"A company with many branches wants to route traffic over multiple internet links with centralized software control. Which technology fits?","op":["Air gap","802.1X","SD-WAN","A single VPN concentrator"],"a":[2],"n":1,"e":"SD-WAN manages wide-area links in software."},{"o":"3.2","s":"Which technology delivers networking and security services, such as secure web gateway and Zero Trust access, from the cloud?","op":["IPsec VPN in transport mode","Software-defined WAN (SD-WAN)","Unified threat management (UTM)","Secure access service edge (SASE)"],"a":[3],"n":1,"e":"SASE delivers security from the cloud edge. SD-WAN handles routing only, and UTM is an on-premises appliance."},{"o":"3.2","s":"A website must encrypt traffic between browsers and the web server. Which protocol should it use?","op":["IPsec AH","Telnet","TLS","SNMPv2"],"a":[2],"n":1,"e":"TLS secures web traffic."},{"o":"3.2","s":"How does a full-tunnel VPN differ from a split-tunnel VPN?","op":["It requires no authentication to connect","It sends only corporate traffic through the VPN","It skips encryption for internet traffic","It sends all of the user's traffic through the VPN"],"a":[3],"n":1,"e":"A full tunnel routes everything through the corporate network; a split tunnel sends only corporate traffic."},{"o":"3.3","s":"A company's secret recipe gives it a competitive edge and is protected by limiting who knows it. Which data type is this?","op":["Public","Trade secret","Legal information","Regulated"],"a":[1],"n":1,"e":"Trade secrets derive value from secrecy."},{"o":"3.3","s":"Patient records protected under health privacy law are which data type?","op":["Trade secret","Regulated","Public","Intellectual property"],"a":[1],"n":1,"e":"Laws govern their handling."},{"o":"3.3","s":"Data whose disclosure would cause severe harm and which only specifically authorized people may access should be classified as:","op":["Public","Private","Sensitive","Restricted"],"a":[3],"n":1,"e":"Restricted is the most tightly limited classification."},{"o":"3.3","s":"Which classification fits a company's published press releases?","op":["Restricted","Critical","Confidential","Public"],"a":[3],"n":1,"e":"Information intended for everyone is public."},{"o":"3.3","s":"An order-processing database without which the business cannot operate is classified as:","op":["Critical","Public","Private","Trade secret"],"a":[0],"n":1,"e":"Critical data is essential to operations."},{"o":"3.3","s":"Which of the following is an example of non-human-readable data?","op":["A printed employee handbook","A draft email to a customer","A typed meeting agenda","An encrypted database backup"],"a":[3],"n":1,"e":"Encrypted or binary data can't be read by people."},{"o":"3.3","s":"A company's patents and software source code are examples of which data type?","op":["Intellectual property","Public information","Regulated data","Financial information"],"a":[0],"n":1,"e":"IP covers creations of the mind such as patents and code."},{"o":"3.3","s":"Employees' home addresses and personal phone numbers are BEST classified as:","op":["Trade secret","Critical","Private","Public"],"a":[2],"n":1,"e":"Personal information about individuals is private."},{"o":"3.3","s":"Backup tapes stored in an offsite vault are in which state?","op":["Data at rest","Data in transit","Data in use","Data in motion"],"a":[0],"n":1,"e":"Stored data is at rest."},{"o":"3.3","s":"Which control BEST protects data in transit between a branch office and headquarters?","op":["Data masking","Database tokenization","Full-disk encryption","IPsec VPN"],"a":[3],"n":1,"e":"Encrypting the connection protects data in transit."},{"o":"3.3","s":"A European company must keep customers' personal data within the EU because of local law. Which concept is this?","op":["Data sovereignty","Data classification","Geofencing","Data masking"],"a":[0],"n":1,"e":"Data is subject to the laws of the country where it resides."},{"o":"3.3","s":"A cloud service blocks logins from countries where the company has no operations. Which concept is used?","op":["Geolocation-based restriction","Masking of login data","Data sovereignty enforcement","Tokenization of user records"],"a":[0],"n":1,"e":"Location is used to restrict access. Sovereignty is about which laws apply to stored data."},{"o":"3.3","s":"Which technology helps protect data in use by isolating it during processing, even from the OS?","op":["Full-disk encryption","TLS","Offsite backups","Secure enclave"],"a":[3],"n":1,"e":"Enclaves protect data while it is being computed."},{"o":"3.3","s":"An email traveling from a laptop to the mail server is in which state?","op":["Escrowed data","Data in use","Data in transit","Data at rest"],"a":[2],"n":1,"e":"Data moving across a network is in transit."},{"o":"3.3","s":"Why must a multinational consider data sovereignty when choosing cloud regions?","op":["Sovereignty rules apply only to paper records","Each country's laws may apply to data stored there","Some countries ban encrypting any stored data","Cloud providers charge based on local language"],"a":[1],"n":1,"e":"Storage location determines legal jurisdiction."},{"o":"3.3","s":"Data being processed in memory by an application is in which state?","op":["Archived data","Data at rest","Data in transit","Data in use"],"a":[3],"n":1,"e":"Data actively being processed is in use."},{"o":"3.3","s":"A company must prove archived contracts haven't been modified since signing, but they don't need to be secret. Which method BEST supports this?","op":["Tokenizing the contract numbers in the archive","Masking the sensitive text within each contract","Encrypting the files at rest with a strong key","Hashing the files and storing the hashes separately"],"a":[3],"n":1,"e":"The need is integrity, not confidentiality, so hashing fits."},{"o":"3.3","s":"A European subsidiary's HR data must not be accessible to staff in other countries. Which control BEST enforces this?","op":["Geographic access restrictions combined with permissions","Hashing every employee's name in the HR database","Obfuscating the HR database's table and column names","Moving the HR data to a public cloud storage bucket"],"a":[0],"n":1,"e":"Location-based restrictions plus permissions limit who can reach it."},{"o":"3.3","s":"Support agents see customers' full phone numbers, but they only need the last four digits to verify callers. What should the app do?","op":["Hash the numbers before display","Mask all but the last four digits","Encrypt the numbers in transit only","Show a token instead of the number"],"a":[1],"n":1,"e":"Masking shows only what's needed."},{"o":"3.3","s":"An attacker steals a database backup file. Which protection would MOST likely keep the data confidential?","op":["Encryption at rest with keys stored separately","Segmenting the database server's network","Obfuscated column names","Masking applied only in the user interface"],"a":[0],"n":1,"e":"A stolen file is protected only by encryption; UI masking and segmentation don't protect a copied file."},{"o":"3.3","s":"A developer obfuscates JavaScript to protect a pricing algorithm. Why is this NOT enough to protect secrets such as API keys?","op":["Most browsers refuse to run obfuscated JavaScript code","Obfuscation encrypts code with the developer's public key","Obfuscation makes the code run too slowly to be practical","Obfuscated code can still be reversed by a determined attacker"],"a":[3],"n":1,"e":"Obfuscation hides; it doesn't secure."},{"o":"3.3","s":"Sensitive research data sits on the same flat network as guest Wi-Fi users. Which method MOST directly reduces who can reach it?","op":["Segmentation","Hashing","Masking","Tokenization"],"a":[0],"n":1,"e":"Segmentation limits reachability."},{"o":"3.3","s":"A developer needs production-like customer data to troubleshoot a bug. The data must look realistic, but no real customer may be identifiable. Which method fits BEST?","op":["Tokenization","Data masking","Hashing","Encryption"],"a":[1],"n":1,"e":"Masking substitutes realistic fake values; encrypted data is unreadable for testing and reversible with the key."},{"o":"3.3","s":"A payment processor must run transactions without storing real card numbers, yet still retrieve the real number for refunds. Which method fits BEST?","op":["Masking","Tokenization","Hashing","Obfuscation"],"a":[1],"n":1,"e":"Tokens map back through a secure vault; hashes can't be reversed."},{"o":"3.4","s":"All of a company's servers run the same OS version, and one zero-day crashes every server at once. Which concept would have reduced the impact?","op":["Journaling","A cold site","Capacity planning","Platform diversity"],"a":[3],"n":1,"e":"Diversity avoids a single flaw taking down everything."},{"o":"3.4","s":"An e-commerce company must stay online during a regional outage at its cloud provider. What is the BEST approach?","op":["Keep extra backups in the same region's storage service for faster restores","Run workloads across multiple regions or providers","Add web servers within one zone","Use larger instances in the same region"],"a":[1],"n":1,"e":"Spreading across regions or providers survives a regional outage."},{"o":"3.4","s":"Before peak season, a retailer verifies it has enough staff, servers, and bandwidth to handle triple the normal traffic. What is this?","op":["A tabletop exercise","Continuity of operations planning","A gap analysis","Capacity planning"],"a":[3],"n":1,"e":"Capacity planning covers people, technology, and infrastructure."},{"o":"3.4","s":"A warm site is chosen for a company's ERP system. What should the company expect after a disaster?","op":["No network connectivity is available","Hardware is ready, but recent data must be restored first","Operations resume instantly with fully current, replicated data","The site must be equipped from scratch"],"a":[1],"n":1,"e":"Warm sites need data restored before going live."},{"o":"3.4","s":"A continuity plan says payroll must continue even if headquarters is lost. Which document BEST describes how essential functions continue?","op":["Change management policy","Capacity plan","Continuity of operations plan","Acceptable use policy"],"a":[2],"n":1,"e":"COOP describes keeping essential functions running."},{"o":"3.4","s":"A hospital's health records system must be back within one hour of a site failure, and leadership will pay ongoing costs for that. Which recovery site fits BEST?","op":["Backups only, with no site","Warm site","Cold site","Hot site"],"a":[3],"n":1,"e":"A one-hour recovery target requires a hot site."},{"o":"3.4","s":"A small nonprofit can tolerate a week of downtime for its donor database and has a very limited budget. Which recovery option fits BEST?","op":["Warm site with real-time replication","Active-active data centers","Hot site","Cold site"],"a":[3],"n":1,"e":"A long tolerance and a small budget point to a cold site."},{"o":"3.4","s":"A company's primary and backup data centers are 10 km apart on the same river flood plain. What is the MAIN weakness?","op":["The sites have too much platform diversity","One regional disaster could take out both sites","The backup site can't use generators","The sites are too far apart to replicate"],"a":[1],"n":1,"e":"The design lacks geographic dispersion."},{"o":"3.4","s":"Data is copied in near real time to a second data center so it is always current. What is this?","op":["Snapshot","Archiving","Cold backup","Replication"],"a":[3],"n":1,"e":"Replication keeps a live copy."},{"o":"3.4","s":"Which device provides short-term battery power so servers keep running or shut down cleanly during an outage?","op":["Power distribution unit","Surge protector","Uninterruptible power supply","Generator"],"a":[2],"n":1,"e":"A UPS bridges short outages."},{"o":"3.4","s":"A hospital must keep operating for days during an extended power outage. What should it install?","op":["More PDUs","UPS only","Redundant NICs","Generator"],"a":[3],"n":1,"e":"Generators provide long-term power."},{"o":"3.4","s":"Why should backups be encrypted with a copy kept offsite?","op":["To reduce the organization's storage costs","To remove the need to test restores regularly","To survive theft and disasters at the main site","To make restores from backup complete faster"],"a":[2],"n":1,"e":"Encryption protects confidentiality; offsite storage survives loss of the main site."},{"o":"3.4","s":"Team members talk through their roles in a simulated ransomware attack around a table, without touching any systems. What is this?","op":["Parallel processing","Live simulation","Failover test","Tabletop exercise"],"a":[3],"n":1,"e":"Tabletop exercises are discussion-based."},{"o":"3.4","s":"An administrator deliberately shuts down the primary database to confirm the standby takes over automatically. Which test is this?","op":["Parallel processing","Simulation","Tabletop exercise","Failover"],"a":[3],"n":1,"e":"Failover tests verify automatic switchover."},{"o":"3.4","s":"A backup method writes a continuous log of every change so data can be restored to a precise point in time. What is this?","op":["Snapshot","Differential backup","Journaling","Full backup"],"a":[2],"n":1,"e":"Journaling records changes for point-in-time recovery."},{"o":"3.4","s":"A virtual machine's state is captured instantly before a risky update so it can be rolled back. What is this?","op":["Replication","Snapshot","Offsite backup","Journaling"],"a":[1],"n":1,"e":"A snapshot captures state at a moment in time."},{"o":"4.1","s":"An ICS controller can't run endpoint agents or be patched. Which approach BEST hardens it?","op":["Segment it and allow only required protocols from specific hosts","Install a lightweight antivirus anyway","Connect it to the vendor's cloud platform for continuous remote monitoring","Change its IP address on a schedule"],"a":[0],"n":1,"e":"Network controls compensate for missing host controls."},{"o":"4.1","s":"An auditor asks how a company verifies its servers match CIS hardening guidance. Which is the BEST answer?","op":["Reviewing change tickets per server","Vulnerability scans for missing patches","Automated compliance scans against CIS benchmarks","Annual manual reviews by each system owner"],"a":[2],"n":1,"e":"Vulnerability scans check patches, not configuration compliance; benchmark scans check settings continuously."},{"o":"4.1","s":"Which workstation hardening step MOST limits the damage when a user runs malware?","op":["Enabling a password-protected screen saver","Increasing password length","Removing local administrator rights","Installing a browser ad blocker"],"a":[2],"n":1,"e":"Malware runs with the user's rights, so standard rights limit what it can change."},{"o":"4.1","s":"A company will deploy 300 servers and wants every one to start from the same hardened configuration. What should it establish first?","op":["An acceptable use policy","A vulnerability scan schedule","A secure baseline","A configuration management database"],"a":[2],"n":1,"e":"A secure baseline defines the hardened starting point; scans and a CMDB come later."},{"o":"4.1","s":"Six months after rolling out a server baseline, a company finds it no longer addresses several new attack techniques. Which step was neglected?","op":["Maintaining the baseline","Deploying the baseline","Documenting the baseline","Establishing the baseline"],"a":[0],"n":1,"e":"Baselines must be maintained as threats and patches change."},{"o":"4.1","s":"Which switch hardening step MOST directly stops a visitor from plugging into an unused office port?","op":["Enabling SSH for management","Disabling unused ports","Changing the native VLAN","Configuring a login banner"],"a":[1],"n":1,"e":"A disabled port gives nothing to connect to; changing the native VLAN addresses VLAN hopping."},{"o":"4.1","s":"Routers are managed over Telnet from any internal address. Which change BEST hardens management access?","op":["SNMPv2c with a new community string","Telnet with longer passwords","HTTPS management from any internal host","SSH restricted to a management network"],"a":[3],"n":1,"e":"The fix needs both encryption and restricted reach."},{"o":"4.1","s":"A cloud review finds storage buckets public by default and dozens of users with administrator roles. Which step addresses BOTH issues?","op":["MFA on the root account","Encryption at rest with customer-managed keys on every bucket","Detailed billing alerts","Least-privilege IAM plus block-public-access defaults"],"a":[3],"n":1,"e":"Encryption doesn't stop public access, and root MFA doesn't reduce admin roles."},{"o":"4.1","s":"In an 802.1X Wi-Fi network, which component makes the authentication decision?","op":["The RADIUS authentication server","The DHCP server","The client supplicant","The wireless access point"],"a":[0],"n":1,"e":"The AP only relays; the authentication server decides."},{"o":"4.1","s":"A guest network uses WPA3-Personal with one shared passphrase. What is its main weakness compared with Enterprise mode?","op":["Management frames can't be protected","Traffic between clients and the AP is unencrypted","Individual users can't be identified or revoked","Offline dictionary attacks become trivial"],"a":[2],"n":1,"e":"WPA3-Personal still encrypts and resists offline attacks; it lacks per-user identity."},{"o":"4.1","s":"Which WPA3 mechanism protects a Personal network's passphrase from offline dictionary attacks, even if the handshake is captured?","op":["Simultaneous Authentication of Equals","802.1X with EAP-TLS","AES-CCMP encryption","Protected Management Frames (802.11w)"],"a":[0],"n":1,"e":"SAE replaces the PSK handshake that made offline cracking possible."},{"o":"4.1","s":"A company wants employees to join Wi-Fi with directory credentials so any one user can be revoked. Which configuration fits?","op":["WPA3-Personal with a passphrase per floor","WPA2-Personal with MAC filtering","WPA3-Enterprise with 802.1X and RADIUS","Open Wi-Fi with a captive portal login"],"a":[2],"n":1,"e":"Enterprise mode authenticates each user individually."},{"o":"4.1","s":"Before installing APs in a new warehouse, a technician measures signal, interference, and dead spots. What is this, and what does it typically produce?","op":["A site survey that produces a heat map","A penetration test that produces findings","Capacity planning that produces a budget","War driving that produces SSID lists"],"a":[0],"n":1,"e":"Site surveys map coverage, usually as a heat map."},{"o":"4.1","s":"Users at the far end of a floor report weak Wi-Fi after deployment. Which tool would BEST show where coverage drops?","op":["The AP's DHCP lease table","A NetFlow report","The RADIUS accounting log","A wireless heat map"],"a":[3],"n":1,"e":"Heat maps visualize signal strength by location."},{"o":"4.1","s":"An office router has WPA3 enabled, but its label still shows an 8-digit setup PIN. What should be done?","op":["Change the SSID","Lower transmit power","Enable MAC filtering","Disable WPS"],"a":[3],"n":1,"e":"The WPS PIN can be brute-forced regardless of WPA3."},{"o":"4.1","s":"Which wireless configuration should be retired immediately because its encryption can be cracked in minutes?","op":["WPA2-Enterprise","WPA3-Personal","WEP","WPA2-Personal with a 20-character passphrase"],"a":[2],"n":1,"e":"WEP's RC4 implementation is broken."},{"o":"4.1","s":"A sales app should work only inside company offices. Which MDM feature enables this?","op":["Geotagging","Remote attestation","Geofencing","Containerization"],"a":[2],"n":1,"e":"Geotagging labels data with location; geofencing enforces boundaries."},{"o":"4.1","s":"Employees use personal phones, and the company manages only a work container it can wipe. Which model is this?","op":["BYOD","CYOD","Corporate-owned, business only","COPE"],"a":[0],"n":1,"e":"Personal ownership with a managed container is BYOD."},{"o":"4.1","s":"The company buys and owns the phones, manages them fully, and allows personal apps. Which model is this?","op":["COPE","BYOD","CYOD","VDI"],"a":[0],"n":1,"e":"Corporate-owned, personally enabled."},{"o":"4.1","s":"Employees choose from three approved phone models, which the company buys and fully manages. Which model is this?","op":["COPE","BYOD","Corporate-owned, business only","CYOD"],"a":[3],"n":1,"e":"Choosing from an approved list is CYOD."},{"o":"4.1","s":"A company must enforce passcodes, push approved apps, and remotely wipe lost phones. Which solution provides this?","op":["Endpoint detection and response","Network access control","Data loss prevention","Mobile device management"],"a":[3],"n":1,"e":"MDM manages mobile device policy and wipes."},{"o":"4.1","s":"A corporate phone holding sensitive email is reported stolen and is still online. What should be done FIRST?","op":["Change the user's email password","Remotely lock or wipe it through MDM","Revoke the phone's Wi-Fi certificate","Report the theft to the carrier"],"a":[1],"n":1,"e":"A password change doesn't protect mail already cached on the device."},{"o":"4.1","s":"Which connection method poses the greatest interception risk for a mobile worker in an airport?","op":["A Bluetooth headset","Cellular data on a 4G or 5G network","NFC tap-to-pay","Public Wi-Fi without a VPN"],"a":[3],"n":1,"e":"Untrusted Wi-Fi is the easiest to intercept."},{"o":"4.1","s":"In a BYOD program, what BEST protects corporate data while respecting employee privacy?","op":["Requiring a company-approved model","Full MDM enrollment with full-device wipe","A managed work container with selective wipe","Monitoring all apps on the device"],"a":[2],"n":1,"e":"Containers separate work data so only it can be wiped."},{"o":"4.1","s":"A web form accepts an \"age\" field. Which approach BEST validates it?","op":["Escaping the value before storing it","Client-side JavaScript that rejects letters and negative numbers","Server-side allow-list check for a number from 0 to 120","Encrypting the value before storing it"],"a":[2],"n":1,"e":"Validation must run on the server and allow only expected values."},{"o":"4.1","s":"A developer sets session cookies with Secure and HttpOnly. Which attack does HttpOnly MOST directly limit?","op":["SQL injection","Session theft by sniffing unencrypted traffic","Session theft through cross-site scripting","Cross-site request forgery"],"a":[2],"n":1,"e":"HttpOnly blocks script access to the cookie; Secure prevents sending it over HTTP; CSRF needs other defenses."},{"o":"4.1","s":"A team wants to find flaws such as hard-coded passwords in source code before it's compiled. Which technique fits?","op":["Penetration testing","Fuzzing","Static code analysis","Dynamic analysis"],"a":[2],"n":1,"e":"Static analysis reviews code without running it."},{"o":"4.1","s":"Users need assurance a downloaded installer came from the real developer and wasn't altered. What should the developer use?","op":["Hosting the installer over HTTPS","An MD5 hash posted on the same download page","Obfuscating the installer","Code signing"],"a":[3],"n":1,"e":"An attacker who replaces the file can replace a hash on the same page too; HTTPS protects only transit."},{"o":"4.1","s":"An analyst wants to see what an unknown attachment does without risking the network. What should she use?","op":["A honeypot","An application allow list","A static hash lookup","A sandbox"],"a":[3],"n":1,"e":"A sandbox runs the file in isolation and records its behavior."},{"o":"4.1","s":"Which pair of practices MOST effectively prevents cross-site scripting?","op":["Input validation and output encoding","Code signing and sandboxing","TLS and HSTS","Parameterized queries and stored procedures"],"a":[0],"n":1,"e":"Parameterized queries stop SQLi; encoding output stops injected script from executing."},{"o":"4.1","s":"A tester bypasses a form's JavaScript checks by sending requests directly through a proxy tool and injects a script. What is the root problem?","op":["The site does not use HTTPS","The app lacks output encoding in its logs","The form fields lack HTML length limits","The app relies only on client-side validation"],"a":[3],"n":1,"e":"Anything enforced only in the browser can be bypassed."},{"o":"4.1","s":"After launch, a team watches application logs and error rates for signs of attack and abuse. Which practice is this?","op":["Penetration testing","Sandboxing","Static analysis","Monitoring"],"a":[3],"n":1,"e":"Ongoing observation in production is monitoring."},{"o":"4.2","s":"Each server in the CMDB lists a named person accountable for its patching and access approvals. Which concept is this?","op":["Enumeration","Ownership","Classification","Inventory"],"a":[1],"n":1,"e":"Named accountability is ownership."},{"o":"4.2","s":"A discovery scan finds 37 devices that aren't in the asset inventory. Which activity found them?","op":["Assignment","Procurement","Classification","Enumeration"],"a":[3],"n":1,"e":"Discovering assets is enumeration."},{"o":"4.2","s":"Leased laptops must go back to the vendor with no company data on them. Which disposal method fits?","op":["A quick format of the drive","Deleting the user profiles","Physical destruction by shredding at a certified facility","Sanitization by overwriting or cryptographic erase"],"a":[3],"n":1,"e":"Shredding prevents return, and formatting or deleting profiles leaves recoverable data."},{"o":"4.2","s":"Drives that held classified data won't be reused and must be unrecoverable. Which method fits BEST?","op":["Physical destruction","Overwriting with zeros","Degaussing the SSDs","Cryptographic erase"],"a":[0],"n":1,"e":"Destruction is the strongest assurance; degaussing doesn't work on SSDs."},{"o":"4.2","s":"After a vendor destroys old drives, which document proves it was done correctly?","op":["The vendor's invoice","A certificate of destruction listing serial numbers","A statement of work","A chain of custody form signed when the vendor picked them up"],"a":[1],"n":1,"e":"Chain of custody covers transfer; the certificate proves destruction."},{"o":"4.2","s":"Financial records must be kept seven years and then deleted. Which concept is this?","op":["Data retention","Data sovereignty","Archiving","Legal hold"],"a":[0],"n":1,"e":"Retention sets how long data is kept; a legal hold suspends deletion."},{"o":"4.2","s":"Why is an accurate asset inventory the foundation of vulnerability management?","op":["It replaces the need for network monitoring","Unknown assets never get scanned or patched","It classifies the data on each asset","It determines each asset's CVSS score"],"a":[1],"n":1,"e":"You can't scan or patch what you don't know exists."},{"o":"4.2","s":"Before buying a new firewall line, a company reviews the vendor's patch history and support lifecycle. Which asset management phase is this?","op":["Acquisition/procurement","Disposal/decommissioning","Monitoring/asset tracking","Assignment/accounting"],"a":[0],"n":1,"e":"Security review before purchase is procurement."},{"o":"4.3","s":"An analyst monitors hidden marketplaces for listings of the company's stolen data. Which source is this?","op":["OSINT","Package monitoring","Proprietary feed","Dark web"],"a":[3],"n":1,"e":"Hidden marketplaces and forums are dark web sources."},{"o":"4.3","s":"A company pays outside researchers per valid vulnerability found in its public app. What is this?","op":["A system audit","A penetration test","A bug bounty program","A vulnerability scanning service"],"a":[2],"n":1,"e":"A pentest is a contracted, time-boxed engagement; bounties reward individual findings."},{"o":"4.3","s":"A tool sends malformed inputs to a running web app and watches for crashes and odd responses. Which method is this?","op":["Package monitoring","Static analysis","Code review","Dynamic analysis"],"a":[3],"n":1,"e":"Testing the running application is dynamic analysis."},{"o":"4.3","s":"Developers want an alert when a third-party library in their software gets a new CVE. Which method fits?","op":["Static analysis","Threat hunting","Dynamic analysis","Package monitoring"],"a":[3],"n":1,"e":"Package monitoring tracks dependencies."},{"o":"4.3","s":"A company wants to know whether an attacker could chain weaknesses to reach its payroll data. Which method answers this BEST?","op":["A threat feed subscription","A system audit","A penetration test","A credentialed vulnerability scan"],"a":[2],"n":1,"e":"Scans list weaknesses; only a pentest chains them to show real impact."},{"o":"4.3","s":"An auditor checks whether systems follow documented security controls rather than hunting for exploits. Which method is this?","op":["A penetration test","A system or process audit","A bug bounty","A vulnerability scan"],"a":[1],"n":1,"e":"Audits measure compliance with controls."},{"o":"4.3","s":"A security team pays a vendor for a curated feed of indicators of compromise. Which source is this?","op":["Open-source intelligence","Information-sharing organization","Dark web monitoring","Proprietary/third-party threat feed"],"a":[3],"n":1,"e":"Paid vendor feeds are proprietary."},{"o":"4.3","s":"Regional banks exchange indicators through a sector group with membership rules. What is this?","op":["A proprietary threat feed","A bug bounty program","An information-sharing organization","An open-source intelligence site"],"a":[2],"n":1,"e":"Sector groups such as ISACs share intelligence among members."},{"o":"4.3","s":"A critical flaw can't be patched for 60 days, so management approves extra monitoring and network restrictions until then. What is this?","op":["Risk transference to the vendor","Risk acceptance with no further action","Completed remediation of the flaw through network segmentation","Compensating controls under a documented exception"],"a":[3],"n":1,"e":"It's a documented, temporary deviation with compensating controls; the flaw is not remediated."},{"o":"4.3","s":"The patch team says all critical findings are fixed. How should security validate this?","op":["Check the vendor's release notes","Ask system owners to confirm by email","Rescan the affected systems","Review the patch team's change tickets"],"a":[2],"n":1,"e":"Only a rescan verifies the actual state."},{"o":"4.3","s":"A company with low risk tolerance finds a medium-severity flaw on its main customer database. What is MOST appropriate?","op":["Accept it because medium findings are below threshold","Fix it in the normal monthly cycle along with the other medium findings","Prioritize it because of the asset's value and the low tolerance","Wait for the CVSS score to be updated"],"a":[2],"n":1,"e":"Asset value and tolerance drive priority, not severity alone."},{"o":"4.3","s":"Which value estimates the percentage of an asset's value lost if a vulnerability is exploited?","op":["Risk tolerance","CVSS base score","Exposure factor","Annualized rate of occurrence"],"a":[2],"n":1,"e":"EF is the percentage lost per incident."},{"o":"4.3","s":"Forty servers share a CVSS 8.1 finding, and only 10 can be fixed this week. What should decide the first 10?","op":["The order the scanner listed them in","The servers owned by the largest departments","The servers running the oldest operating systems and hardware first","Each server's exposure, data sensitivity, and criticality"],"a":[3],"n":1,"e":"Environmental context sets priority when scores tie."},{"o":"4.3","s":"Two findings: CVSS 9.8 on an isolated test server with no data, and CVSS 7.5 on an internet-facing payment server. Which should be fixed FIRST?","op":["The 9.8, because the base score sets priority","The 9.8, because it is closer to critical","The 7.5 on the internet-facing payment server","Both together, since both are high severity"],"a":[2],"n":1,"e":"Exposure and asset value can outweigh the base score."},{"o":"4.3","s":"A scanner flags an Apache flaw on a server running IIS, where Apache was never installed. What should the analyst do?","op":["Treat it as real until a rescan clears it","Patch Apache components to close it","Request a risk exception for it","Verify, then document it as a false positive"],"a":[3],"n":1,"e":"Once verified, it's a false positive; exceptions and patches are for real findings."},{"o":"4.3","s":"A tester exploits a two-year-old, published vulnerability on a service that last week's scan reported as clean. What does this indicate?","op":["The tester used a zero-day","The scan produced a false positive","The service was patched after the scan","The scan produced a false negative"],"a":[3],"n":1,"e":"A known flaw was missed by the scan."},{"o":"4.4","s":"A team tracks error rates and response times of its customer web app to spot attacks and failures. Which resource type is being monitored?","op":["Systems","Network","Applications","Infrastructure"],"a":[2],"n":1,"e":"App behavior is application monitoring."},{"o":"4.4","s":"A SIEM emails the SOC when one account has five failed logins in a minute. Which activity is this?","op":["Scanning","Reporting","Alerting","Archiving"],"a":[2],"n":1,"e":"Notifying on a condition is alerting."},{"o":"4.4","s":"After closing an alert, the SOC confirms the fix worked and the activity stopped. Which step is this?","op":["Quarantine","Log aggregation","Validation","Alert tuning"],"a":[2],"n":1,"e":"Confirming remediation is validation."},{"o":"4.4","s":"Management receives a monthly summary of incidents, response times, and trends. Which activity is this?","op":["Log aggregation","Reporting","Alerting","Alert tuning"],"a":[1],"n":1,"e":"Periodic summaries are reporting."},{"o":"4.4","s":"Logs from firewalls, servers, and SaaS apps are forwarded to one platform so analysts can search them together. What is this?","op":["Log archiving","Alert tuning","Log retention","Log aggregation"],"a":[3],"n":1,"e":"Collecting logs centrally is aggregation."},{"o":"4.4","s":"A SIEM rule fires 500 times a day for a known backup service account, and analysts start ignoring it. What should be done?","op":["Archive the rule's alerts automatically without review","Tune the rule to exclude the expected activity","Raise the rule's severity","Disable the rule entirely"],"a":[1],"n":1,"e":"Tuning removes noise without losing coverage."},{"o":"4.4","s":"Logs older than 90 days move to cheaper storage but are kept for seven years. What is this?","op":["Archiving","Alert tuning","Quarantine","Aggregation"],"a":[0],"n":1,"e":"Long-term storage for retention is archiving."},{"o":"4.4","s":"EDR moves a suspicious executable to a protected folder where it can't run, pending review. What is this?","op":["Quarantine","Deletion","Host isolation","Sandboxing"],"a":[0],"n":1,"e":"Quarantine applies to the file; isolation applies to the whole host."},{"o":"4.4","s":"A company can't install software on its legacy network appliances but wants to monitor them. Which approach fits BEST?","op":["Agentless monitoring through SNMP and syslog","Antivirus scans of the appliances","Agent-based EDR on each appliance","A host-based IPS installed on each legacy appliance"],"a":[0],"n":1,"e":"Every alternative requires installing software."},{"o":"4.4","s":"A hardening team configures servers to the Center for Internet Security's recommendations. What are these called?","op":["Threat feeds","Policies","Playbooks","Benchmarks"],"a":[3],"n":1,"e":"CIS publishes configuration benchmarks."},{"o":"4.4","s":"Which tool identifies missing patches and known weak configurations across thousands of hosts?","op":["Packet analyzer","Network IDS","SIEM","Vulnerability scanner"],"a":[3],"n":1,"e":"Vulnerability scanners find known flaws at scale."},{"o":"4.4","s":"Which tool correlates events from many sources in real time to detect multi-stage attacks?","op":["Log archive","SOAR","SIEM","NetFlow collector"],"a":[2],"n":1,"e":"SOAR automates responses; correlation is the SIEM's job."},{"o":"4.4","s":"A switch sends an unsolicited alert to the monitoring server when a power supply fails. What is this?","op":["An SNMP GET request","An SNMP trap","A NetFlow record","A syslog archive entry"],"a":[1],"n":1,"e":"Device-initiated SNMP alerts are traps; GET requests come from the manager."},{"o":"4.4","s":"Which source shows which hosts talked, on which ports, and how much data moved, without payload contents?","op":["NetFlow","SNMP polling","DLP logs","Full packet capture"],"a":[0],"n":1,"e":"Flow records capture metadata, not content."},{"o":"4.4","s":"A company must stop employees from emailing spreadsheets with card numbers outside the company. Which tool fits BEST?","op":["A SIEM","DLP","An email spam filter","A web proxy"],"a":[1],"n":1,"e":"DLP inspects content and blocks sensitive data."},{"o":"4.4","s":"Which standard lets scanners exchange configuration checks and results in a common, machine-readable format?","op":["NetFlow","CVSS","SCAP","STIX"],"a":[2],"n":1,"e":"STIX shares threat intelligence; SCAP standardizes security automation content."},{"o":"4.5","s":"A mail server must receive mail from other servers and let users read mail with encrypted IMAP. Which ports should be allowed inbound? (Choose two.)","op":["TCP 25","TCP 143","TCP 995","TCP 993","TCP 587"],"a":[0,3],"n":2,"e":"25 is server-to-server SMTP and 993 is IMAPS; 143 is plain IMAP, 587 is submission, and 995 is POP3S."},{"o":"4.5","s":"Why are public web servers placed in a screened subnet rather than on the internal LAN?","op":["It lets the servers bypass the perimeter firewall","It removes the need for a WAF","A compromised server can't directly reach internal systems","It lets the servers use private addresses instead of public ones"],"a":[2],"n":1,"e":"The screened subnet limits the blast radius."},{"o":"4.5","s":"Even without a final \"deny any any\" rule, a firewall drops traffic that matches no rule. What is this behavior called?","op":["Default route","Stateful inspection","Explicit deny","Implicit deny"],"a":[3],"n":1,"e":"Unmatched traffic is denied by default."},{"o":"4.5","s":"An allow rule for TCP 443 to 10.0.0.5 sits below a rule denying all traffic to 10.0.0.0/24. What happens to HTTPS traffic to 10.0.0.5?","op":["It is blocked by the deny rule above it","It is blocked only when logging is enabled","It is allowed because allow rules override denies","It is allowed because the allow rule is more specific"],"a":[0],"n":1,"e":"Rules are read top-down and the first match wins; specificity doesn't matter."},{"o":"4.5","s":"Clients resolve names fine, but large DNS responses and zone transfers to the secondary server fail. Which rule is MOST likely missing?","op":["UDP 123","UDP 53","TCP 53","TCP 853"],"a":[2],"n":1,"e":"Large responses and zone transfers use TCP 53; 853 is DNS over TLS."},{"o":"4.5","s":"Admins need encrypted remote shell access to Linux servers, but the firewall only allows TCP 23. Which change is correct?","op":["Keep TCP 23 and require longer passwords","Allow UDP 22 alongside TCP 23","Allow TCP 22 and remove TCP 23","Allow TCP 3389 for remote management"],"a":[2],"n":1,"e":"SSH uses TCP 22; Telnet should go."},{"o":"4.5","s":"An IDS raises an alert because traffic matches a known exploit pattern. Which detection method is this?","op":["Anomaly-based","Behavioral","Heuristic","Signature-based"],"a":[3],"n":1,"e":"Matching known patterns is signature-based detection."},{"o":"4.5","s":"An IPS flags a server that suddenly sends 10 times its normal outbound volume, though no signature matches. Which method detected it?","op":["Reputation filtering","Signature-based detection","Anomaly-based detection","Stateful inspection"],"a":[2],"n":1,"e":"Deviation from a baseline is anomaly detection."},{"o":"4.5","s":"A domain must always be blocked regardless of category or reputation. What should the admin create?","op":["A new content category","An explicit block rule","A lower reputation threshold","A DNSSEC record"],"a":[1],"n":1,"e":"Explicit rules override categories and scores."},{"o":"4.5","s":"A web filter blocks a domain registered yesterday with no history, though its category is \"Business.\" Which feature blocked it?","op":["Reputation","An explicit block rule","Content categorization","URL scanning"],"a":[0],"n":1,"e":"A new, unknown domain scores poorly on reputation."},{"o":"4.5","s":"A company blocks all \"gambling\" and \"adult\" sites without listing each one. Which feature is this?","op":["Explicit block rules","Content categorization","Reputation scoring","DNS sinkholing"],"a":[1],"n":1,"e":"Categories group sites so they can be blocked together."},{"o":"4.5","s":"Laptops must be filtered at home and in hotels without routing traffic through headquarters. Which approach fits BEST?","op":["Agent-based filtering on each laptop","DNS filtering on the office resolver","A centralized proxy at headquarters","URL rules on the perimeter firewall"],"a":[0],"n":1,"e":"Only an agent travels with the device."},{"o":"4.5","s":"All office browsing passes through one server that filters and logs it. What is this?","op":["An agent-based filter","A centralized proxy","A reverse proxy","A jump server"],"a":[1],"n":1,"e":"A forward proxy in the path filters outbound browsing."},{"o":"4.5","s":"Malware on a laptop tries to resolve its C2 domain, and the company resolver returns no address. Which control acted?","op":["DNSSEC validation","DNS filtering","Split-horizon DNS","Proxy content categorization"],"a":[1],"n":1,"e":"DNSSEC validates authenticity; it doesn't block domains."},{"o":"4.5","s":"A legitimate file-sharing site hosts one malicious page. Which feature blocks only that page?","op":["DNS filtering","Content categorization","Domain reputation","URL scanning"],"a":[3],"n":1,"e":"DNS filtering and domain reputation work at the domain level, which would block the whole site."},{"o":"4.5","s":"Why can DNS filtering stop malware that uses non-standard ports?","op":["It blocks the name lookup before any connection starts","It blocks all ports except 80 and 443","It decrypts TLS to read the destination","It inspects traffic on every port for signatures"],"a":[0],"n":1,"e":"Without a resolved address, the connection never begins."},{"o":"4.5","s":"Which Linux feature enforces mandatory access control on processes, even when they run as root?","op":["sudo","chmod permissions","SELinux","iptables"],"a":[2],"n":1,"e":"SELinux policy constrains even root processes."},{"o":"4.5","s":"An admin must replace FTP with something that encrypts credentials and data and uses a single port. Which fits BEST?","op":["TFTP","SFTP","FTPS","FTP over port 990"],"a":[1],"n":1,"e":"FTPS encrypts but still uses separate control and data channels; SFTP runs over one SSH connection."},{"o":"4.5","s":"Network devices are monitored with SNMPv2c. Which change adds authentication and encryption?","op":["Upgrade to SNMPv3","Set SNMP to read-only","Change the community strings","Move SNMP to TCP"],"a":[0],"n":1,"e":"Only SNMPv3 adds security features."},{"o":"4.5","s":"Receiving servers check whether the sending IP address is authorized to send mail for the sender's domain. Which mechanism is this?","op":["DKIM","SPF","MX","DMARC"],"a":[1],"n":1,"e":"SPF lists authorized sending servers."},{"o":"4.5","s":"Which mechanism lets receivers verify a message's content wasn't changed after the sending domain signed it?","op":["DKIM","SPF","DMARC","S/MIME"],"a":[0],"n":1,"e":"DKIM is a domain-level signature; S/MIME is signed by the individual user."},{"o":"4.5","s":"A domain owner wants receivers to quarantine mail that fails authentication and to send aggregate reports. What should be published?","op":["A DMARC policy","An SPF record ending in -all","A TLS-RPT record","A DKIM public key"],"a":[0],"n":1,"e":"SPF's -all fails mail but sends no reports; DMARC sets the policy and the reporting."},{"o":"4.5","s":"An application must query Active Directory over an encrypted connection. Which protocol and port fit?","op":["Global catalog on TCP 3268","LDAPS on TCP 636","LDAP on TCP 389","Kerberos on TCP 88"],"a":[1],"n":1,"e":"636 is LDAP over TLS; 389 and 3268 are unencrypted."},{"o":"4.5","s":"Which Windows feature pushes settings such as password rules and USB restrictions to every domain computer?","op":["SELinux","Local Security Policy","Windows Defender Firewall","Group Policy"],"a":[3],"n":1,"e":"Local Security Policy applies to one machine; Group Policy applies domain-wide."},{"o":"4.5","s":"Laptops must prove current antivirus and patches before joining the network. Which control provides this?","op":["802.1X with MAC authentication bypass","Network access control with posture checks","EDR with automatic isolation","DLP endpoint agents"],"a":[1],"n":1,"e":"NAC evaluates device health before admission."},{"o":"4.5","s":"Which tool records detailed endpoint activity for investigations and can isolate a host automatically?","op":["EDR","File integrity monitoring","A host-based IPS","Antivirus"],"a":[0],"n":1,"e":"EDR records activity and responds."},{"o":"4.5","s":"A platform combines detections from endpoints, email, network, and cloud into single incidents with built-in response actions. What is it?","op":["UBA","EDR","NAC","XDR"],"a":[3],"n":1,"e":"XDR extends detection and response across many layers."},{"o":"4.5","s":"A system learns each user's normal behavior and alerts when an accountant downloads thousands of engineering files at 2 a.m. What is it?","op":["A static SIEM correlation rule","User behavior analytics","File integrity monitoring","Data loss prevention"],"a":[1],"n":1,"e":"Learning baselines and flagging deviations is UBA."},{"o":"4.5","s":"DLP detects an upload of Social Security numbers to personal cloud storage. Under a blocking policy, what happens?","op":["The upload proceeds but is logged for the weekly review","The user's account is disabled","The file is encrypted before upload","The upload is blocked and security is alerted"],"a":[3],"n":1,"e":"A blocking policy stops the transfer and notifies."},{"o":"4.5","s":"A contractor's laptop fails the NAC posture check. What does NAC typically do?","op":["Wipe the laptop remotely","Place it on a remediation network","Allow full access but log the failure","Deny it network access permanently"],"a":[1],"n":1,"e":"Noncompliant devices get restricted access until fixed."},{"o":"4.5","s":"Which control would detect that a web server's homepage was replaced with a defaced version?","op":["File integrity monitoring","Data loss prevention","A web application firewall","Network access control"],"a":[0],"n":1,"e":"A WAF might block an upload attempt, but detecting a changed file is FIM's job."},{"o":"4.5","s":"A tool alerts when system binaries or config files on a server change unexpectedly. What is it?","op":["File integrity monitoring","User behavior analytics","A host-based IPS","Data loss prevention"],"a":[0],"n":1,"e":"FIM detects file changes."},{"o":"4.6","s":"A mobile app offers \"Continue with your work account\" and needs the user's name and email to build her profile. Which protocol BEST fits?","op":["RADIUS","OpenID Connect","TACACS+","OAuth on its own"],"a":[1],"n":1,"e":"OIDC adds identity (who the user is) on top of OAuth; OAuth alone only grants access."},{"o":"4.6","s":"Users log in to their Windows laptops each morning and then reach file shares and printers all day without retyping passwords. What provides this?","op":["OAuth","SAML","RADIUS","Kerberos"],"a":[3],"n":1,"e":"Windows domain single sign-on uses Kerberos tickets."},{"o":"4.6","s":"At each login, an HR system checks which department and security groups a user belongs to in Active Directory. Which protocol performs the lookup?","op":["SAML","LDAP","Kerberos","OAuth"],"a":[1],"n":1,"e":"Looking up attributes in a directory is LDAP; Kerberos only proves who the user is."},{"o":"4.6","s":"An employee moved from sales to finance six months ago, yet a review shows she still has access to the sales CRM. Which process failed?","op":["Identity proofing during her original hiring","Federation between the sales and finance apps","Single sign-on across the company's systems","De-provisioning access she no longer needs"],"a":[3],"n":1,"e":"Old access should be removed when roles change."},{"o":"4.6","s":"Every quarter, managers get a list of their team's access rights and must confirm or remove each one. Which process is this?","op":["Federation","Identity proofing","Access attestation","Provisioning"],"a":[2],"n":1,"e":"Periodic recertification of access is attestation."},{"o":"4.6","s":"An online bank requires new customers to upload a government ID and complete a live video check before an account is created. What is the purpose of this step?","op":["Federation","Single sign-on","Identity proofing","Attestation"],"a":[2],"n":1,"e":"It proves a person's identity before credentials are issued."},{"o":"4.6","s":"Employees sign in once each morning, then open the HR portal, the expense system, and a partner company's training site in their browser without entering credentials again. Which technology MOST likely enables the partner site access?","op":["TACACS+ authorization","LDAP directory queries","RADIUS authentication","SAML federation"],"a":[3],"n":1,"e":"Browser single sign-on across organizations, using assertions from the identity provider, is SAML federation."},{"o":"4.6","s":"A photo-printing website asks permission to pull pictures from a user's cloud photo account. She approves on the photo service's own page, and the printing site never sees her password. Which protocol is in use?","op":["Kerberos","OAuth","SAML","LDAP"],"a":[1],"n":1,"e":"Granting an app limited access to your data with a token is OAuth's delegated authorization."},{"o":"4.6","s":"Access to a research portal is allowed only if the user's department is R&D, the device is company-managed, and the date falls within the project's contract period. Which model BEST fits?","op":["Attribute-based access control","Discretionary access control","Time-of-day restrictions","Role-based access control"],"a":[0],"n":1,"e":"Several attributes evaluated together is ABAC; time alone wouldn't cover department and device."},{"o":"4.6","s":"A firewall drops all inbound traffic to port 3389 for every user and device. Which access control model does this represent?","op":["Role-based access control","Attribute-based access control","Mandatory access control","Rule-based access control"],"a":[3],"n":1,"e":"Rules applied to everyone regardless of identity are rule-based."},{"o":"4.6","s":"Contractors should log in only during business hours, while employees can log in anytime. Which control BEST implements this?","op":["Permissions chosen by each contractor themselves","Time-of-day restrictions on the contractor group","Mandatory access control labels on all systems","A longer password policy for contractor accounts"],"a":[1],"n":1,"e":"Time-based restrictions limit when access is allowed."},{"o":"4.6","s":"A company with 4,000 employees and 300 job functions wants simpler onboarding and access reviews. Which model would MOST reduce the administrative effort?","op":["Role-based access control","Mandatory access control","Permissions assigned user by user","Discretionary access control"],"a":[0],"n":1,"e":"RBAC manages access at scale through roles."},{"o":"4.6","s":"Which model allows the MOST fine-grained, context-aware decisions, such as weighing location, device health, and data sensitivity together?","op":["Rule-based access control","Role-based access control","Discretionary access control","Attribute-based access control"],"a":[3],"n":1,"e":"ABAC evaluates many attributes at once."},{"o":"4.6","s":"A defense contractor's system labels files Confidential, Secret, or Top Secret. Users can't change labels, and a Secret-cleared user can't open a Top Secret file even if a colleague tries to share it. Which model is this?","op":["Discretionary access control","Role-based access control","Mandatory access control","Attribute-based access control"],"a":[2],"n":1,"e":"System-enforced labels and clearances are MAC; the failed share shows owners can't override it, unlike DAC."},{"o":"4.6","s":"On a team's shared drive, whoever creates a folder decides which coworkers may open it. What is the main security w
